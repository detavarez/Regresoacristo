<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi avance — Instituto Bíblico Intensivo</title>
<link rel="stylesheet" href="assets/instituto.css">
</head>
<body>
<script src="data/curriculo.js?v=5"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/core.js?v=7"></script>

<main class="env" id="salida"></main>

<script>
var T = {
  es: {
    ruta: 'Historial académico', miAvance: 'Mi avance',
    resumen: function (a, c, tt) { return a + ' aprobadas · ' + c + ' en curso · ' + tt + ' en el currículo'; },
    diagInicial: 'Diagnóstico inicial', fecha: 'Fecha', resultado: 'Resultado', entradaRec: 'Entrada recomendada',
    leccion: 'Lección', fortalezas: 'Fortalezas', reforzar: 'A reforzar',
    sinDiagTit: 'Todavía no tienes diagnóstico', sinDiagTxt: 'El examen de ubicación abre tu historial académico y recomienda una lección concreta de entrada.', hacerExamen: 'Hacer el examen de ubicación',
    temasFallas: 'Temas donde más fallas', tema: 'Tema', preguntasFalladas: 'Preguntas falladas', temasNota: 'Estos temas son los que conviene repasar antes de avanzar.',
    lecciones: 'Lecciones', estado: 'Estado', mejor: 'Mejor', intentos: 'Intentos', ultimoExamen: 'Último examen', sinAbrir: 'Todavía no has abierto ninguna lección.',
    consultadas: 'Consultadas sin afectar tu avance', descargar: 'Descargar mi historial', descargarNota: 'El archivo descargado sirve como respaldo o para pasarle tus resultados al maestro.',
    estAprobada: 'aprobada', estRepasar: 'repasar', estEnCurso: 'en curso', estNueva: 'nueva'
  },
  en: {
    ruta: 'Academic record', miAvance: 'My progress',
    resumen: function (a, c, tt) { return a + ' passed · ' + c + ' in progress · ' + tt + ' in the curriculum'; },
    diagInicial: 'Initial placement', fecha: 'Date', resultado: 'Result', entradaRec: 'Recommended entry point',
    leccion: 'Lesson', fortalezas: 'Strengths', reforzar: 'To reinforce',
    sinDiagTit: "You don't have a placement result yet", sinDiagTxt: 'The placement exam opens your academic record and recommends a specific lesson to start at.', hacerExamen: 'Take the placement exam',
    temasFallas: 'Topics you miss most', tema: 'Topic', preguntasFalladas: 'Questions missed', temasNota: "These are the topics worth reviewing before moving on.",
    lecciones: 'Lessons', estado: 'Status', mejor: 'Best', intentos: 'Attempts', ultimoExamen: 'Last exam', sinAbrir: "You haven't opened any lesson yet.",
    consultadas: "Viewed without affecting your progress", descargar: 'Download my record', descargarNota: 'The downloaded file works as a backup, or to share your results with your teacher.',
    estAprobada: 'passed', estRepasar: 'needs review', estEnCurso: 'in progress', estNueva: 'new'
  }
};

INST.listo.then(function () {
if (!INST.estado) return; // sin sesión, ya redirigido a login.html

var lang = (INST.estado.config.idioma === 'en') ? 'en' : 'es';
var t = T[lang];
var locale = lang === 'en' ? 'en' : 'es';

INST.barra('prog');
var e = INST.estado, r = INST.resumen();

function estTxt(s) {
  if (s === 'aprobada') return t.estAprobada;
  if (s === 'repasar') return t.estRepasar;
  if (s === 'en-curso') return t.estEnCurso;
  return t.estNueva;
}
function tit(m) { return (lang === 'en' && m && m.ten) ? m.ten : (m ? m.t : ''); }

var out = '<div class="encabezado"><p class="ruta">' + t.ruta + '</p><h1>' +
  (e.perfil.nombre ? e.perfil.nombre : t.miAvance) + '</h1>' +
  '<div class="progreso"><i style="width:' + r.pct + '%"></i></div>' +
  '<p class="sub">' + t.resumen(r.aprobadas, r.enCurso, r.total) + '</p></div>';

if (e.diagnostico) {
  var metaRec = INST.meta(e.diagnostico.recomendada) || {};
  out += '<h2>' + t.diagInicial + '</h2><table class="datos"><tbody>' +
    '<tr><th>' + t.fecha + '</th><td>' + new Date(e.diagnostico.fecha).toLocaleDateString(locale) + '</td></tr>' +
    '<tr><th>' + t.resultado + '</th><td>' + e.diagnostico.correctas + ' / ' + e.diagnostico.total + ' (' + e.diagnostico.pctGlobal + '%)</td></tr>' +
    '<tr><th>' + t.entradaRec + '</th><td>' + t.leccion + ' ' + e.diagnostico.recomendada + (tit(metaRec) ? ' — ' + tit(metaRec) : '') + '</td></tr>' +
    (e.diagnostico.fortalezas.length ? '<tr><th>' + t.fortalezas + '</th><td>' + e.diagnostico.fortalezas.join(' · ') + '</td></tr>' : '') +
    (e.diagnostico.debilidades.length ? '<tr><th>' + t.reforzar + '</th><td>' + e.diagnostico.debilidades.join(' · ') + '</td></tr>' : '') +
    '</tbody></table>';
} else {
  out += '<div class="caja-nota"><h4>' + t.sinDiagTit + '</h4><p>' + t.sinDiagTxt + '</p>' +
    '<p><a class="btn" href="diagnostico.html">' + t.hacerExamen + '</a></p></div>';
}

var debiles = INST.temasDebiles(8);
if (debiles.length) {
  out += '<h2>' + t.temasFallas + '</h2><table class="datos"><thead><tr><th>' + t.tema + '</th><th>' + t.preguntasFalladas + '</th></tr></thead><tbody>' +
    debiles.map(function (d) { return '<tr><td>' + d.tema + '</td><td>' + d.fallos + '</td></tr>'; }).join('') +
    '</tbody></table><p class="sub">' + t.temasNota + '</p>';
}

var filas = Object.keys(e.progreso).sort().map(function (k) {
  var p = e.progreso[k], m = INST.meta(k);
  if (!m) return '';
  var ult = p.intentos.length ? p.intentos[p.intentos.length - 1] : null;
  return '<tr><td><a href="leccion.html?n=' + k + '">' + k + ' — ' + tit(m) + '</a></td>' +
    '<td>' + estTxt(p.estado) + '</td>' +
    '<td>' + (p.mejor !== null ? p.mejor + '%' : '—') + '</td>' +
    '<td>' + p.intentos.length + '</td>' +
    '<td>' + (ult ? new Date(ult.fecha).toLocaleDateString(locale) : '—') + '</td></tr>';
}).join('');

out += '<h2>' + t.lecciones + '</h2>' + (filas
  ? '<table class="datos"><thead><tr><th>' + t.leccion + '</th><th>' + t.estado + '</th><th>' + t.mejor + '</th><th>' + t.intentos + '</th><th>' + t.ultimoExamen + '</th></tr></thead><tbody>' + filas + '</tbody></table>'
  : '<p class="sub">' + t.sinAbrir + '</p>');

if (e.consultadas.length) {
  out += '<h2>' + t.consultadas + '</h2><p class="sub">' +
    e.consultadas.map(function (c) { return '<a href="leccion.html?n=' + c + '">' + c + '</a>'; }).join(' · ') + '</p>';
}

out += '<div class="acciones"><button class="btn sec" type="button" id="desc">' + t.descargar + '</button></div>' +
  '<p class="sub">' + t.descargarNota + '</p>' +
  '<footer class="pie">' + INST.VERSION + '</footer>';

document.getElementById('salida').innerHTML = out;
document.getElementById('desc').onclick = INST.exportar;

});
</script>
</body>
</html>
