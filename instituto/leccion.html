<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lección — Instituto Bíblico</title>
<link rel="stylesheet" href="assets/instituto.css">
</head>
<body>
<script src="data/curriculo.js?v=4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/core.js?v=4"></script>

<main class="env" id="salida"></main>
<div class="env"><footer class="pie" id="pie"></footer></div>

<script>
var T = {
  es: {
    lectura: 'Lectura base:', objetivos: 'Al terminar esta lección podrás', conecta: 'Conecta con',
    ejercicios: 'Ejercicios', antes: 'Antes de seguir', examen: 'Examen de la lección',
    preguntasIntro: function (n, u) { return n + ' preguntas. Se aprueba con ' + u + '%. Puedes repetirlo.'; },
    calificar: 'Calificar', reintentar: 'Intentar otra vez',
    correctasDe: function (c, t) { return c + ' de ' + t + ' correctas'; }, sinResponderTxt: function (f) { return ' · ' + f + ' sin responder'; },
    aprobado: 'Lección aprobada. Queda registrada en tu avance.',
    noAprobado: function (u) { return 'Por debajo del ' + u + '%. Repasa las secciones marcadas abajo y vuelve a intentarlo: cada pregunta fallada indica qué tema conviene releer.'; },
    temasRepaso: 'Temas para repasar: ', fuentesLink: 'Fuentes de esta lección', fuentesTit: 'Fuentes de esta lección',
    noExisteTit: 'Esa lección no existe', noExisteTxt: function (n) { return 'El número ' + n + ' no está en el currículo.'; },
    volver: 'Volver al índice', pendienteTit: 'Esta lección todavía no está escrita',
    pendienteTxt: 'Está definida en el currículo maestro y tiene su lugar reservado. El contenido se produce por etapas, empezando por las lecciones modelo.',
    modoConsulta: ' · Abierta en modo consulta: no cambia tu lección actual.', sinTraduccion: 'Esta lección todavía no está traducida al inglés — se muestra en español.'
  },
  en: {
    lectura: 'Core reading:', objetivos: 'By the end of this lesson you will be able to', conecta: 'Connects with',
    ejercicios: 'Exercises', antes: 'Before you continue', examen: 'Lesson quiz',
    preguntasIntro: function (n, u) { return n + ' questions. Pass with ' + u + '%. You can retry.'; },
    calificar: 'Grade it', reintentar: 'Try again',
    correctasDe: function (c, t) { return c + ' of ' + t + ' correct'; }, sinResponderTxt: function (f) { return ' · ' + f + ' unanswered'; },
    aprobado: 'Lesson passed. This is recorded in your progress.',
    noAprobado: function (u) { return 'Below ' + u + '%. Review the sections marked below and try again: each missed question points to what to re-read.'; },
    temasRepaso: 'Topics to review: ', fuentesLink: 'Sources for this lesson', fuentesTit: 'Sources for this lesson',
    noExisteTit: "That lesson doesn't exist", noExisteTxt: function (n) { return 'Number ' + n + ' is not in the curriculum.'; },
    volver: 'Back to the index', pendienteTit: "This lesson hasn't been written yet",
    pendienteTxt: "It is defined in the master curriculum and has its place reserved. Content is produced in stages, starting with the model lessons.",
    modoConsulta: " · Open in reference mode: this won't change your current lesson.", sinTraduccion: ''
  }
};

var params, n, consulta, meta, salida, lang, t;

INST.listo.then(function () {
  if (!INST.estado) return; // sin sesión, ya redirigido a login.html

  INST.glosarioActivo();

  params = new URLSearchParams(location.search);
  n = params.get('n');
  consulta = params.get('modo') === 'consulta';
  meta = INST.meta(n);
  salida = document.getElementById('salida');
  lang = (INST.estado.config.idioma === 'en') ? 'en' : 'es';
  t = T[lang];

  INST.barra('', meta ? ('Lección ' + meta.n + ' · Nivel ' + meta.nivel) : '');

  if (!meta) {
    salida.innerHTML = '<div class="encabezado"><h1>' + t.noExisteTit + '</h1>' +
      '<p class="sub">' + t.noExisteTxt(n || '(vacío)') + '</p>' +
      '<p><a class="btn" href="index.html">' + t.volver + '</a></p></div>';
  } else if ((window.LECCIONES_DISPONIBLES || []).indexOf(String(n)) === -1) {
    pendiente();
  } else {
    var s = document.createElement('script');
    s.src = 'data/lecciones/L' + n + '.js';
    s.onload = function () { INST.lecciones[String(n)] ? pintar(INST.lecciones[String(n)]) : pendiente(); };
    s.onerror = pendiente;
    document.body.appendChild(s);
  }
});

function campo(obj) {
  if (obj === undefined || obj === null) return null;
  if (typeof obj === 'object' && !Array.isArray(obj) && (obj.es !== undefined || obj.en !== undefined)) {
    return obj[lang] !== undefined ? obj[lang] : obj.es;
  }
  return obj;
}

function cabecera() {
  return '<div class="encabezado niv niv-' + meta.nivel + '">' +
    '<p class="ruta">' + meta.nivelNombre + ' · Módulo ' + meta.modulo + ' — ' + meta.moduloTitulo + ' · <b>Lección ' + meta.n + '</b></p>' +
    '<h1>' + meta.t + '</h1>' +
    (meta.libros && meta.libros !== '—' ? '<p class="sub">' + t.lectura + ' ' + meta.libros + '</p>' : '') +
    '</div>';
}

function pendiente() {
  salida.innerHTML = cabecera() +
    '<div class="caja-nota"><h4>' + t.pendienteTit + '</h4><p>' + t.pendienteTxt + '</p></div>' +
    pie();
  document.getElementById('pie').textContent = INST.VERSION;
  navegacion();
}

function pintar(L) {
  INST.registrarVisita(n, !consulta);
  var html = cabecera();

  var avisoIngles = (lang === 'en' && L.resumen && L.resumen.en === undefined) ? t.sinTraduccion : '';
  if (avisoIngles) html += '<div class="caja-nota"><p style="margin:0">' + avisoIngles + '</p></div>';

  var resumen = campo(L.resumen);
  if (resumen) html += '<p class="sub">' + resumen + '</p>';

  var objetivos = campo(L.objetivos);
  if (objetivos && objetivos.length) {
    html += '<h2>' + t.objetivos + '</h2><ul>' + objetivos.map(function (o) { return '<li>' + o + '</li>'; }).join('') + '</ul>';
  }

  var secciones = campo(L.secciones) || [];
  secciones.forEach(function (sec) {
    if (sec.tipo === 'texto') {
      html += '<h2>' + sec.titulo + '</h2>' + sec.html;
    } else if (sec.tipo === 'posturas') {
      html += '<h2>' + sec.titulo + '</h2>' + (sec.intro || '');
      sec.posturas.forEach(function (p) {
        html += '<div class="postura"><h4>' + p.nombre + '</h4>' +
          (p.quien ? '<p class="quien">' + p.quien + '</p>' : '') +
          '<p>' + p.argumento + '</p>' +
          (p.fortalezas ? '<p><b>' + (lang === 'en' ? 'In favor:' : 'A favor:') + '</b> ' + p.fortalezas + '</p>' : '') +
          (p.dificultades ? '<p><b>' + (lang === 'en' ? 'Difficulty:' : 'Dificultad:') + '</b> ' + p.dificultades + '</p>' : '') +
          '</div>';
      });
      if (sec.conclusion) html += '<div class="caja-nota"><h4>' + (lang === 'en' ? "The Institute's conclusion" : 'Conclusión del Instituto') + '</h4><p>' + sec.conclusion + '</p></div>';
    } else if (sec.tipo === 'errores') {
      html += '<h2>' + (sec.titulo || (lang === 'en' ? 'Common mistakes' : 'Errores frecuentes')) + '</h2>';
      sec.items.forEach(function (it) {
        html += '<div class="postura"><h4>' + it[0] + '</h4><p>' + it[1] + '</p></div>';
      });
    } else if (sec.tipo === 'nota') {
      html += '<div class="caja-nota"><h4>' + sec.titulo + '</h4>' + sec.html + '</div>';
    }
  });

  var ejercicios = campo(L.ejercicios);
  if (ejercicios && ejercicios.length) {
    html += '<h2>' + t.ejercicios + '</h2><ol>' + ejercicios.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol>';
  }

  var transferencia = campo(L.transferencia);
  if (transferencia) {
    html += '<div class="caja-nota"><h4>' + t.antes + '</h4><p>' + transferencia + '</p></div>';
  }

  var quiz = campo(L.quiz);
  if (quiz && quiz.length) {
    html += '<h2 id="examen">' + t.examen + '</h2>' +
      '<p class="sub">' + t.preguntasIntro(quiz.length, CURRICULO.umbralAprobacion) + '</p>' +
      '<form id="quiz">' + quiz.map(function (q, i) {
        return '<div class="qcard" data-i="' + i + '"><p class="qt">' + (i + 1) + '. ' + q.p + '</p>' +
          q.opciones.map(function (o, j) {
            return '<label class="opt"><input type="radio" name="q' + i + '" value="' + j + '"><span>' + o + '</span></label>';
          }).join('') + '<div class="explica" hidden></div></div>';
      }).join('') +
      '<div class="acciones"><button type="button" class="btn" id="calificar">' + t.calificar + '</button>' +
      '<button type="button" class="btn sec" id="reiniciar" hidden>' + t.reintentar + '</button></div></form>' +
      '<div id="marcador" hidden></div>';
  }

  if (L.fuentes && L.fuentes.length) {
    html += '<div id="fuentesPop" class="fpop" hidden><div class="fpop-caja"><button type="button" id="fuentesCerrar" aria-label="Cerrar">&times;</button>' +
      '<h4>' + t.fuentesTit + '</h4><ul>' + L.fuentes.map(function (f) { return '<li>' + f + '</li>'; }).join('') + '</ul></div></div>';
  }

  html += pie();
  salida.innerHTML = html;
  var pieHtml = 'Lección ' + meta.n + ' · ' + INST.VERSION + (consulta ? t.modoConsulta : '');
  if (L.fuentes && L.fuentes.length) {
    pieHtml += ' · <button type="button" class="fuentes-link" id="abrirFuentes">' + t.fuentesLink + '</button>';
  }
  document.getElementById('pie').innerHTML = pieHtml;
  if (L.fuentes && L.fuentes.length) {
    var fpop = document.getElementById('fuentesPop');
    document.getElementById('abrirFuentes').onclick = function () { fpop.hidden = false; };
    document.getElementById('fuentesCerrar').onclick = function () { fpop.hidden = true; };
    fpop.addEventListener('click', function (e) { if (e.target === fpop) fpop.hidden = true; });
  }
  navegacion();
  if (quiz && quiz.length) armarQuiz(quiz);
}

function pie() { return '<div class="pieleccion" id="nav"></div>'; }

function navegacion() {
  var v = INST.vecinas(n), c = document.getElementById('nav');
  if (!c) return;
  c.innerHTML =
    (v.anterior ? '<a href="leccion.html?n=' + v.anterior.n + '">← ' + v.anterior.n + ' · ' + v.anterior.t + '</a>' : '<span></span>') +
    (v.siguiente ? '<a href="leccion.html?n=' + v.siguiente.n + '" style="text-align:right">' + v.siguiente.n + ' · ' + v.siguiente.t + ' →</a>' : '<span></span>');
}

function armarQuiz(quiz) {
  var form = document.getElementById('quiz');
  var marcador = document.getElementById('marcador');
  var btn = document.getElementById('calificar');
  var re = document.getElementById('reiniciar');

  btn.onclick = function () {
    var correctas = 0, falladas = [], faltan = 0;
    quiz.forEach(function (q, i) {
      var card = form.querySelector('.qcard[data-i="' + i + '"]');
      var sel = form.querySelector('input[name="q' + i + '"]:checked');
      card.querySelectorAll('.opt').forEach(function (o) { o.classList.remove('correcta', 'incorrecta'); });
      var opts = card.querySelectorAll('.opt');
      opts[q.correcta].classList.add('correcta');
      if (!sel) { faltan++; falladas.push({ i: i, tema: q.tema }); }
      else if (parseInt(sel.value, 10) === q.correcta) { correctas++; }
      else { opts[parseInt(sel.value, 10)].classList.add('incorrecta'); falladas.push({ i: i, tema: q.tema }); }
      var ex = card.querySelector('.explica');
      ex.hidden = false;
      ex.innerHTML = q.explica + (q.tema ? ' <span class="certeza">' + q.tema + '</span>' : '');
    });

    var intento = INST.registrarExamen(n, { correctas: correctas, total: quiz.length, falladas: falladas });
    var aprobado = intento.pct >= CURRICULO.umbralAprobacion;
    marcador.hidden = false;
    marcador.innerHTML = '<div class="pct">' + intento.pct + '%</div>' +
      '<p>' + t.correctasDe(correctas, quiz.length) + (faltan ? t.sinResponderTxt(faltan) : '') + '.</p>' +
      '<p>' + (aprobado ? t.aprobado : t.noAprobado(CURRICULO.umbralAprobacion)) + '</p>' +
      (falladas.length ? '<p class="sub">' + t.temasRepaso +
        falladas.map(function (f) { return f.tema || '—'; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(' · ') + '</p>' : '');
    marcador.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    re.hidden = false;
  };

  re.onclick = function () {
    form.reset();
    form.querySelectorAll('.opt').forEach(function (o) { o.classList.remove('correcta', 'incorrecta'); });
    form.querySelectorAll('.explica').forEach(function (x) { x.hidden = true; });
    marcador.hidden = true;
    document.getElementById('examen').scrollIntoView({ behavior: 'smooth' });
  };
}
</script>
</body>
</html>
