<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instituto Bíblico Intensivo</title>
<link rel="stylesheet" href="assets/instituto.css">
</head>
<body>
<script src="data/curriculo.js"></script>
<script src="assets/core.js"></script>

<main>
  <section class="hero">
    <div class="env">
      <p class="estado" id="estadoLinea"></p>
      <h1 class="grande" id="titular">Instituto Bíblico Intensivo</h1>
      <p class="sub" id="bajada">Un programa completo de formación bíblica: desde quien nunca ha abierto una Biblia hasta quien prepara a otros para enseñar y predicar.</p>
      <div class="progreso" id="barraProg" hidden><i style="width:0%"></i></div>
      <div class="acciones" id="acciones"></div>
      <div class="buscador">
        <input type="search" id="q" placeholder="Buscar una lección, un libro o un tema" aria-label="Buscar en el Instituto">
        <div id="resultados"></div>
      </div>
    </div>
  </section>

  <div class="env" id="mapa"></div>

  <div class="env"><footer class="pie">
    Instituto Bíblico Intensivo · <span id="verPie"></span> · Tu progreso se guarda solo en este navegador. Descárgalo desde Ajustes para no perderlo.
  </footer></div>
</main>

<script>
INST.barra('indice');
INST.glosarioActivo();
document.getElementById('verPie').textContent = INST.VERSION;

var disp = window.LECCIONES_DISPONIBLES || [];
var r = INST.resumen();
var e = INST.estado;

function estadoLeccion(n) {
  var p = e.progreso[String(n)];
  if (!p) return '';
  if (p.estado === 'aprobada') return 'aprobada ' + p.mejor + '%';
  if (p.estado === 'repasar') return 'repasar';
  if (p.estado === 'en-curso') return 'en curso';
  return '';
}

(function hero() {
  var linea = document.getElementById('estadoLinea');
  var titular = document.getElementById('titular');
  var bajada = document.getElementById('bajada');
  var acc = document.getElementById('acciones');
  var barra = document.getElementById('barraProg');

  if (e.leccionActual) {
    var m = INST.meta(e.leccionActual);
    linea.textContent = m.nivelNombre + ' · Módulo ' + m.modulo + ' · ' + m.area;
    titular.textContent = 'Lección ' + m.n + ' — ' + m.t;
    bajada.textContent = r.aprobadas + ' de ' + r.total + ' lecciones aprobadas.';
    barra.hidden = false;
    barra.querySelector('i').style.width = r.pct + '%';
    acc.innerHTML = '<a class="btn" href="leccion.html?n=' + m.n + '">Continuar</a>' +
                    '<a class="btn sec" href="progreso.html">Ver mi avance</a>';
  } else if (e.diagnostico) {
    linea.textContent = 'Ubicación completada';
    titular.textContent = 'Empieza en la lección ' + e.diagnostico.recomendada;
    bajada.textContent = e.diagnostico.razon;
    acc.innerHTML = '<a class="btn" href="leccion.html?n=' + e.diagnostico.recomendada + '">Abrir la lección ' + e.diagnostico.recomendada + '</a>' +
                    '<a class="btn sec" href="diagnostico.html">Repetir la ubicación</a>';
  } else {
    linea.textContent = 'Nuevo aquí';
    acc.innerHTML = '<a class="btn" href="diagnostico.html">Hacer el examen de ubicación</a>' +
                    '<a class="btn sec" href="leccion.html?n=101">Empezar en la 101</a>';
  }
})();

(function mapa() {
  var out = '';
  CURRICULO.niveles.forEach(function (niv) {
    var todas = [], hechas = 0;
    niv.modulos.forEach(function (m) { m.lecciones.forEach(function (l) {
      todas.push(l);
      var p = e.progreso[String(l.n)];
      if (p && p.estado === 'aprobada') hechas++;
    }); });

    out += '<section class="niv niv-' + niv.id + '" style="margin:44px 0 0">' +
           '<h2 class="pt-' + niv.id + '" style="margin:0 0 4px">' + niv.nombre + '</h2>' +
           '<p class="sub" style="margin:0 0 6px">' + niv.lema + '</p>' +
           '<p class="sub" style="font-size:.85rem;margin:0 0 10px">' + hechas + ' de ' + todas.length + ' aprobadas</p>' +
           '<div class="progreso"><i style="width:' + Math.round(hechas / todas.length * 100) + '%"></i></div>';

    niv.modulos.forEach(function (m) {
      var lis = m.lecciones.map(function (l) {
        var hay = disp.indexOf(String(l.n)) !== -1;
        var p = e.progreso[String(l.n)];
        var cls = p && p.estado === 'aprobada' ? 'hecha' : (hay ? '' : 'pendiente');
        var titulo = hay ? '<a href="leccion.html?n=' + l.n + '">' + l.t + '</a>'
                         : '<a href="leccion.html?n=' + l.n + '">' + l.t + '</a>';
        return '<li class="' + cls + '"><span class="num">' + l.n + '</span>' + titulo +
               '<span class="marca-est">' + (estadoLeccion(l.n) || (hay ? '' : 'por escribir')) + '</span></li>';
      }).join('');
      out += '<details class="modulo" id="m' + m.id + '"><summary>' +
             '<span class="num" style="color:var(--tinta-suave);font-family:var(--sans);font-size:.8rem">' + m.id + '</span>' +
             '<span class="mt">' + m.titulo + '</span>' +
             '<span class="mc">' + m.area + ' · ' + m.lecciones.length + '</span>' +
             '</summary><ul class="lecciones">' + lis + '</ul></details>';
    });
    out += '</section>';
  });
  document.getElementById('mapa').innerHTML = out;

  if (location.hash) {
    var d = document.querySelector(location.hash);
    if (d) { d.open = true; d.scrollIntoView(); }
  }
})();

(function busqueda() {
  var q = document.getElementById('q'), caja = document.getElementById('resultados');
  q.addEventListener('input', function () {
    var res = INST.buscar(q.value);
    if (!res.length) { caja.innerHTML = q.value.length > 1 ? '<p class="sub" style="padding:10px 0">Sin resultados.</p>' : ''; return; }
    caja.innerHTML = res.map(function (x) {
      return '<a href="' + x.url + '"><span class="n">' + x.tipo + (x.n ? ' ' + x.n : '') + '</span><br>' + x.texto + '</a>';
    }).join('');
  });
})();
</script>
</body>
</html>
