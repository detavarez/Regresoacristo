<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IglesiaFinanzas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

/* ── TOKENS ── */
:root {
  --gold:#C9A84C; --gold-light:#E8C97A; --gold-dim:#8a6e2f;
  --navy:#0D1B2A; --navy-mid:#1A2D42; --navy-light:#243B55; --navy-hover:#2d4a69;
  --cream:#F5EFE0; --white:#FDFAF5; --muted:#8A9BB0;
  --success:#3DAA6E; --danger:#D94F4F; --warning:#E8A030; --info:#3A8CB5;
  --border:rgba(201,168,76,.18); --shadow:0 8px 32px rgba(0,0,0,.45); --r:14px;
}
/* V11: Modo claro — same variable names, light values, so every existing
   component rule (which all reference var(--navy) etc.) reskins for free. */
body.theme-light {
  --navy:#F1EDE1; --navy-mid:#FFFFFF; --navy-light:#EAE4D2; --navy-hover:#DED5B8;
  --cream:#2A2A26; --white:#171714; --muted:#6B675C;
  --border:rgba(140,110,30,.28); --shadow:0 8px 24px rgba(0,0,0,.10);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family:'DM Sans',sans-serif;
  background:var(--navy);
  color:var(--white);
  min-height:100vh;
  overscroll-behavior:none;
}

/* ── LAYOUT ── */
#app { min-height:100vh; display:flex; flex-direction:column; }

/* ── TOPBAR ── */
#topbar {
  background:var(--navy-mid);
  border-bottom:1px solid var(--border);
  padding:0 20px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
  position:sticky; top:0; z-index:100;
}
#topbar .tb-left { display:flex; align-items:center; gap:12px; }
#topbar .tb-logo { width:34px; height:34px; background:linear-gradient(135deg,var(--gold),var(--gold-light)); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
#topbar h1 { font-family:'Playfair Display',serif; font-size:17px; color:var(--gold-light); }
#topbar .tb-sub { font-size:10px; color:var(--muted); margin-top:1px; }
#back-btn { display:none; align-items:center; gap:6px; background:rgba(201,168,76,.1); border:1px solid var(--border); border-radius:8px; padding:6px 12px; color:var(--gold-light); font-size:12px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; }
#back-btn.show { display:flex; }
#topbar .tb-right { display:flex; align-items:center; gap:8px; }
.tb-hamburger { display:flex; background:rgba(201,168,76,.1); border:1px solid var(--border); border-radius:8px; width:34px; height:34px; align-items:center; justify-content:center; color:var(--gold-light); font-size:16px; cursor:pointer; flex-shrink:0; }
#topbar .tb-actions {
  display:none;
  position:absolute; top:44px; right:0;
  flex-direction:column; align-items:stretch;
  background:var(--navy-mid); border:1px solid var(--border); border-radius:10px;
  padding:10px; gap:8px; box-shadow:var(--shadow); z-index:150; min-width:170px;
}
#topbar .tb-actions.open { display:flex; }
#topbar .tb-actions .btn { width:100%; justify-content:center; white-space:nowrap; }

/* ── RESPONSIVE HEADER / MOBILE NAV (V6) ── */
@media (max-width:680px) {
  #backup-indicator { padding:0!important; width:14px; height:14px; border-radius:50%!important; overflow:hidden; }
  #backup-indicator .bi-dot { width:14px; height:14px; }
  #backup-indicator .bi-text { display:none; }
}
#page-title { font-family:'Playfair Display',serif; font-size:15px; color:var(--cream); }

/* ── MAIN CONTENT ── */
#main-content { flex:1; overflow-y:auto; padding:20px; }

/* ── DASHBOARD GRID ── */
.dash-header { margin-bottom:20px; }
.dash-header .dh-balance { font-family:'Playfair Display',serif; font-size:32px; font-weight:700; color:var(--gold-light); }
.dash-header .dh-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; }
.dash-header .dh-stats { display:flex; gap:20px; margin-top:8px; flex-wrap:wrap; }
.dash-header .dh-stat { font-size:12px; color:var(--muted); }
.dash-header .dh-stat span { color:var(--cream); font-weight:600; }

.btn-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
  gap:12px;
  margin-bottom:24px;
}

.btn-card {
  background:var(--navy-mid);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:20px 16px 16px;
  cursor:pointer;
  transition:all .2s ease;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:6px;
  position:relative;
  overflow:hidden;
  text-align:left;
  user-select:none;
}
.btn-card::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:3px;
}
.btn-card.c-gold::before  { background:linear-gradient(90deg,var(--gold),var(--gold-light)); }
.btn-card.c-green::before { background:var(--success); }
.btn-card.c-red::before   { background:var(--danger); }
.btn-card.c-blue::before  { background:var(--info); }
.btn-card.c-purple::before{ background:#8B5CF6; }
.btn-card.c-pink::before  { background:#EC4899; }
.btn-card.c-amber::before { background:var(--warning); }
.btn-card.c-teal::before  { background:#06B6D4; }

.btn-card:hover  { transform:translateY(-3px); border-color:rgba(201,168,76,.4); box-shadow:0 8px 24px rgba(0,0,0,.4); }
.btn-card:active { transform:translateY(-1px); }

.btn-card .bc-icon  { font-size:28px; margin-bottom:2px; }
.btn-card .bc-label { font-size:13px; font-weight:600; color:var(--cream); line-height:1.3; }
.btn-card .bc-sub   { font-size:11px; color:var(--muted); }
.btn-card .bc-badge {
  position:absolute; top:12px; right:12px;
  background:var(--danger); color:#fff;
  font-size:10px; font-weight:700;
  padding:2px 7px; border-radius:20px;
  min-width:20px; text-align:center;
}
.btn-card .bc-badge.gold { background:var(--gold); color:var(--navy); }
.btn-card .bc-badge.green { background:var(--success); color:#fff; }

/* ── MODULE WRAPPER ── */
.module-wrap { animation:fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* ── STAT CARDS ── */
.sg { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
.sc { background:var(--navy-mid); border:1px solid var(--border); border-radius:var(--r); padding:16px; position:relative; overflow:hidden; transition:transform .2s; }
.sc:hover { transform:translateY(-2px); }
.sc::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
.sc.gold::before  { background:linear-gradient(90deg,var(--gold),var(--gold-light)); }
.sc.green::before { background:var(--success); }
.sc.red::before   { background:var(--danger); }
.sc.blue::before  { background:var(--info); }
.sc.purple::before{ background:#8B5CF6; }
.sl { font-size:9px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:600; margin-bottom:5px; }
.sv { font-family:'DM Mono',monospace; font-size:20px; font-weight:500; color:var(--white); margin-bottom:1px; }
.ss2 { font-size:10px; color:var(--muted); }
.si { position:absolute; right:12px; top:12px; font-size:22px; opacity:.12; }

/* ── CARD ── */
.card { background:var(--navy-mid); border:1px solid var(--border); border-radius:var(--r); padding:20px; box-shadow:var(--shadow); margin-bottom:16px; }
.ch { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
.ct { font-family:'Playfair Display',serif; font-size:15px; font-weight:700; color:var(--cream); }

/* ── TABLE ── */
.tw { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:12px; }
thead th { background:var(--navy-light); color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; padding:9px 12px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
thead th.sortable { cursor:pointer; user-select:none; }
thead th.sortable:hover { color:var(--gold-light); }
thead th.sort-asc::after  { content:' ↑'; }
thead th.sort-desc::after { content:' ↓'; }
tbody tr { border-bottom:1px solid rgba(255,255,255,.04); transition:background .15s; }
tbody tr:hover { background:rgba(255,255,255,.03); }
tbody td { padding:10px 12px; color:var(--cream); vertical-align:middle; }
.totals-row td { font-weight:700; border-top:2px solid var(--border)!important; background:rgba(201,168,76,.06); }
.tr { text-align:right!important; }

/* ── BADGES ── */
.badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:600; letter-spacing:.02em; white-space:nowrap; }
.bs { background:rgba(61,170,110,.15);  color:#5dd49a; border:1px solid rgba(61,170,110,.3); }
.bd { background:rgba(217,79,79,.15);   color:#f07070; border:1px solid rgba(217,79,79,.3); }
.bw { background:rgba(232,160,48,.15);  color:#f0b44f; border:1px solid rgba(232,160,48,.3); }
.bi { background:rgba(58,140,181,.15);  color:#5ab5d9; border:1px solid rgba(58,140,181,.3); }
.bg { background:rgba(201,168,76,.15);  color:var(--gold-light); border:1px solid rgba(201,168,76,.3); }
.bm { background:rgba(138,155,176,.1); color:var(--muted); border:1px solid rgba(138,155,176,.2); }
.tag { display:inline-block; padding:2px 7px; border-radius:4px; font-size:10px; font-weight:600; background:rgba(201,168,76,.12); color:var(--gold-light); margin-right:3px; white-space:nowrap; }

/* ── BUTTONS ── */
.btn { padding:7px 15px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; border:none; transition:all .18s; font-family:'DM Sans',sans-serif; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.btn-primary { background:linear-gradient(135deg,var(--gold),var(--gold-dim)); color:var(--navy); box-shadow:0 4px 12px rgba(201,168,76,.3); }
.btn-primary:hover { filter:brightness(1.1); transform:translateY(-1px); }
.btn-outline { background:transparent; color:var(--gold-light); border:1px solid var(--border); }
.btn-outline:hover { background:rgba(201,168,76,.1); }
.btn-sm { padding:4px 10px; font-size:11px; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-danger:hover { filter:brightness(1.1); }
.btn-success { background:var(--success); color:#fff; }
.btn-success:hover { filter:brightness(1.1); }

/* ── FORM ── */
.fg { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.fg .full { grid-column:1/-1; }
.fgrp { display:flex; flex-direction:column; gap:5px; }
.fgrp.narrow { max-width:90px; } /* ~1/5 of a standard field column — for short codes like No. de Sobre */
.form-kicker { font-size:13px; font-weight:700; letter-spacing:.03em; color:var(--gold-light); text-transform:uppercase; padding-bottom:6px; margin-bottom:4px; border-bottom:1px solid rgba(255,255,255,.08); }
.fgrp label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); }
.fgrp input,
.fgrp select,
.fgrp textarea {
  background:var(--navy);
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px 12px;
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  transition:border-color .18s;
  outline:none;
  width:100%;
}
.fgrp input:focus,
.fgrp select:focus,
.fgrp textarea:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,168,76,.1); }
.fgrp select option { background:var(--navy-mid); }
.fgrp textarea { resize:vertical; min-height:70px; }

/* ── SEARCH / FILTER BAR ── */
.filter-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; background:var(--navy-mid); border:1px solid var(--border); border-radius:10px; padding:10px 14px; }
.filter-bar label { font-size:10px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }
.filter-bar input[type=date] { background:var(--navy); border:1px solid var(--border); border-radius:6px; padding:5px 10px; color:var(--white); font-family:'DM Sans',sans-serif; font-size:12px; outline:none; cursor:pointer; }
.filter-bar input[type=date]:focus { border-color:var(--gold); }
.filter-bar select { background:var(--navy); border:1px solid var(--border); border-radius:6px; padding:5px 10px; color:var(--white); font-family:'DM Sans',sans-serif; font-size:12px; outline:none; }
.df-sep { color:var(--muted); font-size:12px; }
.search-wrap { position:relative; }
.search-wrap input { background:var(--navy); border:1px solid var(--border); border-radius:8px; padding:8px 12px 8px 32px; color:var(--white); font-family:'DM Sans',sans-serif; font-size:12px; outline:none; min-width:200px; }
.search-wrap input:focus { border-color:var(--gold); }
.search-wrap .s-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; pointer-events:none; }

/* ── MODAL ── */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.78); backdrop-filter:blur(5px); z-index:1000; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.open { display:flex; }
.modal { background:var(--navy-mid); border:1px solid var(--border); border-radius:16px; padding:28px; width:580px; max-width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 24px 64px rgba(0,0,0,.7); animation:mIn .22s ease; }
@keyframes mIn { from{opacity:0;transform:scale(.96) translateY(16px)} to{opacity:1;transform:scale(1) translateY(0)} }
.modal h3 { font-family:'Playfair Display',serif; font-size:18px; color:var(--gold-light); margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--border); }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; padding-top:14px; border-top:1px solid var(--border); }

/* ── AMOUNTS ── */
.ap  { color:#5dd49a; font-family:'DM Mono',monospace; }
.an  { color:#f07070; font-family:'DM Mono',monospace; }
.au  { font-family:'DM Mono',monospace; color:var(--cream); }
.av2 { width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; margin-right:6px; flex-shrink:0; }
.mc  { display:flex; align-items:center; }

/* ── PROGRESS ── */
.progress-bar  { background:rgba(255,255,255,.06); border-radius:4px; height:8px; overflow:hidden; margin-top:4px; }
.progress-fill { height:100%; border-radius:4px; transition:width 1s ease; }

/* ── PENDING BANNER ── */
.pending-banner { background:linear-gradient(135deg,rgba(232,160,48,.15),rgba(232,160,48,.08)); border:1px solid rgba(232,160,48,.3); border-radius:10px; padding:14px 18px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.pending-row { background:rgba(232,160,48,.05)!important; border-left:3px solid var(--warning)!important; }

/* ── ACCOUNTING ── */
.cuenta-code { font-family:'DM Mono',monospace; font-size:10px; color:var(--gold-light); background:rgba(201,168,76,.1); padding:2px 6px; border-radius:4px; }
.pl-header { font-family:'Playfair Display',serif; font-size:12px; color:var(--gold-light); font-weight:700; padding:9px 0 5px; border-bottom:1px solid var(--border); margin-bottom:5px; text-transform:uppercase; letter-spacing:.06em; }
.pl-row { display:flex; justify-content:space-between; padding:5px 0 5px 12px; border-bottom:1px solid rgba(255,255,255,.03); font-size:13px; }
.pl-row:hover { background:rgba(255,255,255,.02); }
.pl-row .pln { color:var(--cream); }
.pl-row .pla { font-family:'DM Mono',monospace; }
.pl-sub { display:flex; justify-content:space-between; padding:8px 0; font-weight:700; font-size:13px; border-top:1px solid var(--border); margin-top:4px; }
.pl-total { display:flex; justify-content:space-between; padding:14px 0; font-family:'Playfair Display',serif; font-size:17px; font-weight:700; border-top:3px double var(--gold); margin-top:12px; }
.pyl-card { background:var(--navy-mid); border:1px solid var(--border); border-radius:var(--r); padding:24px; }
.pyl-church { text-align:center; margin-bottom:22px; padding-bottom:16px; border-bottom:1px solid var(--border); }
.pyl-church h3 { font-family:'Playfair Display',serif; font-size:19px; color:var(--gold-light); }
.pyl-church p  { font-size:12px; color:var(--muted); margin-top:4px; }
.min-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:6px; margin-top:6px; }
.min-chip { display:flex; align-items:center; gap:6px; background:var(--navy); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:11px; color:var(--cream); cursor:pointer; }
.min-chip input { margin:0; }
.tb-username { font-size:12px; color:var(--muted); margin-right:10px; white-space:nowrap; }
.add-label { display:inline; }
@media (max-width:640px) {
  .tb-username { display:none; }
  #add-btn { background:transparent!important; border:none!important; padding:4px 6px!important; box-shadow:none!important; }
  #add-btn .add-icon { color:var(--gold); font-size:26px; font-weight:700; line-height:1; }
  #add-btn .add-label { display:none; }
}
.pyl-link { color:var(--gold-light); text-decoration:underline; text-decoration-style:dotted; text-underline-offset:2px; cursor:pointer; }
@keyframes searchPulse { 0%,100% { background:transparent; } 50% { background:rgba(201,168,76,.28); } }
.search-hl { animation:searchPulse 0.7s ease-in-out 2; }
.pyl-link:hover { color:var(--gold); }
.pyl-month-cell[onclick] { cursor:pointer; }
.pyl-month-cell[onclick]:hover { text-decoration:underline; text-decoration-style:dotted; }
.balance-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.net-pos { color:#5dd49a; }
.net-neg { color:#f07070; }

/* ── RECEIPT ── */
.receipt { background:#fff; color:#111; border-radius:10px; padding:24px; font-family:'DM Sans',sans-serif; }
.receipt h2 { font-family:'Playfair Display',serif; text-align:center; color:#1a2d42; font-size:17px; margin-bottom:4px; }
.receipt .r-sub { text-align:center; font-size:11px; color:#666; border-bottom:2px dashed #ddd; padding-bottom:12px; margin-bottom:14px; }
.receipt .r-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #f0f0f0; font-size:13px; }
.receipt .rk { color:#555; }
.receipt .rv { font-weight:600; }
.receipt .r-total { display:flex; justify-content:space-between; padding:12px 0 0; font-size:17px; font-weight:800; color:#1a2d42; border-top:2px solid #1a2d42; margin-top:8px; }
.receipt .r-foot { text-align:center; font-size:10px; color:#999; margin-top:14px; border-top:1px dashed #ddd; padding-top:10px; line-height:1.7; }

/* ── MINI CHART BARS ── */
.cbg { display:flex; flex-direction:column; gap:9px; }
.cbr { display:flex; align-items:center; gap:10px; }
.cbl { font-size:10px; color:var(--muted); width:90px; flex-shrink:0; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cbt { flex:1; background:rgba(255,255,255,.05); border-radius:4px; height:22px; overflow:hidden; }
.cbf { height:100%; border-radius:4px; display:flex; align-items:center; padding-left:8px; font-size:11px; font-family:'DM Mono',monospace; font-weight:500; color:var(--navy); }
.bar-gold  { background:linear-gradient(90deg,var(--gold),var(--gold-light)); }
.bar-green { background:linear-gradient(90deg,#2e8b57,#3daa6e); color:#fff!important; }
.bar-red   { background:linear-gradient(90deg,#a33333,#d94f4f); color:#fff!important; }
.bar-blue  { background:linear-gradient(90deg,#2a6080,#3a8cb5); color:#fff!important; }
.bar-purple{ background:linear-gradient(90deg,#5b21b6,#8b5cf6); color:#fff!important; }

/* ── MISC ── */
.two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.three { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
.mb16 { margin-bottom:16px; }
.mb24 { margin-bottom:24px; }
.no-print { /* hidden in print */ }
.empty-state { text-align:center; padding:40px 20px; color:var(--muted); }
.empty-state .ei { font-size:36px; margin-bottom:10px; opacity:.5; }
.empty-state p { font-size:13px; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(201,168,76,.2); border-radius:3px; }

/* ── PRINT ── */
@media print {
  #topbar, #back-btn, .btn, .no-print, .filter-bar { display:none!important; }
  body, .card, .pyl-card { background:#fff!important; color:#000!important; }
  .card { border:1px solid #ccc!important; box-shadow:none!important; }
  thead th { background:#f5f5f5!important; color:#333!important; }
  tbody td { color:#111!important; }

// ============================================================
// LAN SYNC — talks to the local server (server.js) running on this PC,
// which relays entries submitted from phones on the same wifi/router.
// Nothing here uses the internet; it only works when this page was
// opened via that server (http://localhost:PORT/ or the PC's LAN IP),
// not when the .html file is opened directly by double-clicking it.
// If the server isn't running, everything below fails silently and the
// app behaves exactly as before (manual "Sincronizar" export on mobile).
// ============================================================
const SYNC_APP_TAG = 'A'; // must match server.js's APP_TAG on this PC —
                           // a differently-tagged app/server pair will be
                           // rejected, which keeps W or T phones from
                           // syncing to an A server, and vice versa.

async function _serverSyncPull() {
  try {
    const res = await fetch('/api/pendientes', { cache: 'no-store' });
    if (!res.ok) { _setLanDot(false); return; }
    _setLanDot(true);
    const items = await res.json();
    if (!Array.isArray(items) || !items.length) return;
    const raw = localStorage.getItem('iglesia_mobile_pending');
    const existing = raw ? JSON.parse(raw) : [];
    const ids = new Set(existing.map(x => x._mobileId));
    let changed = false;
    items.forEach(it => {
      const mid = it._mobileId || it._serverId;
      if (mid && !ids.has(mid)) { existing.push(it); ids.add(mid); changed = true; }
    });
    if (changed) localStorage.setItem('iglesia_mobile_pending', JSON.stringify(existing));
  } catch(e) { _setLanDot(false); }
}
async function _serverNotifyProcessed(id, status) {
  if (!id) return;
  try {
    await fetch('/api/pendientes/' + encodeURIComponent(id) + '/procesar', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ status: status || 'procesado' }),
    });
  } catch(e) {}
}
function _setLanDot(connected) {
  const dot = document.getElementById('lan-dot');
  if (!dot) return;
  dot.style.background = connected ? '#3DAA6E' : '#666';
  dot.title = connected ? 'Servidor local: conectado' : 'Servidor local: sin conexión (los teléfonos no pueden sincronizar)';
}

// This app has no backend — everything lives in localStorage on whatever

// (standard public-domain algorithm) used only for this local gate.
function _sha256Hex(str) {

    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes = [];
  const utf8 = unescape(encodeURIComponent(str));
  for (let i=0;i<utf8.length;i++) bytes.push(utf8.charCodeAt(i));
  const bitLen = bytes.length*8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i=7;i>=0;i--) bytes.push((bitLen / Math.pow(2, i*8)) & 0xff);
  const w = new Array(64);
  for (let off=0; off<bytes.length; off+=64) {
    for (let i=0;i<16;i++) w[i] = (bytes[off+i*4]<<24)|(bytes[off+i*4+1]<<16)|(bytes[off+i*4+2]<<8)|(bytes[off+i*4+3]);
    for (let i=16;i<64;i++) {
      const s0 = rrot(w[i-15],7)^rrot(w[i-15],18)^(w[i-15]>>>3);

    let [a,b,c,d,e,f,g,hh] = h;
    for (let i=0;i<64;i++) {
      const S1 = rrot(e,6)^rrot(e,11)^rrot(e,25);
      const ch = (e&f)^((~e)&g);
      const t1 = (hh+S1+ch+K[i]+w[i])|0;
      const S0 = rrot(a,2)^rrot(a,13)^rrot(a,22);
      const maj = (a&b)^(a&c)^(b&c);
      const t2 = (S0+maj)|0;
      hh=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    h = [h[0]+a,h[1]+b,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+hh].map(x=>x|0);
  }
  return h.map(x => ('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}
function _genSalt() {

  }
  return Math.random().toString(16).slice(2) + Date.now().toString(16);
}

// ── DB SINGLETON ───────────────────────────────────────────
let DB = {};

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    DB = raw ? JSON.parse(raw) : deepCopy(SEED);
  } catch(e) {
    DB = deepCopy(SEED);
  }
  // Guarantee every array/object exists
  const arrays = ['transacciones','transferencias','reconciliaciones','usuarios','depositos','gastos','diezmos','ofrendas',
                   'donaciones','miembros','proveedores','ventas','eventos',
                   'otrosIngresos',
                   'eventosHistorico','presupuesto',
                   'cuentas','bancos','pending','backups',
                   'campanas','promesas','recurrentes','pagosPromesa',
                   'ajustes'];
  arrays.forEach(k => { if (!Array.isArray(DB[k])) DB[k] = []; });
  // Upgrading a save from before Usuarios existed: without this, DB.usuarios
  // would just be [] and the PIN gate would have no account able to unlock
  // anything — seed the same default admin a fresh install gets.
  if (!DB.usuarios.length) DB.usuarios = deepCopy(SEED.usuarios);
  // SECURITY: catch any existing save (including ones from before this
  // check existed) where the default admin/admin, PIN 0000 credentials are
  // still live, and force a mandatory change on next login rather than
  // silently trusting them forever.
  DB.usuarios.forEach(u => {
    if (u.usuario === 'admin' && u.passHash === _hashSecret('admin', u.passSalt)) u.mustChangeCreds = true;
  });
  if (!DB.config)  DB.config  = deepCopy(SEED.config);
  if (!DB.config.name) DB.config.name = 'Iglesia'; // guarantee a display name even on older saved records
  // V18: Cierre de Periodo — null means the books are fully open. When set,
  // {fecha, etiqueta, tipo, cerradoPor, cerradoPorId, cerradoEl} describes the
  // active cutoff (everything with fecha <= cierre.fecha is locked).
  if (DB.config.cierre === undefined) DB.config.cierre = null;
  if (!DB.settings) DB.settings = deepCopy(SEED.settings);
  if (!DB.settings.backupOffsite) DB.settings.backupOffsite = deepCopy(SEED.settings.backupOffsite);
  if (!DB.settings.backupOffsite.googleDrive) DB.settings.backupOffsite.googleDrive = deepCopy(SEED.settings.backupOffsite.googleDrive);
  if (!DB.settings.backupOffsite.webhook) DB.settings.backupOffsite.webhook = deepCopy(SEED.settings.backupOffsite.webhook);
  if (!DB.settings.backupSchedule) DB.settings.backupSchedule = deepCopy(SEED.settings.backupSchedule);
  if (!DB.settings.backupStatus) DB.settings.backupStatus = deepCopy(SEED.settings.backupStatus);
  ['local','autoDownload','googleDrive','webhook'].forEach(k => {
    if (!DB.settings.backupStatus[k]) DB.settings.backupStatus[k] = deepCopy(SEED.settings.backupStatus[k]);
  });
  if (!Array.isArray(DB.settings.servicios) || DB.settings.servicios.length === 0)
    DB.settings.servicios = deepCopy(SEED.settings.servicios);
  if (!Array.isArray(DB.settings.metodosPago) || DB.settings.metodosPago.length === 0)
    DB.settings.metodosPago = deepCopy(SEED.settings.metodosPago);
  if (!Array.isArray(DB.settings.rolesMiembro) || DB.settings.rolesMiembro.length === 0)
    DB.settings.rolesMiembro = deepCopy(SEED.settings.rolesMiembro);
  if (!Array.isArray(DB.settings.estadosMiembro) || DB.settings.estadosMiembro.length === 0)
    DB.settings.estadosMiembro = deepCopy(SEED.settings.estadosMiembro);
  if (!Array.isArray(DB.settings.ministerios) || DB.settings.ministerios.length === 0)
    DB.settings.ministerios = deepCopy(SEED.settings.ministerios);
  if (!DB.settings.emailjs) DB.settings.emailjs = deepCopy(SEED.settings.emailjs);
  if (!Array.isArray(DB.auditLog)) DB.auditLog = [];
  if (!DB.donorAddresses || typeof DB.donorAddresses !== 'object') DB.donorAddresses = {};
  if (!Array.isArray(DB.fondos) || DB.fondos.length === 0)
    DB.fondos = deepCopy(SEED.fondos);
  // V4: guarantee the counter exists, then make sure it's always ahead of any
  // numeric sobre already sitting on a member record (manual entries, imports,
  // or older data) so the next auto-assignment can never collide.
  if (!DB.settings.nextSobre) DB.settings.nextSobre = 1;
  {
    const maxSobre = (DB.miembros||[]).reduce((max, m) => {
      const s = (m.sobre||'').toString().trim();
      return /^\d+$/.test(s) ? Math.max(max, parseInt(s,10)) : max;
    }, 0);
    if (maxSobre + 1 > DB.settings.nextSobre) DB.settings.nextSobre = maxSobre + 1;
  }
  // Backfill: any income/expense record saved before V3 gets the default fund so
  // fund balances/ledgers are complete from day one — never left unassigned.
  ['diezmos','ofrendas','donaciones','gastos'].forEach(k => {
    (DB[k]||[]).forEach(r => { if (!r.fondo) r.fondo = 'Fondo General'; });
  });
  if (!DB._nextId) DB._nextId = 100;
  if (!DB.schemaVersion) DB.schemaVersion = 1;
  if (DB.schemaVersion < 2) DB.schemaVersion = 2; // V2: configurable Servicio / Método de Pago lists added above
  // V11 BUGFIX: this used to gate the backfill below on `schemaVersion < 3`,
  // and also — in a separate bug — unconditionally set schemaVersion = 3
  // one line before that guard ever ran, so the backfill silently never
  // executed for ANYONE, and every existing installation's saved data now
  // already has schemaVersion >= 3 despite never actually being backfilled.
  // Re-gating on the version number can't self-heal that. Instead this now
  // runs on every load — cheap and fully idempotent, since it only touches
  // a gasto that is still missing its link (`!g._transId`), so it's a no-op
  // for every gasto that already has one.
  (DB.gastos||[]).forEach(g => {
    if (!g._transId) {
      const trans = buildLinkedTrans('gastos', g);
      trans.id = nextId();
      g._transId = trans.id;
      DB.transacciones.unshift(trans);
    }
  });
  if (DB.schemaVersion < 3) {
    DB.schemaVersion = 3;
  }
  if (DB.schemaVersion < 4) {
    // V5: the old "Ventas / Eventos" module stored one combined ingresos+gastos
    // row per event, saved via generic saveRecord() — never linked to
    // Transacciones, so it never touched fund balances. Splitting into
    // income-only Ventas and expense-only Eventos means those old rows don't
    // map 1:1 to the new shape, so freeze them into a read-only historical
    // archive instead of guessing how to split each one. Ventas/Eventos start
    // clean going forward.
    if ((DB.ventas||[]).length) {
      DB.eventosHistorico = [...(DB.eventosHistorico||[]), ...DB.ventas];
      DB.ventas = [];
    }
    DB.schemaVersion = 4;
  }
  if (DB.schemaVersion < 5) {
    // V8a — Unified Transacciones data model.
    // DB.transacciones was already, structurally, the single ledger every
    // income/expense source (Diezmos, Ofrendas, Donaciones, Gastos, Ventas,
    // Eventos) writes a linked row into via buildLinkedTrans(). What it never
    // had was one clean field to tell those origins apart at a glance — origin
    // lived only in `_srcDs` (present) vs absent (a manually-entered "Otro
    // Ingreso/Gasto"), and `cat` meant something different per origin. This
    // pass backfills an explicit `tipoOrigen` enum onto every existing row so
    // V8b's unified UI has one field to filter/group/sort/print by, without
    // touching amounts, dates, or any existing per-module screen or array —
    // old UI keeps reading/writing exactly as before.
    (DB.transacciones||[]).forEach(t => { if (!t.tipoOrigen) t.tipoOrigen = _tipoOrigen(t); });
    DB.schemaVersion = 5;
  }
  if (DB.cuentas.length === 0) DB.cuentas = DEFAULT_CUENTAS.map(c => ({...c}));
  if (DB.bancos.length === 0)  DB.bancos  = DEFAULT_BANCOS.map(b => ({...b}));
  _procesarRecurrentes(); // V17: generate this month's gastos from any due recurring templates
  saveDB(); // write back immediately so structure is always fresh
}

function saveDB() {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    return true;
  } catch(e) {
    showToast('⚠ Error al guardar datos. Exporta un respaldo ahora.', 'err');
    return false;
  }
}

function nextId() {
  DB._nextId = (DB._nextId || 100) + 1;
  return DB._nextId;
}

// ── V4: SOBRE (Miembros) ───────────────────────────────────
// Zero-padded 3-digit string, e.g. "007". Skips forward past any value already
// in use (defensive — covers a manually-typed sobre that got ahead of the
// counter before this record was saved).
function _formatSobre(n) { return String(n).padStart(3,'0'); }

function _previewNextSobre() {
  let n = DB.settings.nextSobre || 1;
  while ((DB.miembros||[]).some(m => (m.sobre||'').toString().trim() === _formatSobre(n))) n++;
  return _formatSobre(n);
}

// Consumes the counter — call only at save time, not for display previews.
function _allocateNextSobre() {
  let n = DB.settings.nextSobre || 1;
  while ((DB.miembros||[]).some(m => (m.sobre||'').toString().trim() === _formatSobre(n))) n++;
  DB.settings.nextSobre = n + 1;
  return _formatSobre(n);
}

// If a manually-entered sobre is numeric and would collide with a future
// auto-assignment, push the counter past it.
function _advanceSobreCounter(sobre) {
  const s = (sobre||'').toString().trim();
  if (!/^\d+$/.test(s)) return;
  const n = parseInt(s,10);
  if (n + 1 > (DB.settings.nextSobre||1)) DB.settings.nextSobre = n + 1;
}

function deepCopy(obj) { return JSON.parse(JSON.stringify(obj)); }

// ── V8a: UNIFIED TRANSACCIONES DATA MODEL ──────────────────
// One clean enum distinguishing every row's origin, regardless of whether it
// arrived via a source module (Diezmo/Ofrenda/Donación/Gasto/Venta/Evento) or
// was typed directly into the generic Transacciones screen (Otro Ingreso/Gasto).
const TIPO_ORIGEN_MAP = { diezmos:'Diezmo', ofrendas:'Ofrenda', donaciones:'Donación', gastos:'Gasto', ventas:'Venta', eventos:'Evento', otrosIngresos:'Otro Ingreso', pagosPromesa:'Pago de Promesa' };
function _tipoOrigen(rec) {
  if (rec.tipoOrigen) return rec.tipoOrigen;
  if (rec._srcDs && TIPO_ORIGEN_MAP[rec._srcDs]) return TIPO_ORIGEN_MAP[rec._srcDs];
  return rec.tipo === 'Egreso' ? 'Otro Gasto' : 'Otro Ingreso';
}

// ── LINKED TRANSACTION ─────────────────────────────────────
function buildLinkedTrans(ds, rec) {
  const catMap = { diezmos:'Diezmos', ofrendas:'Ofrendas', donaciones:'Donaciones', gastos: rec.cat, ventas: rec.cat, eventos: rec.cat, otrosIngresos: rec.cat, pagosPromesa: 'Promesas' };
  const descMap = {
    diezmos:    `Diezmo — ${rec.miembro||'Miembro'} (${rec.servicio||''})`,
    ofrendas:   `Ofrenda — ${rec.tipo||'General'} (${rec.servicio||''})`,
    donaciones: `Donación — ${rec.donante||'Donante'} (${rec.proposito||''})`,
    gastos:     rec.desc || `Gasto — ${rec.cat||'General'}`,
    ventas:     `Venta — ${rec.evento||rec.cat||'Venta'}`,
    eventos:    `Evento — ${rec.evento||rec.cat||'Evento'}`,
    otrosIngresos: rec.desc || `Otro Ingreso — ${rec.cat||'General'}`,
    pagosPromesa: `Pago de Promesa — ${rec._miembroLabel||'Miembro'} (${rec._campanaLabel||''})`,
  };
  return {
    fecha:  rec.fecha  || today(),
    desc:   descMap[ds] || '—',
    cat:    catMap[ds]  || ds,
    ref:    rec.sobre  || rec.recibo || rec.ref || `${ds.slice(0,3).toUpperCase()}-${rec.id}`,
    tipo:   (ds === 'gastos' || ds === 'eventos') ? 'Egreso' : 'Ingreso',
    tipoOrigen: TIPO_ORIGEN_MAP[ds] || ds,
    metodo: rec.metodo || 'Efectivo',
    monto:  rec.monto  || 0,
    // V11 FIX #4: a Gasto's own Estado (Pagado/Pendiente/Cancelado) used to be
    // purely cosmetic — this always hardcoded 'Completado' on the linked
    // ledger transacción regardless, so a Pendiente or Cancelado expense
    // still fully posted and reduced the bank balance. Now the real status
    // carries through, and generateJournal() only posts postable statuses.
    estado: rec.estado || 'Completado',
    fondo:  rec.fondo || 'Fondo General',
    cuentaCr: rec.cuentaCr || '',   // destino/fondo elegido por el usuario (anula el mapeo por defecto)
    cuentaDr: rec.cuentaDr || '',   // cuenta bancaria/caja donde entró/salió el dinero
    _srcDs: ds,
    _srcId: rec.id,
  };
}

// Save a diezmo/ofrenda/donacion AND its linked transaction atomically
function saveSourceRecord(ds, data, editingId) {
  // V18: period-lock backstop — see _assertPeriodoAbierto().
  if (editingId) {
    const existing = (DB[ds]||[]).find(r => r.id === editingId);
    if (existing && !_assertPeriodoAbierto(ds, existing.fecha)) return false;
  }
  if (data.fecha !== undefined && !_assertPeriodoAbierto(ds, data.fecha)) return false;

  const numFields = ['monto'];
  numFields.forEach(k => { if (data[k] !== undefined) data[k] = parseMoney(data[k]); });

  // V17: a Pago de Promesa always inherits its fondo/cuenta from the pledge's
  // campaign — never asked of the user — so it can never accidentally post to
  // the wrong ministerial fund, and it's clearly labeled in the ledger.
  if (ds === 'pagosPromesa') {
    data.promesaId = parseInt(data.promesaId, 10) || data.promesaId;
    const promesa = (DB.promesas||[]).find(p => p.id == data.promesaId);
    const camp = promesa ? (DB.campanas||[]).find(c => c.id == promesa.campanaId) : null;
    data.fondo = camp?.fondo || 'Fondo General';
    data.cuentaCr = '4008';
    data._miembroLabel = promesa?.miembro || '';
    data._campanaLabel = camp?.nombre || '';
  }

  if (editingId) {
    const idx = DB[ds].findIndex(r => r.id === editingId);
    if (idx >= 0) {
      DB[ds][idx] = { ...DB[ds][idx], ...data };
      const rec = DB[ds][idx];
      _logAudit('Editar', ds, editingId, rec);
      if (rec._transId) {
        const ti = DB.transacciones.findIndex(t => t.id === rec._transId);
        if (ti >= 0) {
          DB.transacciones[ti] = { ...DB.transacciones[ti], ...buildLinkedTrans(ds, rec) };
        }
      }
    }
  } else {
    data.id = nextId();
    const trans = buildLinkedTrans(ds, data);
    trans.id = nextId();
    data._transId = trans.id;
    DB[ds].unshift(data);
    DB.transacciones.unshift(trans);
    _logAudit('Crear', ds, data.id, data);
  }
  return saveDB();
}

// ── V17: TRANSACCIONES RECURRENTES ─────────────────────────
// Auto-generates one Gasto (+ linked Transacción) per active template per
// calendar month. Runs once on every loadDB() — idempotent per month via
// ultimoMes, so opening the app twice in the same month never double-posts.
// Never runs for the first month a template is created in (ultimoMes is
// seeded to the creation month) — that first occurrence is expected to be
// entered manually if it already happened, avoiding a surprise duplicate.
function _procesarRecurrentes() {
  const ym = today().slice(0,7); // 'YYYY-MM'
  let changed = false;
  (DB.recurrentes||[]).forEach(r => {
    if (!r.activo) return;
    if (!r.ultimoMes) { r.ultimoMes = ym; changed = true; return; } // seed, don't backfill history
    if (r.ultimoMes >= ym) return; // already generated for this month (or in the future — clock rollback)
    const dia = Math.min(Math.max(parseInt(r.diaMes,10) || 1, 1), 28);
    const esIngreso = r.tipoMov === 'Ingreso';
    const data = {
      fecha: `${ym}-${String(dia).padStart(2,'0')}`,
      monto: r.monto || 0,
      desc: r.desc || (esIngreso ? 'Ingreso recurrente' : 'Gasto recurrente'),
      cat: r.cat || '',
      metodo: r.metodo || 'Transferencia',
      fondo: r.fondo || 'Fondo General',
      ref: `REC-${r.id}-${ym}`,
      estado: 'Pagado',
      _recurrenteId: r.id,
    };
    if (esIngreso) { data.cuentaCr = r.cuentaCodigo || '4005'; }
    else           { data.cuentaDr = r.cuentaCodigo || ''; data.proveedor = r.proveedor || ''; }
    const _recOk = saveSourceRecord(esIngreso ? 'otrosIngresos' : 'gastos', data, null);
    // V18: only advance ultimoMes on a successful save — if a period-lock
    // (or any other) rejection ever hit this (shouldn't in practice, since
    // this always posts to the current month), we don't want to silently
    // skip that month forever.
    if (_recOk) { r.ultimoMes = ym; r._generados = (r._generados||0) + 1; }
    changed = true;
  });
  if (changed) saveDB();
}

// Depósitos represent cash physically moving from Caja into a named bank
// account — a balance-sheet transfer, not income or an expense. Only
// "Confirmado" deposits post to the ledger (so a deposit sitting in
// "En Proceso" doesn't move money before it's actually cleared); posting
// uses a dedicated tipo:'Transferencia' so it never inflates the Estado de
// Resultados (P&L only sums Ingreso/Egreso). This is what makes deposits
// finally show up in Caja / Cuenta Bancaria balances on the Balance General.
function saveDeposito(data, editingId) {
  // V18: period-lock backstop — see _assertPeriodoAbierto().
  if (editingId) {
    const existing = (DB.depositos||[]).find(r => r.id === editingId);
    if (existing && !_assertPeriodoAbierto('depositos', existing.fecha)) return false;
  }
  if (data.fecha !== undefined && !_assertPeriodoAbierto('depositos', data.fecha)) return false;

  if (data.monto !== undefined) data.monto = parseMoney(data.monto);

  const shouldPost = data.estado === 'Confirmado';
  const banco = (DB.bancos||[]).find(b => b.nombre === data.banco);
  const cuentaBanco = banco?.cuenta || '1002';

  function buildTransfer(rec) {
    return {
      fecha: rec.fecha || today(),
      desc:  rec.desc || `Depósito — ${rec.banco||'Banco'}`,
      cat:   'Depósito',
      ref:   rec.ref || `DEP-${rec.id}`,
      tipo:  'Transferencia',
      tipoOrigen: 'Depósito',
      metodo: rec.metodo || 'Efectivo',
      monto: rec.monto || 0,
      estado: 'Completado',
      fondo: 'Fondo General',
      cuentaDr: cuentaBanco,             // entra a la cuenta bancaria
      cuentaCr: rec.cuentaOrigen || '1001', // sale de Caja/Efectivo o CashApp, según se eligió
      _srcDs: 'depositos',
      _srcId: rec.id,
    };
  }

  if (editingId) {
    const idx = DB.depositos.findIndex(r => r.id === editingId);
    if (idx < 0) return false;
    DB.depositos[idx] = { ...DB.depositos[idx], ...data };
    const rec = DB.depositos[idx];
    _logAudit('Editar', 'depositos', editingId, rec);
    const ti = rec._transId ? DB.transacciones.findIndex(t => t.id === rec._transId) : -1;

    if (shouldPost) {
      if (ti >= 0) {
        DB.transacciones[ti] = { ...DB.transacciones[ti], ...buildTransfer(rec) };
      } else {
        const trans = buildTransfer(rec);
        trans.id = nextId();
        rec._transId = trans.id;
        DB.transacciones.unshift(trans);
      }
    } else if (ti >= 0) {
      // No longer confirmed (back to "En Proceso" / "Cancelado") — pull the
      // posting back out so it stops affecting account balances.
      DB.transacciones.splice(ti, 1);
      rec._transId = null;
    }
  } else {
    data.id = nextId();
    if (shouldPost) {
      const trans = buildTransfer(data);
      trans.id = nextId();
      data._transId = trans.id;
      DB.transacciones.unshift(trans);
    }
    DB.depositos.unshift(data);
    _logAudit('Crear', 'depositos', data.id, data);
  }
  return saveDB();
}

// Save any other record (transacciones, depositos, gastos, etc.)
function saveRecord(ds, data, editingId) {
  // V18: period-lock backstop — see _assertPeriodoAbierto(). Checks both the
  // record's existing fecha (if editing) and the fecha being saved (create
  // or edit), so moving a date INTO a closed period is blocked too.
  if (editingId) {
    const existing = (DB[ds]||[]).find(r => r.id === editingId);
    if (existing && !_assertPeriodoAbierto(ds, existing.fecha)) return false;
  }
  if (data.fecha !== undefined && !_assertPeriodoAbierto(ds, data.fecha)) return false;

  const numFields = ['monto','ingresos','gastos','presupuestado','ejecutado','saldoInicial'];
  numFields.forEach(k => { if (data[k] !== undefined) data[k] = parseMoney(data[k]); });
  const intFields = ['asistentes','diaMes'];
  intFields.forEach(k => { if (data[k] !== undefined) data[k] = parseInt(data[k]) || 0; });
  // Fondos' Estado select posts the string 'true'/'false' — coerce to a real boolean
  // so activo-based filtering (_fondosOpts, balance calc, etc.) works correctly.
  if (ds === 'fondos' && data.activo !== undefined) data.activo = (data.activo === 'true' || data.activo === true);
  // Same string→boolean coercion for Recurrentes' and Campañas' Estado select.
  if ((ds === 'recurrentes' || ds === 'campanas') && data.activo !== undefined) data.activo = (data.activo === 'true' || data.activo === true);
  // A brand-new recurring template shouldn't retroactively generate a gasto
  // for the current month if it's created mid-month — seed ultimoMes to now
  // so _procesarRecurrentes() only picks it up starting next month.
  if (ds === 'recurrentes' && !editingId) data.ultimoMes = today().slice(0,7);

  // V8a: manually-entered rows on the generic Transacciones screen have no
  // _srcDs (nothing links them to a source module) — stamp Otro Ingreso/Gasto
  // so the unified model still classifies them consistently. Guarded so
  // editing a linked row (Diezmo/Gasto/etc.) through this screen never
  // overwrites its real origin.
  if (ds === 'transacciones' && data.tipo) {
    const existing = editingId ? DB.transacciones.find(r => r.id === editingId) : null;
    if (!existing || !existing._srcDs) {
      data.tipoOrigen = data.tipo === 'Egreso' ? 'Otro Gasto' : 'Otro Ingreso';
    }
  }

  // V10: Ministerio is a multi-select (checkboxes synced into one hidden
  // input as a comma-joined string) — split it back into an array here so
  // it's stored/queried the same way the rest of the app expects arrays.
  if (ds === 'miembros') {
    data.ministerio = (data.ministerio||'').toString().split(',').map(s=>s.trim()).filter(Boolean);
  }

  // V4: No. de Sobre — auto-assign if blank, always enforce uniqueness.
  if (ds === 'miembros') {
    let sobre = (data.sobre||'').toString().trim();
    if (!sobre) sobre = _allocateNextSobre();
    const dup = DB.miembros.find(m => m.id !== editingId && (m.sobre||'').toString().trim().toLowerCase() === sobre.toLowerCase());
    if (dup) {
      showToast(`⚠ El No. de Sobre "${sobre}" ya está en uso por ${dup.nombre}.`, 'err');
      return false;
    }
    data.sobre = sobre;
    _advanceSobreCounter(sobre);
  }

  if (editingId) {
    const idx = DB[ds].findIndex(r => r.id === editingId);
    if (idx >= 0) { DB[ds][idx] = { ...DB[ds][idx], ...data }; _logAudit('Editar', ds, editingId, DB[ds][idx]); }
  } else {
    data.id = nextId();
    DB[ds].unshift(data);
    _logAudit('Crear', ds, data.id, data);
  }
  return saveDB();
}

function deleteRecord(ds, id) {
  const rec = (DB[ds] || []).find(r => r.id === id);
  if (!rec) return false;
  // V18: period-lock backstop — see _assertPeriodoAbierto().
  if (!_assertPeriodoAbierto(ds, rec.fecha)) return false;
  // Guard: a Cuenta Contable or Cuenta Bancaria still referenced by historical
  // transactions cannot be hard-deleted — deactivate it instead (avoids orphaning
  // financial history, which the codigo/nombre-based references can't recover from).
  if (ds === 'cuentas' && _cuentaCodigoInUse(rec.codigo)) {
    showToast('⚠ No se puede eliminar: esta cuenta tiene transacciones registradas.', 'err');
    return false;
  }
  if (ds === 'bancos' && _bancoInUse(rec.nombre)) {
    showToast('⚠ No se puede eliminar: esta cuenta bancaria tiene transacciones registradas. Márcala Inactiva en su lugar.', 'err');
    return false;
  }
  if (ds === 'fondos' && _fondoInUse(rec.nombre)) {
    showToast('⚠ No se puede eliminar: este fondo tiene movimientos registrados. Márcalo Inactivo en su lugar.', 'err');
    return false;
  }
  // cascade: delete linked transaction
  if (rec._transId) {
    DB.transacciones = DB.transacciones.filter(t => t.id !== rec._transId);
  }
  // cascade: if deleting a transaction, clear _transId on source
  if (ds === 'transacciones' && rec._srcDs && rec._srcId) {
    const src = (DB[rec._srcDs] || []).find(r => r.id === rec._srcId);
    if (src) delete src._transId;
  }
  // V17.1 cascade: deleting a Promesa removes its Pagos de Promesa (and their
  // linked transacciones); deleting a Campaña removes its Promesas (and, via
  // the recursive call, their Pagos too) — avoids orphaned payment records.
  if (ds === 'promesas') {
    (DB.pagosPromesa||[]).filter(pg => pg.promesaId == id).forEach(pg => deleteRecord('pagosPromesa', pg.id));
  }
  if (ds === 'campanas') {
    (DB.promesas||[]).filter(p => p.campanaId == id).forEach(p => deleteRecord('promesas', p.id));
  }
  _logAudit('Eliminar', ds, id, rec);
  DB[ds] = DB[ds].filter(r => r.id !== id);
  return saveDB();
}

// Chart-of-accounts codes are referenced explicitly via cuentaCr/cuentaDr on income
// entries and unified transactions, and implicitly via CAT_MAP for expense categories
// that haven't been overridden — check all three before allowing a hard delete.
function _cuentaCodigoInUse(codigo) {
  if (!codigo) return false;
  const withCuentaFields = ['diezmos','ofrendas','donaciones','ventas','otrosIngresos','transacciones'];
  if (withCuentaFields.some(k => (DB[k]||[]).some(r => r.cuentaCr === codigo || r.cuentaDr === codigo))) return true;
  // Category-derived (no explicit override): any gasto/evento/transacción whose CAT_MAP
  // entry points at this code, and that hasn't overridden it with its own cuentaCr/cuentaDr.
  const catsUsingCodigo = Object.keys(CAT_MAP).filter(cat => CAT_MAP[cat].dr === codigo || CAT_MAP[cat].cr === codigo);
  if (catsUsingCodigo.length) {
    if ((DB.gastos||[]).some(g => catsUsingCodigo.includes(g.cat) && !g.cuentaCr && !g.cuentaDr)) return true;
    if ((DB.eventos||[]).some(g => catsUsingCodigo.includes(g.cat) && !g.cuentaCr && !g.cuentaDr)) return true;
    if ((DB.transacciones||[]).some(t => catsUsingCodigo.includes(t.cat) && !t.cuentaCr && !t.cuentaDr)) return true;
  }
  return false;
}

function _bancoInUse(nombre) {
  if (!nombre) return false;
  return ['diezmos','ofrendas','donaciones','depositos'].some(k => (DB[k]||[]).some(r => r.banco === nombre));
}

// ── ACCOUNTING ENGINE ──────────────────────────────────────
function ensureCuentas() {
  if (!DB.cuentas || DB.cuentas.length === 0) {
    DB.cuentas = DEFAULT_CUENTAS.map(c => ({...c}));
    return;
  }
  // Forward-only merge: add any default account codes introduced in a later
  // version that an existing installation doesn't have yet. Never touches
  // accounts the user has already customized or removed intentionally.
  const have = new Set(DB.cuentas.map(c => c.codigo));
  DEFAULT_CUENTAS.forEach(c => { if (!have.has(c.codigo)) DB.cuentas.push({...c}); });
}

// V11: statuses that actually move money. A Pendiente or Cancelado record
// is real for record-keeping (still shows in Todas las Transacciones) but
// must never touch the General Ledger / account balances — see FIX #4.
const POSTABLE_ESTADOS = new Set(['Completado','Pagado','Confirmado']);

// ============================================================
// V18: CIERRE DE PERIODO — cutoff-date lock
// ============================================================
// Single rolling cutoff (DB.config.cierre.fecha) rather than a list of
// discrete closed periods: everything dated on or before the cutoff is
// locked, regardless of which module it lives in. Closing "hasta Enero
// 2026" or "hasta el Año 2025" both just move this one date forward — see
// renderCierrePeriodo(). Modules whose records represent a dated,
// ledger-affecting movement of money are lockable; catalogs, templates and
// non-financial records (Miembros, Proveedores, Presupuesto, Catálogo de
// Cuentas, Bancos, Fondos, Usuarios, Campañas, Promesas, Recurrentes) are
// not — a Promesa is a pledge, not a movement; its Pago de Promesa is.
const LOCKABLE_DS = new Set(['diezmos','ofrendas','donaciones','gastos','ventas','eventos',
                              'otrosIngresos','depositos','pagosPromesa','transacciones','transferencias']);
const LOCKABLE_DS_LABEL = {
  diezmos:'Diezmo', ofrendas:'Ofrenda', donaciones:'Donación', gastos:'Gasto', ventas:'Venta',
  eventos:'Evento', otrosIngresos:'Otro Ingreso', depositos:'Depósito', pagosPromesa:'Pago de Promesa',
  transacciones:'Transacción', transferencias:'Transferencia',
};
function _periodoActivo() { return DB.config?.cierre || null; }
function _fechaBloqueada(fecha) {
  const c = _periodoActivo();
  return !!(c && fecha && String(fecha).slice(0,10) <= c.fecha);
}
// Descriptive label for any record of a lockable ds — used by the lock
// modal and the Ajustes picker so both show something readable regardless
// of which module the record came from.
function _dsRecordLabel(ds, rec) {
  if (!rec) return LOCKABLE_DS_LABEL[ds] || ds;
  if (ds === 'transferencias') return `${rec.origen||'?'} → ${rec.destino||'?'}`;
  return rec.desc || rec.miembro || rec.donante || rec.evento || rec.tipo || LOCKABLE_DS_LABEL[ds] || ds;
}
// Save/delete-time backstop (defense in depth): catches both brand-new
// backdated entries and any edit that tries to move a record's date into
// (or that already sits in) a closed period, no matter which UI path
// reached it. openModal()/confirmDelete() give the friendlier
// "crear ajuste" flow *before* this ever fires for edits/deletes of an
// already-existing locked record — this is the plain-toast safety net.
function _assertPeriodoAbierto(ds, fecha) {
  if (!LOCKABLE_DS.has(ds)) return true;
  if (!_fechaBloqueada(fecha)) return true;
  const c = _periodoActivo();
  showToast(`⚠ ${fmtDate(fecha)} está dentro del periodo cerrado hasta el ${fmtDate(c.fecha)}. Usa una Entrada de Ajuste.`, 'err');
  return false;
}
// UI-level entry point for editing/deleting an EXISTING locked record —
// explains why, then offers a one-click path into the Ajustes screen with
// this record pre-selected as the reference.
function _showPeriodLockModal(ds, id, fecha) {
  const c = _periodoActivo();
  const rec = (DB[ds]||[]).find(r => r.id === id);
  const desc = _dsRecordLabel(ds, rec);
  showConfirm(
    '🔒 Periodo Cerrado',
    `"${desc}" es del ${fmtDate(fecha)}, dentro del periodo cerrado hasta el ${fmtDate(c.fecha)} (cerrado por ${c.cerradoPor||'—'} el ${fmtDate((c.cerradoEl||'').slice(0,10))}). No se puede editar ni eliminar directamente — para corregirlo, crea una Entrada de Ajuste fechada después del cierre, vinculada a este registro.`,
    'Crear Entrada de Ajuste',
    () => _abrirAjustePara(ds, id),
    'primary'
  );
}
let _ajustePrefill = null;
function _abrirAjustePara(ds, id) {
  _ajustePrefill = { ds, id };
  showModule('ajustes');
}

function generateJournal() {
  ensureCuentas();
  let jid = 1;
  DB.journal = DB.transacciones
    // FIX #4: Pendiente/Cancelado (or any other non-final status) never posts.
    .filter(t => POSTABLE_ESTADOS.has(t.estado || 'Completado'))
    // FIX #3: a Fondo-to-Fondo transfer is a memo reallocation tracked in its
    // own right by DB.transferencias/fundLedger — it never had a real
    // cuentaDr/cuentaCr, so it used to fall into generateJournal's category
    // fallback and post as a phantom "Otros Gastos" debit + real bank credit,
    // silently draining the bank account in the ledger for money that never
    // moved. Excluded from the GL entirely now; still visible in Todas las
    // Transacciones and each fund's own ledger, just not double-entry posted.
    .filter(t => !t.soloFondo)
    .map(t => {
    const map = CAT_MAP[t.cat] || (t.tipo === 'Ingreso' ? {dr:'1001',cr:'4005'} : {dr:'5007',cr:'1002'});
    // Método-based routing only replaces the asset side (which Caja/Banco/
    // CashApp account moved) — the income/expense-category side from
    // CAT_MAP is untouched. An explicit cuentaDr/cuentaCr on the record
    // (manual override, or set by Depósito/Transferencia logic) always wins.
    const metodoCuenta = METODO_CUENTA_MAP[t.metodo];
    const drCod = t.cuentaDr || (t.tipo === 'Ingreso' && metodoCuenta ? metodoCuenta : map.dr);
    const crCod = t.cuentaCr || (t.tipo === 'Egreso'  && metodoCuenta ? metodoCuenta : map.cr);
    const drCuenta = (DB.cuentas.find(c => c.codigo === drCod) || {}).nombre || drCod;
    const crCuenta = (DB.cuentas.find(c => c.codigo === crCod) || {}).nombre || crCod;
    return {
      id: jid++,
      fecha:    t.fecha,
      desc:     t.desc || '—',
      origen:   t._srcDs || (t.tipo === 'Ingreso' ? 'Ingreso' : 'Egreso'),
      drCod, drCuenta,
      crCod, crCuenta,
      // FIX #1: every posted entry has a real debit account and a real
      // credit account, each moved by the same amount — that's what
      // double-entry means. This used to only fill debe/haber for
      // tipo==='Ingreso'/'Egreso', so every Depósito and (pre-fix) Fondo
      // transfer showed $0/$0 in Libro Diario even though Mayor/Balance
      // (which read straight off `monto`, not these fields) showed the
      // correct amount — the exact "right in one report, wrong in
      // another" bug. Both columns now always reflect the real amount.
      debe:    t.monto || 0,
      haber:   t.monto || 0,
      monto:   t.monto || 0,
      transId: t.id,
    };
  });
}

function getMayorEntries(codigo, asOf) {
  generateJournal();
  const cuenta = DB.cuentas.find(c => c.codigo === codigo);
  const entries = [];
  (DB.journal || []).forEach(j => {
    if (asOf && j.fecha > asOf) return; // V11: as-of-date filter for Balance Sheet
    if (j.drCod === codigo) entries.push({fecha:j.fecha,desc:j.desc,ref:'T#'+j.transId,transId:j.transId,debe:j.monto,haber:0});
    if (j.crCod === codigo) entries.push({fecha:j.fecha,desc:j.desc,ref:'T#'+j.transId,transId:j.transId,debe:0,haber:j.monto});
  });
  entries.sort((a, b) => a.fecha.localeCompare(b.fecha));
  // Cents-safe running balance: this loop is the single highest-risk spot
  // for float drift in the whole app (it accumulates over every posted
  // entry in the account's history), so it adds integer cents rather than
  // dollars-as-floats and only converts back to a decimal once per entry.
  let saldoCents = 0;
  entries.forEach(e => {
    const deltaCents = Math.round(((cuenta?.normal === 'Débito' ? (e.debe - e.haber) : (e.haber - e.debe))) * 100);
    saldoCents += deltaCents;
    e.saldo = saldoCents / 100;
  });
  return entries;
}

function getSaldo(codigo, asOf) {
  const e = getMayorEntries(codigo, asOf);
  return e.length ? e[e.length - 1].saldo : 0;
}

function _periodRange(period, year) {
  const y = year || DB.config?.year || new Date().getFullYear().toString();
  const ranges = {
    all:  [null, null],
    year: [`${y}-01-01`, `${y}-12-31`],
    q1:   [`${y}-01-01`, `${y}-03-31`],
    q2:   [`${y}-04-01`, `${y}-06-30`],
    q3:   [`${y}-07-01`, `${y}-09-30`],
    q4:   [`${y}-10-01`, `${y}-12-31`],
  };
  if (/^m([1-9]|1[0-2])$/.test(period)) {
    const m = Number(period.slice(1));
    const lastDay = new Date(Number(y), m, 0).getDate();
    return [`${y}-${String(m).padStart(2,'0')}-01`, `${y}-${String(m).padStart(2,'0')}-${lastDay}`];
  }
  return ranges[period] || [null, null];
}
function filterByPeriod(arr, period, year) {
  const [from, to] = _periodRange(period, year);
  if (!from) return arr;
  return arr.filter(t => t.fecha >= from && t.fecha <= to);
}

// ── P&L CALC HELPERS (V10) ──────────────────────────────────
// Same-length-equivalent prior period: same quarter/month/year one year back.
// 'all' has no single equivalent prior period, so comparison is skipped.
function _pylPrevPeriod(period, year) {
  if (period === 'all') return null;
  return { period, year: String(Number(year) - 1) };
}
// Annual budget lines (DB.presupuesto) are prorated to the selected window
// so "% ejecutado" is meaningful for a quarter or single month, not just the full year.
function _pylProrateFactor(period) {
  if (period === 'q1' || period === 'q2' || period === 'q3' || period === 'q4') return 0.25;
  if (/^m([1-9]|1[0-2])$/.test(period)) return 1/12;
  return 1;
}
function _pylMonthsForPeriod(period) {
  const ranges = { all:[1,12], year:[1,12], q1:[1,3], q2:[4,6], q3:[7,9], q4:[10,12] };
  if (/^m([1-9]|1[0-2])$/.test(period)) { const m = Number(period.slice(1)); return [m,m]; }
  return ranges[period] || [1,12];
}
function _pylAggByCat(trans, tipo) {
  const map = {};
  trans.filter(t=>t.tipo===tipo).forEach(t => { const k = t.cat||'Sin categoría'; map[k]=(map[k]||0)+(t.monto||0); });
  return map;
}
// Monthly matrix for one tipo within a given year + month range, e.g.
// { 'Diezmo': [4200,4500,4100,...] } aligned to `months`.
function _pylMonthlyByCat(trans, tipo, year, monthsRange) {
  const months = [];
  for (let m = monthsRange[0]; m <= monthsRange[1]; m++) months.push(m);
  const map = {};
  trans.filter(t=>t.tipo===tipo && t.fecha && t.fecha.startsWith(year+'-')).forEach(t => {
    const m = Number(t.fecha.slice(5,7));
    if (!months.includes(m)) return;
    const k = t.cat||'Sin categoría';
    if (!map[k]) map[k] = months.map(()=>0);
    map[k][months.indexOf(m)] += (t.monto||0);
  });
  return { map, months };
}
const _PYL_MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// ── MOBILE PENDING ─────────────────────────────────────────
function getProcessedIds() {
  try { return new Set(JSON.parse(localStorage.getItem('iglesia_processed_ids') || '[]')); }
  catch(e) { return new Set(); }
}

function addProcessedId(id) {
  try {
    const s = getProcessedIds(); s.add(id);
    localStorage.setItem('iglesia_processed_ids', JSON.stringify([...s].slice(-500)));
  } catch(e) {}
  _serverNotifyProcessed(id);
}

function syncMobileQueue() {
  try {
    const stillPending = new Set((DB.pending || []).map(p => p._mobileId));
    const raw = localStorage.getItem('iglesia_mobile_pending');
    if (raw) {
      const filtered = JSON.parse(raw).filter(m => stillPending.has(m._mobileId));
      localStorage.setItem('iglesia_mobile_pending', JSON.stringify(filtered));
    }
  } catch(e) {}
}

function loadMobilePending(cb) {
  try {
    const raw = localStorage.getItem('iglesia_mobile_pending');
    if (raw) {
      const mobile = JSON.parse(raw);
      const processed = getProcessedIds();
      const existIds  = new Set((DB.pending || []).map(p => p._mobileId));
      let changed = false;
      mobile.forEach(m => {
        if (!existIds.has(m._mobileId) && !processed.has(m._mobileId)) {
          DB.pending.push(m); changed = true;
        }
      });
      if (changed) saveDB();
    }
  } catch(e) {}
  if (cb) cb();
}

function approvePending(i, cb) {
  const item = DB.pending[i]; if (!item) return;
  const type = item._type, mobileId = item._mobileId;
  const newItem = deepCopy(item);
  newItem.id = nextId();
  delete newItem._type; delete newItem._mobileId;
  delete newItem._mobileTime; delete newItem._status;

  if (['diezmos','ofrendas','donaciones'].includes(type)) {
    const trans = buildLinkedTrans(type, newItem);
    trans.id = nextId(); newItem._transId = trans.id;
    DB.transacciones.unshift(trans);
  }
  if (DB[type]) DB[type].unshift(newItem);
  DB.pending.splice(i, 1);
  if (mobileId) addProcessedId(mobileId);
  syncMobileQueue();
  try {
    const h = JSON.parse(localStorage.getItem('iglesia_mobile_historial') || '[]');
    h.push({...item, _status:'aprobado', _approvedTime: new Date().toISOString()});
    localStorage.setItem('iglesia_mobile_historial', JSON.stringify(h));
  } catch(e) {}
  saveDB();
  if (cb) cb();
}

function approveAllPending(cb) {
  // Process all pending items - work backwards so splicing doesn't shift indices
  const count = DB.pending.length;
  for (let i = count - 1; i >= 0; i--) {
    const item = DB.pending[i];
    if (!item) continue;
    const type = item._type, mobileId = item._mobileId;
    const newItem = deepCopy(item);
    newItem.id = nextId();
    delete newItem._type; delete newItem._mobileId;
    delete newItem._mobileTime; delete newItem._status;
    if (['diezmos','ofrendas','donaciones'].includes(type)) {
      const trans = buildLinkedTrans(type, newItem);
      trans.id = nextId(); newItem._transId = trans.id;
      DB.transacciones.unshift(trans);
    }
    if (DB[type]) DB[type].unshift(newItem);
    DB.pending.splice(i, 1);
    if (mobileId) addProcessedId(mobileId);
  }
  syncMobileQueue(); saveDB();
  if (cb) cb();
}

function rejectPending(i, cb) {
  const item = DB.pending[i];
  if (item?._mobileId) addProcessedId(item._mobileId);
  DB.pending.splice(i, 1);
  syncMobileQueue(); saveDB();
  if (cb) cb();
}

// ── BACKUP ─────────────────────────────────────────────────
function makeBackup(label = 'Manual') {
  const ts  = new Date().toISOString();
  const key = 'backup_' + ts.replace(/[:.]/g, '_');
  const snap = deepCopy(DB); snap._backupTime = ts;
  DB.backups.unshift({ key, time: ts, size: JSON.stringify(snap).length, label });
  if (DB.backups.length > 30) DB.backups = DB.backups.slice(0, 30);
  const st = DB.settings.backupStatus.local;
  st.lastAttempt = ts;
  try {
    localStorage.setItem('iglesia_bk_' + key, JSON.stringify(snap));
    const bkKeys = Object.keys(localStorage).filter(k => k.startsWith('iglesia_bk_')).sort();
    while (bkKeys.length > 20) localStorage.removeItem(bkKeys.shift());
    st.lastOk = ts; st.lastError = null;
  } catch(e) {
    st.lastError = e.message || 'Error desconocido';
  }
  saveDB();
  _runOffsiteBackups(snap, key, label); // best-effort, never blocks the local backup above
  _refreshBackupIndicator();
}

// ── OFFSITE BACKUP (V18) ─────────────────────────────────────────────
// This app has no server of its own, so "offsite" means one of: a browser
// download (moves the file off this device the moment you save it
// somewhere else — a synced folder, a USB drive, etc.), Google Drive
// (needs a one-time OAuth connection you set up yourself), or a webhook to
// a server/website you control (for once Regreso a Cristo has one). All
// three are independently on/off in DB.settings.backupOffsite and all
// three are best-effort — a failure here never touches the local backup
// that already succeeded above.
function _runOffsiteBackups(snap, key, label) {
  const cfg = DB.settings?.backupOffsite || {};
  const status = DB.settings.backupStatus;
  const json = JSON.stringify(snap);
  const now = new Date().toISOString();
  if (cfg.autoDownload) {
    status.autoDownload.lastAttempt = now;
    try {
      dlBlob(json, 'application/json', 'respaldo_' + key + '.json');
      status.autoDownload.lastOk = now; status.autoDownload.lastError = null;
    } catch(e) {
      status.autoDownload.lastError = e.message || 'Error desconocido';
    }
    saveDB(); _refreshBackupIndicator();
  }
  if (cfg.googleDrive?.enabled && cfg.googleDrive?.connected) {
    status.googleDrive.lastAttempt = now;
    _gdriveUpload(json, 'respaldo_' + key + '.json').then(() => {
      status.googleDrive.lastOk = new Date().toISOString(); status.googleDrive.lastError = null;
      saveDB(); _refreshBackupIndicator();
    }).catch(err => {
      status.googleDrive.lastError = err.message || 'Error desconocido';
      saveDB(); _refreshBackupIndicator();
      console.warn('Respaldo a Google Drive falló:', err);
      showToast('⚠ El respaldo a Google Drive falló (revisa la conexión en Configuración → Importar y Exportar).', 'warn');
    });
  }
  if (cfg.webhook?.enabled && cfg.webhook?.url) {
    status.webhook.lastAttempt = now;
    fetch(cfg.webhook.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: json,
    }).then(res => {
      if (!res.ok) throw new Error('Servidor respondió ' + res.status);
      status.webhook.lastOk = new Date().toISOString(); status.webhook.lastError = null;
      saveDB(); _refreshBackupIndicator();
    }).catch(err => {
      status.webhook.lastError = err.message || 'Error desconocido';
      saveDB(); _refreshBackupIndicator();
      console.warn('Respaldo por webhook falló:', err);
    });
  }
}

// ── Google Drive backup (OAuth via Google Identity Services) ────────────
// Uses drive.file scope only — this app can only see/write files it
// itself created via this connection, never the rest of the admin's
// Drive. clientId is created by you (free) in Google Cloud Console →
// APIs & Services → Credentials → OAuth Client ID (type "Web
// application"), with this page's origin added under "Authorized
// JavaScript origins". Nothing is hardcoded here — no Anthropic/Claude
// account, no shared credential, is involved.
let _gdriveTokenClient = null, _gdriveAccessToken = null;
function _gdriveLoadScript() {
  return new Promise((resolve, reject) => {
    if (window.google?.accounts?.oauth2) return resolve();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = resolve;
    s.onerror = () => reject(new Error('No se pudo cargar Google Identity Services (¿sin conexión a internet?)'));
    document.head.appendChild(s);
  });
}
async function gdriveConnect() {
  const clientId = (el('gd-client-id')?.value || DB.settings.backupOffsite.googleDrive.clientId || '').trim();
  if (!clientId) { showToast('⚠ Ingresa tu Client ID de Google Cloud primero.', 'err'); return; }
  DB.settings.backupOffsite.googleDrive.clientId = clientId;
  saveDB();
  try {
    await _gdriveLoadScript();
    await new Promise((resolve, reject) => {
      _gdriveTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (resp) => {
          if (resp.error) { reject(new Error(resp.error)); return; }
          _gdriveAccessToken = resp.access_token;
          DB.settings.backupOffsite.googleDrive.connected = true;
          saveDB();
          showToast('✔ Conectado a Google Drive.');
          resolve();
        },
      });
      _gdriveTokenClient.requestAccessToken();
    });
    renderConfigDatos();
  } catch (e) {
    showToast('⚠ No se pudo conectar a Google Drive: ' + e.message, 'err');
  }
}
function gdriveDisconnect() {
  _gdriveAccessToken = null;
  DB.settings.backupOffsite.googleDrive.connected = false;
  saveDB();
  renderConfigDatos();
}
async function _gdriveEnsureToken() {
  if (_gdriveAccessToken) return _gdriveAccessToken;
  await _gdriveLoadScript();
  const clientId = DB.settings.backupOffsite.googleDrive.clientId;
  if (!clientId) throw new Error('Google Drive no está conectado');
  return new Promise((resolve, reject) => {
    _gdriveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: (resp) => resp.error ? reject(new Error(resp.error)) : (_gdriveAccessToken = resp.access_token, resolve(resp.access_token)),
    });
    _gdriveTokenClient.requestAccessToken({ prompt: '' });
  });
}
async function _gdriveUpload(json, filename) {
  const token = await _gdriveEnsureToken();
  const boundary = 'iglesiafinanzas_' + Date.now();
  const metadata = { name: filename, mimeType: 'application/json' };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
    body,
  });
  if (!res.ok) throw new Error('Drive API ' + res.status);
  return res.json();
}
function gdriveBackupNow() {
  const snap = deepCopy(DB); snap._backupTime = new Date().toISOString();
  const status = DB.settings.backupStatus.googleDrive;
  status.lastAttempt = new Date().toISOString();
  _gdriveUpload(JSON.stringify(snap), 'respaldo_manual_' + Date.now() + '.json')
    .then(() => {
      status.lastOk = new Date().toISOString(); status.lastError = null;
      saveDB(); _refreshBackupIndicator();
      showToast('✔ Respaldo subido a Google Drive.');
    })
    .catch(e => {
      status.lastError = e.message || 'Error desconocido';
      saveDB(); _refreshBackupIndicator();
      showToast('⚠ Falló la subida a Google Drive: ' + e.message, 'err');
    });
}
function toggleOffsiteOption(path, checkboxEl) {
  const parts = path.split('.');
  let obj = DB.settings.backupOffsite;
  for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
  obj[parts[parts.length - 1]] = checkboxEl.checked;
  saveDB();
  _refreshBackupIndicator();
}
function saveWebhookUrl() {
  DB.settings.backupOffsite.webhook.url = (el('wh-url')?.value || '').trim();
  if (saveDB()) showToast('✔ URL guardada');
}
function saveBackupInterval(inputEl) {

  inputEl.value = h;

function _destinoStatusLine(st) {
  if (!st.lastAttempt) return '<div style="font-size:10px;color:var(--muted);margin-top:4px">Sin intentos todavía.</div>';
  const failed = st.lastAttempt > (st.lastOk || '');
  if (failed) return `<div style="font-size:10px;color:var(--danger);margin-top:4px">⚠ Último intento falló (${fmtDateTime(st.lastAttempt)}): ${esc(st.lastError||'')}</div>`;
  return `<div style="font-size:10px;color:var(--success);margin-top:4px">✔ Último éxito: ${fmtDateTime(st.lastOk)}</div>`;
}

function autoBackupOnOpen() {
  const d = new Date().toDateString();
  if (localStorage.getItem('iglesia_last_backup_day') !== d) {
    localStorage.setItem('iglesia_last_backup_day', d);
    makeBackup('Auto-Apertura');
  }
}

let _autoBackupTimer = null;
function _startAutoBackupTimer() {
  clearInterval(_autoBackupTimer);
  const hours = parseInt(DB.settings?.backupSchedule?.intervalHours, 10) || 6;
  _autoBackupTimer = setInterval(() => {
    if (_authSession.loggedIn) makeBackup('Auto-Intervalo');
  }, hours * 3600000);
}
function _stopAutoBackupTimer() {

  _autoBackupTimer = null;

function backupOnLogout() {
  makeBackup('Auto-Cierre de Sesión');
}

function _fmtHoursAgo(iso) {
  if (!iso) return null;
  const h = (Date.now() - new Date(iso).getTime()) / 3600000;
  if (h < 1) return 'hace ' + Math.max(1, Math.round(h * 60)) + ' min';
  if (h < 48) return 'hace ' + Math.round(h) + ' h';
  return 'hace ' + Math.round(h / 24) + ' días';
}
function _backupStatusSummary() {
  const status = DB.settings.backupStatus;
  const cfg = DB.settings.backupOffsite;
  const hours = parseInt(DB.settings?.backupSchedule?.intervalHours, 10) || 6;
  const staleAfterH = Math.max(hours * 2, 24);
  const local = status.local;
  const failures = [];
  if (local.lastError && (!local.lastOk || local.lastError && local.lastAttempt > (local.lastOk || ''))) failures.push('Local');
  if (cfg.googleDrive?.enabled && status.googleDrive.lastAttempt && status.googleDrive.lastAttempt > (status.googleDrive.lastOk || '')) failures.push('Google Drive');
  if (cfg.webhook?.enabled && cfg.webhook?.url && status.webhook.lastAttempt && status.webhook.lastAttempt > (status.webhook.lastOk || '')) failures.push('Servidor Propio');
  const stale = !local.lastOk || (Date.now() - new Date(local.lastOk).getTime()) / 3600000 > staleAfterH;
  const ok = !failures.length && !stale;
  let text;
  if (!local.lastOk) text = 'Sin respaldo local todavía';
  else text = 'Último respaldo: ' + _fmtHoursAgo(local.lastOk);
  return { ok, text, failures, stale, local };
}
function _refreshBackupIndicator() {
  const elInd = el('backup-indicator');
  if (!elInd) return;
  if (!_authSession.loggedIn) { elInd.style.display = 'none'; return; }
  const s = _backupStatusSummary();
  elInd.style.display = 'inline-flex';
  elInd.style.alignItems = 'center';
  elInd.style.justifyContent = 'center';
  elInd.style.gap = '6px';
  const color = s.ok ? 'var(--success)' : 'var(--danger)';
  elInd.innerHTML = `<span class="bi-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0"></span><span class="bi-text">${esc(s.text)}</span>`;
  elInd.style.background = s.ok ? 'rgba(61,170,110,.12)' : 'rgba(217,79,79,.15)';
  elInd.style.color = color;
  let title = s.local.lastOk ? 'Último respaldo local exitoso: ' + fmtDateTime(s.local.lastOk) : 'Todavía no se ha hecho ningún respaldo local.';
  if (s.failures.length) title += '\nFalló el último intento en: ' + s.failures.join(', ');
  if (s.stale && s.local.lastOk) title += '\nHan pasado más de ' + Math.max((DB.settings?.backupSchedule?.intervalHours||6)*2,24) + ' horas desde el último respaldo exitoso.';
  title += '\n(Clic para ver detalle en Configuración)';
  elInd.title = title;
}
function _goToBackupSettings() {
  showModule('configuracion');

}

function downloadBackup(key) {
