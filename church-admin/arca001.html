// ── EXPORT / IMPORT ────────────────────────────────────────
function dlBlob(content, mime, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
}

function exportJSON() {
  if (!requirePerm('exportarDatos','Exportar datos')) return;
  dlBlob(JSON.stringify(DB, null, 2), 'application/json', `iglesia_${today()}.json`);
  showToast('✔ JSON exportado');
}

// V13: a "system settings" export/import, deliberately separate from both
// the full-database backup above and the per-module exports below — this
// one only ever touches DB.config (church info, logo, EIN, letter template…)
// and DB.settings (the configurable lists), never any transaction data.
// Useful for copying one church's setup into a fresh install, or restoring
// just the configuration without touching real financial records.
function exportSystemSettingsJSON() {
  if (!requirePerm('exportarDatos','Exportar datos')) return;
  const payload = {
    __type: 'iglesiaFinanzas.systemSettings',
    __version: 1,
    exportedAt: new Date().toISOString(),
    config: DB.config || {},
    settings: DB.settings || {},
  };
  dlBlob(JSON.stringify(payload, null, 2), 'application/json', `configuracion_sistema_${today()}.json`);
  showToast('✔ Configuración del sistema exportada');
}
function importSystemSettingsJSON(file) {
  if (!requirePerm('exportarDatos','Exportar datos')) return;
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let parsed;
    try { parsed = JSON.parse(e.target.result); }
    catch(err) { showToast('⚠ Archivo JSON inválido.', 'err'); return; }
    if (!parsed || parsed.__type !== 'iglesiaFinanzas.systemSettings') {
      showToast('⚠ Este archivo no es una exportación de "Configuración del Sistema" válida.', 'err'); return;
    }
    showConfirm('¿Reemplazar la configuración del sistema?',
      'Se sobrescribirán los datos de la iglesia, el logo y las listas (servicios, métodos de pago, roles, estados, ministerios). Los diezmos, ofrendas, gastos y demás transacciones no se tocan.',
      'Reemplazar', () => {
        DB.config = parsed.config || DB.config;
        DB.settings = parsed.settings || DB.settings;
        if (saveDB()) { showToast('✔ Configuración del sistema importada'); applyChurchName(); showDashboard(); }
      });
  };
  reader.readAsText(file);
}

function exportXLSX() {
  if (!requirePerm('exportarDatos','Exportar datos')) return;
  if (typeof XLSX === 'undefined') { showToast('Librería Excel no cargada','err'); return; }
  const wb = XLSX.utils.book_new();
  // V13 completeness audit: this used to omit Fondos, Usuarios, Auditoría,
  // Reconciliaciones, and Config/Listas — those are now included below so a
  // "Respaldo Completo (Excel)" genuinely has everything exportJSON() does,
  // just split across sheets. Usuarios strips PIN/password hashes and salts;
  // everything else is exported as-is.
  const usuariosSafe = (DB.usuarios||[]).map(u => ({
    id:u.id, nombre:u.nombre, usuario:u.usuario, correo:u.correo, rol:u.rol,
    activo:u.activo, fechaCreacion:u.fechaCreacion, ultimoAcceso:u.ultimoAcceso,
  }));
  const configRow = [{ ...(DB.config||{}), logo: (DB.config&&DB.config.logo) ? '(imagen — ver app)' : '' }];
  const settingsFlat = [];
  const s = DB.settings || {};
  ['servicios','metodosPago','rolesMiembro','estadosMiembro','ministerios'].forEach(listKey => {
    (s[listKey]||[]).forEach(item => settingsFlat.push({ lista:listKey, ...item }));
  });

  const sheets = {
    Transacciones: DB.transacciones, Transferencias: DB.transferencias, Depositos: DB.depositos, Gastos: DB.gastos,
    Diezmos: DB.diezmos, Ofrendas: DB.ofrendas, Donaciones: DB.donaciones,
    Miembros: DB.miembros, Proveedores: DB.proveedores,
    Ventas: DB.ventas, Eventos: DB.eventos, EventosHistorico: DB.eventosHistorico,
    OtrosIngresos: DB.otrosIngresos,
    Presupuesto: DB.presupuesto,
    CuentasBancarias: DB.bancos, Catalogo: DB.cuentas,
    Fondos: DB.fondos,
    Reconciliaciones: DB.reconciliaciones,
    Auditoria: DB.auditLog,
    Usuarios: usuariosSafe,
    Config: configRow,
    Listas: settingsFlat,
  };
  for (const [name, data] of Object.entries(sheets)) {
    if (data && data.length) {
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), name);
    }
  }
  XLSX.writeFile(wb, `iglesia_${today()}.xlsx`);
  showToast('✔ Excel exportado');
}

// ============================================================
// ── ENVIAR POR CORREO (V11) ──────────────────────────────────
// No backend/mail server here, so this can't attach a file automatically —
// it triggers the normal PDF/Excel download and opens a mailto: draft with
// instructions to attach it, or (for "Vista") drops a plain-text summary
// straight into the email body.
// ============================================================
// PDF EXPORT ENGINE (V10)
// Client-side PDF generation via jsPDF + autoTable (loaded from CDN
// above) — a real downloadable .pdf, not just window.print(). Draws the
// same church membrete (cross + name + address) as the branded print
// engine, then one or more autoTable sections. Reused by the P&L,
// Balance General, and the filtered-transactions print/export modal so
// "export to PDF" works the same way everywhere.
// ============================================================
function _pdfDrawCross(doc, cx, cy, size) {
  doc.setDrawColor(201,168,76);
  doc.setLineWidth(2.2);
  doc.line(cx, cy-size, cx, cy+size*0.9);
  doc.line(cx-size*0.55, cy-size*0.25, cx+size*0.55, cy-size*0.25);
}
// Resolves the effective logo mode ('real' | 'generico' | 'ninguno') for a
// PDF header/letterhead. An explicit override (e.g. from the Declaraciones
// screen's own selector) wins; otherwise falls back to the matching global
// default in Configuración, and finally to 'real' when a logo is on file
// (so uploading a real logo makes it show up everywhere by default) or
// 'generico' when there isn't one.
function _resolveLogoMode(explicitMode, configKey) {
  const c = DB.config||{};
  const mode = explicitMode || c[configKey];
  if (mode === 'real' || mode === 'generico' || mode === 'ninguno') return mode;
  return c.logo ? 'real' : 'generico';
}
// Draws the logo art itself (real image / generic cross / nothing) centered
// at (cx, cy). Returns true if something was actually drawn.
function _pdfDrawLogoArt(doc, cx, cy, size, mode) {
  const c = DB.config||{};
  if (mode === 'ninguno') return false;
  if (mode === 'real' && c.logo) {
    try { doc.addImage(c.logo, 'PNG', cx-size, cy-size, size*2, size*2); return true; }
    catch(e) { _pdfDrawCross(doc, cx, cy, size*0.55); return true; }
  }
  _pdfDrawCross(doc, cx, cy, size*0.55);
  return true;
}
function _pdfHeader(doc, title, subtitle, logoMode) {
  const c = DB.config||{};
  const pw = doc.internal.pageSize.getWidth();
  const cx = pw/2;
  const mode = _resolveLogoMode(logoMode, 'reportLogoMode');
  const drewLogo = _pdfDrawLogoArt(doc, cx, 34, 16, mode);
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(26,45,66);
  doc.text(c.name||'Iglesia', cx, drewLogo ? 54 : 40, {align:'center'});
  const addrLine = [c.dir, c.tel, c.email].filter(Boolean).join('  ·  ');
  let y = drewLogo ? 64 : 50;
  if (addrLine) {
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(100,100,100);
    doc.text(addrLine, cx, y, {align:'center'});
    y += 10;
  }
  doc.setDrawColor(26,45,66); doc.setLineWidth(1);
  doc.line(40, y+8, pw-40, y+8);
  y += 24;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(26,45,66);
  doc.text(title, cx, y, {align:'center'});
  y += 12;
  if (subtitle) {
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(110,110,110);
    doc.text(subtitle, cx, y, {align:'center'});
    y += 10;
  }
  return y + 8;
}
function _pdfFooter(doc) {
  const pageCount = doc.internal.getNumberOfPages();
  const pw = doc.internal.pageSize.getWidth();
  const ph = doc.internal.pageSize.getHeight();
  const c = DB.config||{};
  for (let i=1;i<=pageCount;i++) {
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(150,150,150);
    doc.text(`${c.name||'Iglesia'} — Generado ${fmtDate(today())} · No es un recibo fiscal`, 40, ph-18);
    doc.text(`Página ${i} de ${pageCount}`, pw-40, ph-18, {align:'right'});
  }
}
// sections: [{ heading, columns:[...], rows:[[...]], totalsRow:[...]?, columnStyles:{}? }]
function exportPDFReport(filename, title, subtitle, sections) {
  if (typeof window.jspdf === 'undefined') { showToast('Librería PDF no cargada','err'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'letter' });
  let y = _pdfHeader(doc, title, subtitle);
  (sections||[]).forEach(sec => {
    if (!sec.rows || !sec.rows.length) return;
    if (sec.heading) {
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(26,45,66);
      doc.text(sec.heading, 40, y);
      y += 10;
    }
    doc.autoTable({
      startY: y,
      head: [sec.columns],
      body: sec.rows,
      foot: sec.totalsRow ? [sec.totalsRow] : undefined,
      theme: 'grid',
      margin: { left:40, right:40, bottom:36 },
      styles: { font:'helvetica', fontSize:8.5, textColor:[20,20,20], cellPadding:4, lineColor:[210,210,210] },
      headStyles: { fillColor:[26,45,66], textColor:[255,255,255], fontStyle:'bold', fontSize:8 },
      footStyles: { fillColor:[245,238,220], textColor:[20,20,20], fontStyle:'bold' },
      columnStyles: sec.columnStyles || {},
    });
    y = doc.lastAutoTable.finalY + 22;
  });
  _pdfFooter(doc);
  doc.save(filename);
  showToast('✔ PDF exportado');
}

function importJSON(file, cb) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (confirm('¿Importar datos? Los datos actuales serán reemplazados.')) {
        DB = imported;
        if (!Array.isArray(DB.pending))  DB.pending  = [];
        if (!Array.isArray(DB.backups))  DB.backups  = [];
        if (!DB._nextId) DB._nextId = 100;
        saveDB(); showToast('✔ Datos importados');
        if (cb) cb();
      }
    } catch(err) { showToast('Error al importar: archivo inválido','err'); }
  };
  reader.readAsText(file);
}

function _normHeader(s) {
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
}
function _guessFieldForHeader(header, fields) {
  const h = _normHeader(header);
  let hit = fields.find(f => _normHeader(f.key) === h || _normHeader(f.label) === h);
  if (hit) return hit.key;
  for (const f of fields) {
    const aliases = IMPORT_ALIASES[f.key] || [];
    if (aliases.some(a => _normHeader(a) === h)) return f.key;
  }
  return '';
}
function _guessDsForSheetName(name) {
  const n = _normHeader(name);
  const table = {
    diezmos:['diezmos','diezmo','tithes','tithe'], ofrendas:['ofrendas','ofrenda','offerings'],
    donaciones:['donaciones','donacion','donations'], gastos:['gastos','gasto','expenses','expense'],
    ventas:['ventas','venta','sales'], eventos:['eventos','evento','events'],
    otrosIngresos:['otros ingresos','otrosingresos','other income'],
    miembros:['miembros','miembro','members'], proveedores:['proveedores','proveedor','vendors','suppliers'],
    presupuesto:['presupuesto','budget'],
  };
  for (const ds in table) if (table[ds].some(a => _normHeader(a) === n)) return ds;
  return '';
}
// Best-effort date normalizer → 'YYYY-MM-DD'. Handles ISO strings, Excel
// serial numbers (SheetJS's own date-code parser), and common dd/mm/yyyy or
// mm/dd/yyyy text. Returns '' when nothing usable is found (flagged invalid).
function _impNormalizeDate(v) {
  v = (v||'').toString().trim();
  if (!v) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10);
  if (/^\d+(\.\d+)?$/.test(v) && Number(v) > 20000 && Number(v) < 60000 && typeof XLSX !== 'undefined' && XLSX.SSF) {
    const d = XLSX.SSF.parse_date_code(Number(v));
    if (d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  let m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) {
    let mo = parseInt(m[1],10), da = parseInt(m[2],10);
    if (mo > 12) { const t = mo; mo = da; da = t; }
    if (mo>=1 && mo<=12 && da>=1 && da<=31) return `${m[3]}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`;
  }
  const d = new Date(v);
  if (!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  return '';
}

function _impFileSelected(file) {
  if (!file) return;
  const status = el('imp-status');
  if (status) status.textContent = 'Leyendo archivo…';
  const name = file.name.toLowerCase();
  if (name.endsWith('.json')) {
    const reader = new FileReader();
    reader.onload = e => {
      try { _impLoadSheetsFromJSON(JSON.parse(e.target.result)); }
      catch(err) { if (el('imp-status')) el('imp-status').textContent = '⚠ El archivo JSON no es válido: ' + err.message; }
    };
    reader.readAsText(file);
  } else {
    if (typeof XLSX === 'undefined') { if (status) status.textContent = '⚠ La librería de Excel no está disponible.'; return; }
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, {type:'array'});
        const sheets = {};
        wb.SheetNames.forEach(sn => {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {raw:false, defval:''});
          if (rows.length) sheets[sn] = rows;
        });
        if (!Object.keys(sheets).length) { if (el('imp-status')) el('imp-status').textContent = '⚠ No se encontraron filas de datos en el archivo.'; return; }
        _impLoadSheets(sheets);
      } catch(err) { if (el('imp-status')) el('imp-status').textContent = '⚠ No se pudo leer el archivo Excel: ' + err.message; }
    };
    reader.readAsArrayBuffer(file);
  }
}

function _impLoadSheetsFromJSON(parsed) {
  const sheets = {};
  if (Array.isArray(parsed)) {
    if (parsed.length) sheets['Datos'] = parsed;
  } else if (parsed && typeof parsed === 'object') {
    Object.keys(parsed).forEach(k => { if (Array.isArray(parsed[k]) && parsed[k].length) sheets[k] = parsed[k]; });
  }
  if (!Object.keys(sheets).length) { if (el('imp-status')) el('imp-status').textContent = '⚠ El JSON no contiene ninguna lista de registros importable.'; return; }
  _impLoadSheets(sheets);
}

function _impLoadSheets(sheets) {
  _imp.queue = Object.keys(sheets).map(name => {
    const ds = _guessDsForSheetName(name);
    return { name, rows: sheets[name], ds: IMPORT_SCHEMAS[ds] ? ds : '' };
  });
  _imp.step = 'sheets';
  renderImportar();
}

function _impBeginMapping() {

// Builds the "processed" projection (one entry per source row: the mapped
// record, any validation errors, and duplicate/new status) WITHOUT touching
// DB. This is what the review screen and the final atomic commit both read.
function _impValidateAndReview() {
  const c = _imp.current;
  const schema = IMPORT_SCHEMAS[c.ds];
  const missingRequired = schema.fields.filter(f => f.required && !Object.values(c.mapping).includes(f.key));
  if (missingRequired.length) { showToast('⚠ Falta mapear: ' + missingRequired.map(f=>f.label).join(', '), 'err'); return; }

  const existing = DB[c.ds] || [];
  c.processed = c.rows.map((raw, idx) => {
    const rec = {};
    Object.keys(c.mapping).forEach(h => {
      const f = c.mapping[h];
      if (f) rec[f] = (raw[h] !== undefined && raw[h] !== null) ? String(raw[h]).trim() : '';
    });
    const errors = [];
    schema.fields.forEach(f => {
      if (f.required && !rec[f.key]) errors.push(`Falta "${f.label}"`);
      else if (f.type === 'number' && rec[f.key] && isNaN(parseFloat(rec[f.key]))) errors.push(`"${f.label}" no es un número válido`);
      else if (f.type === 'number' && rec[f.key] !== '') rec[f.key] = parseMoney(rec[f.key]);
      else if (f.type === 'date' && rec[f.key]) {
        const norm = _impNormalizeDate(rec[f.key]);
        if (!norm) errors.push(`"${f.label}" no es una fecha válida`); else rec[f.key] = norm;
      }
    });
    let status = errors.length ? 'invalid' : 'new', matchId = null;
    if (!errors.length) {
      const key = schema.dedupe(rec);
      const match = existing.find(e => schema.dedupe(e) === key);
      if (match) { status = 'duplicate'; matchId = match.id; }
    }
    return { idx, rec, errors, status, matchId };
  });
  _imp.step = 'review';
  renderImportar();
}

function _impRowSummary(schema, rec) {
  return schema.fields.filter(f=>rec[f.key]).slice(0,4).map(f=>`${f.label}: ${rec[f.key]}`).join(' · ') || '—';
}

function _renderImpReview() {
  const c = _imp.current;
  const schema = IMPORT_SCHEMAS[c.ds];
  const rows = c.processed;
  const nNew = rows.filter(r=>r.status==='new').length;
  const nDup = rows.filter(r=>r.status==='duplicate').length;
  const nInv = rows.filter(r=>r.status==='invalid').length;
  const isLast = _imp.qIndex + 1 >= _imp.queue.length;
  _setModHTML(`
    <div class="sg">
      <div class="sc green"><div class="si">✅</div><div class="sl">Nuevos</div><div class="sv">${nNew}</div></div>
      <div class="sc purple"><div class="si">♻️</div><div class="sl">Duplicados</div><div class="sv">${nDup}</div></div>
      <div class="sc red"><div class="si">⚠</div><div class="sl">Inválidos</div><div class="sv">${nInv}</div></div>
    </div>
    ${nDup ? `
    <div class="card" style="margin-bottom:20px">
      <div class="ch"><div class="ct">¿Qué hacer con los ${nDup} duplicados?</div></div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px">
        <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="imp-mode" ${c.resolutionMode==='skip'?'checked':''} onchange="_imp.current.resolutionMode='skip'"> Omitir (no tocar los existentes)</label>
        <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="imp-mode" ${c.resolutionMode==='replace'?'checked':''} onchange="_imp.current.resolutionMode='replace'"> Reemplazar (sobrescribir con los datos del archivo)</label>
        <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="imp-mode" ${c.resolutionMode==='merge'?'checked':''} onchange="_imp.current.resolutionMode='merge'"> Fusionar (solo llenar campos vacíos)</label>
      </div>
    </div>` : ''}
    <div class="card">
      <div class="ch"><div class="ct">Detalle — ${esc(c.name)} → ${schema.label}</div><span class="badge bg">${rows.length} filas</span></div>
      <div class="tw" style="max-height:360px;overflow:auto"><table>
        <thead><tr><th>#</th><th>Estado</th><th>Resumen</th><th>Motivo</th></tr></thead>
        <tbody>${rows.map(r => `
          <tr>
            <td style="color:var(--muted);font-size:10px">${String(r.idx+1).padStart(3,'0')}</td>
            <td><span class="badge ${r.status==='new'?'bs':r.status==='duplicate'?'bm':'bd'}">${r.status==='new'?'Nuevo':r.status==='duplicate'?'Duplicado':'Inválido'}</span></td>
            <td style="font-size:12px">${esc(_impRowSummary(schema, r.rec))}</td>
            <td style="font-size:11px;color:var(--danger)">${esc(r.errors.join('; '))||'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-outline btn-sm" onclick="_impCancel()">✕ Cancelar Todo</button>
      <button class="btn btn-outline btn-sm" onclick="_impBeginMapping()">← Volver a Mapeo</button>
      <button class="btn btn-primary" onclick="_impFinalizeCurrent()">${isLast ? 'Continuar a Confirmación Final →' : 'Guardar y Revisar Siguiente Hoja →'}</button>
    </div>`);
}

function _impFinalizeCurrent() {
  _imp.finalized.push(_imp.current);
  _imp.qIndex++;
  if (_imp.qIndex < _imp.queue.length) _impBeginMapping();
  else { _imp.step = 'confirm'; renderImportar(); }
}

function _renderImpConfirm() {
  const rowsHTML = _imp.finalized.map(sheet => {
    const schema = IMPORT_SCHEMAS[sheet.ds];
    const nNew = sheet.processed.filter(r=>r.status==='new').length;
    const nDup = sheet.processed.filter(r=>r.status==='duplicate').length;
    const nInv = sheet.processed.filter(r=>r.status==='invalid').length;
    const modeLabel = {skip:'omitir', replace:'reemplazar', merge:'fusionar'}[sheet.resolutionMode];
    return `<tr><td>${esc(sheet.name)}</td><td>${schema.label}</td><td>${nNew}</td><td>${nDup} (${modeLabel})</td><td>${nInv}</td></tr>`;
  }).join('');
  _setModHTML(`
    <div class="card">
      <div class="ch"><div class="ct">Confirmación Final</div></div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px">Nada se ha guardado todavía. Revisa el resumen y confirma para escribir los cambios de una sola vez — si algo falla, no se guarda nada.</p>
      <div class="tw"><table>
        <thead><tr><th>Hoja</th><th>Módulo</th><th>Nuevos</th><th>Duplicados</th><th>Inválidos (se omiten)</th></tr></thead>
        <tbody>${rowsHTML}</tbody>
      </table></div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="_impCancel()">✕ Cancelar Todo</button>
        <button class="btn btn-primary" onclick="_impCommitAll()">✅ Confirmar e Importar Todo</button>
      </div>
    </div>`);
}

// Refresh a group-A record's linked Transacciones row after a replace/merge
// (mirrors saveSourceRecord's edit branch, but against the sandbox copy).
function _impRelinkTrans(working, ds, rec) {
  if (!rec._transId) return;
  const ti = working.transacciones.findIndex(t => t.id === rec._transId);
  if (ti >= 0) working.transacciones[ti] = { ...working.transacciones[ti], ...buildLinkedTrans(ds, rec) };
}

// The only step that writes anything. Builds every finalized sheet's changes
// into a deep-copied sandbox first; only if the ENTIRE batch (all sheets)
// completes without throwing do we swap it in for the real DB and persist —
// so a failure partway through never leaves a half-applied import behind.
function _impCommitAll() {
  const previousDB = DB; // exact rollback target — restored in the catch below if anything fails
  try {
    const working = deepCopy(DB);
    let localNextId = working._nextId || 100;
    const allocId = () => (++localNextId);
    const summary = [];
    _imp.finalized.forEach(sheet => {
      const schema = IMPORT_SCHEMAS[sheet.ds];
      let imported = 0, skipped = 0;
      const duplicated = sheet.processed.filter(r=>r.status==='duplicate').length;
      const errors = sheet.processed.filter(r=>r.status==='invalid').length;
      sheet.processed.forEach(r => {
        if (r.status === 'invalid') return;
        if (r.status === 'duplicate') {
          if (sheet.resolutionMode === 'skip') { skipped++; return; }
          const idx = (working[sheet.ds]||[]).findIndex(e => e.id === r.matchId);
          if (idx < 0) { skipped++; return; }
          if (sheet.resolutionMode === 'replace') {
            working[sheet.ds][idx] = { ...working[sheet.ds][idx], ...r.rec };
          } else {
            const merged = { ...working[sheet.ds][idx] };
            Object.keys(r.rec).forEach(k => { if (merged[k]===undefined || merged[k]==='' || merged[k]===null) merged[k] = r.rec[k]; });
            working[sheet.ds][idx] = merged;
          }
          if (schema.group === 'A') _impRelinkTrans(working, sheet.ds, working[sheet.ds][idx]);
          imported++;
        } else {
          const rec = { ...r.rec, id: allocId() };
          if (schema.group === 'A') {
            const trans = buildLinkedTrans(sheet.ds, rec);
            trans.id = allocId();
            rec._transId = trans.id;
            working[sheet.ds].unshift(rec);
            working.transacciones.unshift(trans);
          } else {
            working[sheet.ds].unshift(rec);
          }
          imported++;
        }
      });
      summary.push({ name: sheet.name, dsLabel: schema.label, total: sheet.processed.length, imported, skipped, duplicated, errors });
    });
    working._nextId = localNextId;
    DB = working; // swap in-memory — still reversible below until persisted
    if (!saveDB()) {
      DB = previousDB; // localStorage write failed: keep memory and disk in sync, not silently ahead of what's saved
      throw new Error('No se pudo guardar en el almacenamiento local.');
    }
    _imp.summary = summary;
    _imp.step = 'done';
    renderImportar();
  } catch (err) {
    // Whether the failure happened while building `working` (DB was never
    // touched) or right after the swap (handled above), DB always ends up
    // back at previousDB here — so a failed commit never leaves the running
    // app pointed at data that isn't actually on disk.
    DB = previousDB;
    showToast('⚠ Error al importar — no se guardó nada: ' + err.message, 'err');
  }
}

function _renderImpDone() {
  const s = _imp.summary || [];
  const totals = s.reduce((a,r)=>({imported:a.imported+r.imported, skipped:a.skipped+r.skipped, duplicated:a.duplicated+r.duplicated, errors:a.errors+r.errors}), {imported:0,skipped:0,duplicated:0,errors:0});
  _setModHTML(`
    <div class="sg">
      <div class="sc green"><div class="si">✅</div><div class="sl">Importados</div><div class="sv">${totals.imported}</div></div>
      <div class="sc purple"><div class="si">⏭</div><div class="sl">Omitidos</div><div class="sv">${totals.skipped}</div></div>
      <div class="sc gold"><div class="si">♻️</div><div class="sl">Duplicados detectados</div><div class="sv">${totals.duplicated}</div></div>
      <div class="sc red"><div class="si">⚠</div><div class="sl">Errores</div><div class="sv">${totals.errors}</div></div>
    </div>
    <div class="card">
      <div class="ch"><div class="ct">Resumen por Hoja</div></div>
      <div class="tw"><table>
        <thead><tr><th>Hoja</th><th>Módulo</th><th>Total Filas</th><th>Importados</th><th>Omitidos</th><th>Duplicados</th><th>Errores</th></tr></thead>
        <tbody>${s.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.dsLabel)}</td><td>${r.total}</td><td class="ap">${r.imported}</td><td>${r.skipped}</td><td>${r.duplicated}</td><td class="an">${r.errors}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-outline btn-sm" onclick="_impDownloadErrorReport()">⬇ Descargar Reporte de Errores (CSV)</button>
      <button class="btn btn-primary" onclick="_impCancel()">✔ Terminar</button>
    </div>`);
}

function _impDownloadErrorReport() {
  const rows = [['Hoja','Módulo','Fila #','Motivo del Error']];
  (_imp.finalized||[]).forEach(sheet => {
    const schema = IMPORT_SCHEMAS[sheet.ds];
    sheet.processed.filter(r=>r.status==='invalid').forEach(r => rows.push([sheet.name, schema.label, r.idx+1, r.errors.join('; ')]));
  });
  if (rows.length === 1) { showToast('No hay errores que reportar.', 'err'); return; }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `importacion-errores-${today()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── UTILITIES ──────────────────────────────────────────────
function today() { return new Date().toISOString().split('T')[0]; }

// Display-only date formatter: converts stored ISO (YYYY-MM-DD) to MM-DD-YYYY.
// Internal storage, sorting, and filtering ALWAYS stay in ISO — only rendering changes.
// Accepts 'YYYY-MM-DD' or a full ISO timestamp; returns '—' for empty/invalid input.
function fmtDate(iso) {
  if (!iso) return '—';
  const datePart = String(iso).slice(0, 10);
  const m = datePart.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return datePart; // not ISO — show as-is rather than guess
  return `${m[2]}-${m[3]}-${m[1]}`;
}

// Display-only datetime formatter (date + time), used for backup/audit timestamps.
function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  const dd = fmtDate(d.toISOString().split('T')[0]);
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${dd} ${hh}:${mi}`;
}

// ── MONEY MATH (cents-safe) ─────────────────────────────────
// Plain float addition drifts (0.1 + 0.2 !== 0.3) and that drift compounds
// across hundreds of tithe/offering/expense rows into real off-by-a-cent
// (or more) balances. Money is still stored as a decimal-dollar number on
// each record (parseMoney rounds it to the nearest cent the instant it's
// read from a form, an import row, or an edit — so nothing ever gets saved
// with garbage floating-point precision beyond 2 decimals), but every
// SUMMATION across records goes through sumMonto, which converts each value
// to an integer number of cents, adds those integers (integer addition
// can't drift), and only converts back to dollars once at the end. round2
// is the same cents-rounding used standalone (e.g. for a single computed
// value that isn't a reduce/sum).
function round2(n) {
  n = Number(n);
  if (!isFinite(n)) return 0;
  return Math.round((n + (n >= 0 ? 1 : -1) * 1e-9) * 100) / 100;
}
function parseMoney(v) {
  if (v === '' || v === null || v === undefined) return 0;
  const n = typeof v === 'number' ? v : parseFloat(v);
  return isFinite(n) ? round2(n) : 0;
}
// arr: array. keyOrFn: a string field name to read off each item, a
// function(item, index) returning a number, or omitted to sum the items
// themselves (when arr already holds plain numbers).
function sumMonto(arr, keyOrFn) {
  if (!arr || !arr.length) return 0;
  const get = keyOrFn == null ? (v => Number(v) || 0)
    : typeof keyOrFn === 'function' ? keyOrFn
    : (r => Number(r && r[keyOrFn]) || 0);
  let cents = 0;
  for (let i = 0; i < arr.length; i++) cents += Math.round(get(arr[i], i) * 100);
  return cents / 100;
}

function fmt(n) {
  return round2(n).toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Default list order everywhere: most recent date first, older rows lower
// down — regardless of when a row was actually entered/edited. A backdated
// entry typed in today lands under its own date, not at the top of the list
// (id is just a tiebreaker for same-day rows, newest-entered first).
function _byDateDesc(a, b) { return (b.fecha||'').localeCompare(a.fecha||'') || ((b.id||0)-(a.id||0)); }

function inDateRange(fecha, f1, f2) {
  if (!f1 && !f2) return true;
  if (f1 && fecha < f1) return false;
  if (f2 && fecha > f2) return false;
  return true;
}

// Quick report ranges: sets the two date filter inputs and re-renders
function quickRange(period, id1, id2, renderFn) {
  const now = new Date();
  let from, to;
  const iso = d => d.toISOString().split('T')[0];
  if (period === 'hoy') {
    from = to = iso(now);
  } else if (period === 'semana') {
    const day = now.getDay(); // 0=Dom..6=Sáb
    const monday = new Date(now); monday.setDate(now.getDate() - ((day+6)%7));
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    from = iso(monday); to = iso(sunday);
  } else if (period === 'mes') {
    from = iso(new Date(now.getFullYear(), now.getMonth(), 1));
    to   = iso(new Date(now.getFullYear(), now.getMonth()+1, 0));
  } else if (period === 'anio') {
    from = `${now.getFullYear()}-01-01`; to = `${now.getFullYear()}-12-31`;
  } else { from = ''; to = ''; }
  const e1 = el(id1), e2 = el(id2);
  if (e1) e1.value = from; if (e2) e2.value = to;
  renderFn();
}

// ── YEAR LOOKUP (any year, not just "this year") ────────────
// quickRange('anio',...) below is a fixed "current year" shortcut; this is
// the general fix — a dropdown of every year actually present in the
// dataset (plus the current year), so looking up e.g. 2024 data works the
// same way looking up a specific month/day already did.
function _yearsIn(arr) {
  const ys = new Set((arr||[]).map(r => (r.fecha||'').slice(0,4)).filter(v => v.length === 4));
  ys.add(String(new Date().getFullYear()));
  return [...ys].sort((a,b) => b.localeCompare(a));
}
function yearLookupHTML(prefix, arr, fnName) {
  const years = _yearsIn(arr);
  const sel = el(prefix+'-year')?.value || years[0];
  return `<select id="${prefix}-year" style="background:var(--navy);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:12px;outline:none">
    ${years.map(y=>`<option value="${y}" ${y===sel?'selected':''}>${y}</option>`).join('')}
  </select>
  <button class="btn btn-outline btn-sm" onclick="applyYearLookup('${prefix}','${fnName}')">🗓️ Ver Año</button>`;
}
function applyYearLookup(prefix, fnName) {
  const y = el(prefix+'-year').value;
  const f1 = el(prefix+'-f1'), f2 = el(prefix+'-f2');
  if (f1) f1.value = `${y}-01-01`;
  if (f2) f2.value = `${y}-12-31`;
  window[fnName]();
}

function cuentaNombre(codigo) {
  if (!codigo) return null;
  const c = (DB.cuentas||[]).find(c => c.codigo === codigo);
  return c ? c.nombre : codigo;
}

const _AC = ['#C9A84C','#3DAA6E','#3A8CB5','#D94F4F','#8B5CF6','#EC4899','#F59E0B','#06B6D4'];
function ach(n) { let s = 0; for (const c of (n||'?')) s += c.charCodeAt(0); return _AC[s % _AC.length]; }
function ini(n) { return (n||'?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2); }

function sb(s) {
  const m = {
    'Completado':'bs','Pagado':'bs','Confirmado':'bs','Activo':'bs','Registrado':'bs','Sí':'bs',
    'Pendiente':'bw','En Proceso':'bw',
    'Cancelado':'bd','Inactivo':'bd','No':'bd','Rechazado':'bd',
    'Pastor':'bg','Diácono':'bg','Líder':'bi',
    'Visitante':'bm','Miembro':'bm','Voluntario':'bm','Transferido':'bm',
    'Alerta':'bw','Crítico':'bd','Normal':'bi',
  };
  return `<span class="badge ${m[s]||'bm'}">${s||'—'}</span>`;
}

// Toast notification
let _toastTimer = null;
function showToast(msg, type = 'success') {
  let el = document.getElementById('_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '_toast';
    el.style.cssText = [
      'position:fixed','bottom:24px','right:24px','z-index:99999',
      'padding:12px 20px','border-radius:10px','font-size:13px',
      'font-weight:600','font-family:sans-serif',
      'box-shadow:0 6px 20px rgba(0,0,0,.5)',
      'transition:opacity .3s','pointer-events:none','opacity:0',
    ].join(';');
    document.body.appendChild(el);
  }
  const styles = {
    success: 'background:#1a3d2b;border:1px solid #3daa6e;color:#5dd49a',
    warn:    'background:#3d2e0a;border:1px solid #e8a030;color:#f0b44f',
    err:     'background:#3d1a1a;border:1px solid #d94f4f;color:#f07070',
  };
  el.style.cssText = el.style.cssText.replace(/;?(background|border|color):[^;]+/g, '');
  el.setAttribute('style', el.style.cssText + ';' + (styles[type] || styles.success));
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 3500);
}

</script>
<script>
// ============================================================
// iglesia-forms.js  —  Modal engine + form templates + table helpers
// Requires iglesia-data.js
// ============================================================

// ── FORM TEMPLATES ─────────────────────────────────────────
// Builds <option> list from a configurable {id,nombre,activo} list (Servicio / Método de Pago).
// Always includes the record's current value even if it has since been deactivated or renamed,
// so opening an old record for editing never silently changes or hides its stored value.
function _configListOpts(list, selected) {
  const active = (list||[]).filter(x => x.activo).map(x => x.nombre);
  const names = (selected && !active.includes(selected)) ? [...active, selected] : active;
  return names.map(n => `<option${n===selected?' selected':''}>${esc(n)}</option>`).join('');
}
function _metodosOpts(selected) {
  return _configListOpts(DB.settings?.metodosPago, selected);
}
function _serviciosOpts(selected) {
  return _configListOpts(DB.settings?.servicios, selected);
}
function _rolesMiembroOpts(selected) {
  return _configListOpts(DB.settings?.rolesMiembro, selected);
}
function _syncMinisterio() {
  const checked = [...document.querySelectorAll('#modal-body .min-chk:checked')].map(c=>c.value);
  const hidden = document.getElementById('min-hidden');
  if (hidden) hidden.value = checked.join(',');
}
function _estadosMiembroOpts(selected) {
  return _configListOpts(DB.settings?.estadosMiembro, selected);
}
function _fondosOpts(selected) {
  const active = (DB.fondos||[]).filter(f => f.activo).map(f => f.nombre);
  const names = (selected && !active.includes(selected)) ? [...active, selected] : active;
  return names.map(n => `<option${n===selected?' selected':''}>${esc(n)}</option>`).join('');
}
function _miembrosDL() {
  return (DB.miembros||[]).map(m=>`<option>${m.nombre}</option>`).join('');
}
// Miembro <select> for Diezmos — name is chosen from the official Miembros
// registry (never typed free-hand), and each option carries its member's
// current No. de Sobre so it can be auto-filled on selection.
function _miembrosOpts(selected) {
  const list = (DB.miembros||[]).slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  let opts = `<option value="">— Seleccionar miembro —</option>`;
  opts += list.map(m=>`<option value="${esc(m.nombre)}" data-sobre="${esc(m.sobre||'')}"${selected===m.nombre?' selected':''}>${esc(m.nombre)}${m.sobre?` (Sobre ${esc(m.sobre)})`:''}</option>`).join('');
  // Preserve legacy/free-text names from records saved before this change so
  // existing history doesn't silently disappear from the dropdown.
  if (selected && !list.some(m=>m.nombre===selected)) {
    opts += `<option value="${esc(selected)}" selected>${esc(selected)} (no está en Miembros)</option>`;
  }
  return opts;
}
function _provDL() {
  return (DB.proveedores||[]).map(p=>`<option>${p.nombre}</option>`).join('');
}
// Ingreso accounts from the live Catálogo de Cuentas — lets the user route a
// diezmo/ofrenda/donación to ANY fund account they've set up, not just the default.
function _cuentasIngresoOpts(selectedCodigo) {
  ensureCuentas();
  const opts = DB.cuentas.filter(c => c.tipo === 'Ingreso');
  return opts.map(c => `<option value="${c.codigo}"${c.codigo===selectedCodigo?' selected':''}>${c.codigo} — ${esc(c.nombre)}</option>`).join('');
}
// Every configured Gasto account, live from DB.cuentas — replaces the old
// hardcoded 6-item category list so newly-added expense accounts (and
// ones a fixed category list simply never included, like Otros Gastos)
// are always selectable here.
function _cuentasGastoOpts(selectedNombre) {
  ensureCuentas();
  const opts = DB.cuentas.filter(c => c.tipo === 'Gasto').sort((a,b)=>a.codigo.localeCompare(b.codigo));
  return opts.map(c => `<option value="${esc(c.nombre)}" data-codigo="${c.codigo}"${c.nombre===selectedNombre?' selected':''}>${c.codigo} — ${esc(c.nombre)}</option>`).join('');
}
// Generic Ingreso-or-Gasto account list by display name — used by the manual
// Transacciones form, which needs to swap its Categoría options when the
// user flips Tipo between Ingreso/Egreso.
function _cuentasPorTipoOpts(tipoCuenta, selectedNombre) {
  ensureCuentas();
  const opts = DB.cuentas.filter(c => c.tipo === tipoCuenta).sort((a,b)=>a.codigo.localeCompare(b.codigo));
  return opts.map(c => `<option value="${esc(c.nombre)}" data-codigo="${c.codigo}"${c.nombre===selectedNombre?' selected':''}>${c.codigo} — ${esc(c.nombre)}</option>`).join('');
}
// Active bank/fund accounts (Activo) — where the money physically lands.
function _bancosOpts(selectedCodigo) {
  ensureCuentas();
  const activos = DB.cuentas.filter(c => c.tipo === 'Activo');
  return activos.map(c => `<option value="${c.codigo}"${c.codigo===selectedCodigo?' selected':''}>${esc(c.nombre)}</option>`).join('');
}

      <div class="fgrp"><label>Fondo / Propósito</label><select name="fondo">${_fondosOpts(rec.fondo||'Fondo General')}</select></div>
      <div class="fgrp"><label>Estado</label><select name="estado"><option${rec.estado==='Activo'||!rec.estado?' selected':''}>Activo</option><option${rec.estado==='Inactivo'?' selected':''}>Inactivo</option></select></div>
    </div>`;

    case 'recurrentes': { const esIngreso = rec.tipoMov === 'Ingreso'; return `<div class="fg">
      <div class="fgrp full"><div class="form-kicker">🔁 Movimiento Recurrente</div></div>
      <div class="fgrp full"><label>Descripción</label><input type="text" name="desc" value="${esc(rec.desc)}" placeholder="Ej. Renta del salón"></div>

        <option value="Ingreso"${esIngreso?' selected':''}>Ingreso</option>
      </select></div>
      <div class="fgrp"><label>Monto Mensual ($)</label><input type="number" name="monto" value="${rec.monto||''}" placeholder="0.00" min="0" step="0.01"></div>
      <div class="fgrp"><label>Día del Mes</label><input type="number" name="diaMes" value="${rec.diaMes||1}" min="1" max="28" title="Día 1-28 en que se registrará cada mes"></div>
      <div class="fgrp" id="_rec-cat-wrap"><label id="_rec-cat-label">${esIngreso?'Categoría':'Cuenta Contable'}</label>
        <select name="cat" id="_rec-cat" onchange="_syncRecurrenteCuenta(this)">${esIngreso ? _otrosIngresosCatOpts(rec.cat) : _cuentasGastoOpts(rec.cat)}</select>
      </div>
      <input type="hidden" name="cuentaCodigo" id="_rec-cuenta" value="${esc(rec.cuentaCodigo || (esIngreso?'4005':(DB.cuentas||[]).find(c=>c.nombre===rec.cat)?.codigo) || '')}">
      <div class="fgrp" id="_rec-prov-wrap" style="${esIngreso?'display:none':''}"><label>Proveedor</label><input type="text" name="proveedor" value="${esc(rec.proveedor)}" placeholder="Nombre del proveedor" list="prov-dl"><datalist id="prov-dl">${_provDL()}</datalist></div>
      <div class="fgrp"><label>Método de Pago</label><select name="metodo">${mo}</select></div>
      <div class="fgrp"><label>Fondo</label><select name="fondo">${_fondosOpts(rec.fondo||'Fondo General')}</select></div>
      <div class="fgrp"><label>Estado</label><select name="activo"><option value="true"${rec.activo!==false?' selected':''}>Activo</option><option value="false"${rec.activo===false?' selected':''}>Pausado</option></select></div>
      <div class="fgrp full" style="font-size:11px;color:var(--muted)">Se registrará automáticamente un ${esIngreso?'Ingreso':'Gasto'} el día indicado de cada mes mientras esté Activo. ${rec.ultimoMes?`Último mes generado: <b>${esc(rec.ultimoMes)}</b> (${rec._generados||0} en total).`:'Empezará a generarse a partir del próximo mes.'}</div>
    </div>`; }

    case 'campanas': return `<div class="fg">
      <div class="fgrp full"><div class="form-kicker">🎯 Campaña de Promesas</div></div>
      <div class="fgrp full"><label>Nombre de la Campaña</label><input type="text" name="nombre" value="${esc(rec.nombre)}" placeholder="Ej. Fondo de Construcción 2026"></div>
      <div class="fgrp"><label>Meta ($)</label><input type="number" name="meta" value="${rec.meta||''}" placeholder="0.00" min="0" step="0.01"></div>
      <div class="fgrp"><label>Fondo Ministerial</label><select name="fondo">${_fondosOpts(rec.fondo||'Fondo General')}</select></div>
      <div class="fgrp"><label>Fecha de Inicio</label><input type="date" name="fechaInicio" value="${rec.fechaInicio||_today()}"></div>
      <div class="fgrp"><label>Fecha de Fin</label><input type="date" name="fechaFin" value="${rec.fechaFin||''}"></div>
      <div class="fgrp"><label>Estado</label><select name="activo"><option value="true"${rec.activo!==false?' selected':''}>Activa</option><option value="false"${rec.activo===false?' selected':''}>Cerrada</option></select></div>
      <div class="fgrp full"><label>Descripción / Notas</label><textarea name="notas" placeholder="Detalles de la campaña...">${esc(rec.notas)}</textarea></div>
      <div class="fgrp full" style="font-size:11px;color:var(--muted)">El progreso "Dado" se calcula automáticamente sumando los diezmos y donaciones de cada miembro registrados en este fondo, entre las fechas de la campaña — no requiere doble captura.</div>
    </div>`;

    case 'promesas': return `<div class="fg">
      <div class="fgrp full"><div class="form-kicker">🤝 Promesa de Ofrenda</div></div>
      <div class="fgrp full"><label>Campaña</label><select name="campanaId">${(DB.campanas||[]).map(c=>`<option value="${c.id}"${(rec.campanaId==c.id)?' selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div>
      <div class="fgrp full"><label>Miembro</label><select name="miembro">${_miembrosOpts(rec.miembro)}</select></div>
      <div class="fgrp"><label>Monto Prometido ($)</label><input type="number" name="monto" value="${rec.monto||''}" placeholder="0.00" min="0" step="0.01"></div>
      <div class="fgrp"><label>Fecha del Compromiso</label><input type="date" name="fecha" value="${rec.fecha||_today()}"></div>
      <div class="fgrp full"><label>Notas</label><textarea name="notas" placeholder="Ej. $50/mes por 12 meses...">${esc(rec.notas)}</textarea></div>
    </div>`;

    case 'pagosPromesa': return `<div class="fg">
      <div class="fgrp full"><div class="form-kicker">💳 Pago de Promesa</div></div>
      <div class="fgrp full"><label>Promesa</label><select name="promesaId" ${rec._locked?'disabled':''}>${(DB.promesas||[]).map(p=>{
          const camp = (DB.campanas||[]).find(c=>c.id==p.campanaId);
          return `<option value="${p.id}"${(rec.promesaId==p.id)?' selected':''}>${esc(p.miembro)} — ${esc(camp?.nombre||'')}</option>`;
        }).join('')}</select>
      </div>
      <div class="fgrp"><label>Monto Pagado ($)</label><input type="number" name="monto" value="${rec.monto||''}" placeholder="0.00" min="0" step="0.01"></div>
      <div class="fgrp"><label>Fecha</label><input type="date" name="fecha" value="${rec.fecha||_today()}"></div>
      <div class="fgrp"><label>Método de Pago</label><select name="metodo">${mo}</select></div>
      <div class="fgrp"><label>Ref / Recibo</label><input type="text" name="ref" value="${esc(rec.ref)}" placeholder="R-2025-000"></div>

      <div class="fgrp full" style="font-size:11px;color:var(--muted)">Este pago se registra por separado de Diezmos y Ofrendas — no requiere ni modifica esos módulos — pero sí se contabiliza como ingreso real (cuenta 4008, fondo de la campaña).</div>

    default: return '<p style="color:var(--muted)">Formulario no disponible.</p>';

function _syncFundAccount(selectEl, ds) {
  const map = ds === 'ofrendas' ? OFRENDA_TIPO_CUENTA : DONACION_PROP_CUENTA;
  const codigo = map[selectEl.value];
  if (!codigo) return;
  const target = document.getElementById(ds === 'ofrendas' ? '_ofr-cuenta' : '_dn-cuenta');
  if (target) target.value = codigo;
}

// Diezmos: pull the selected member's No. de Sobre into the read-only Sobre
// field. Sobre numbers live only in Miembros — this never writes back to it.
function _syncSobreFromMiembro(selectEl) {
  const opt = selectEl.selectedOptions[0];
  const el  = document.getElementById('_dz-sobre');
  if (el) el.value = opt ? (opt.dataset.sobre || '') : '';
}

// Donaciones: mirrors the picked member's name into the actual submitted
// "donante" text field, or clears+reveals it for free typing when "Otro" is
// chosen — keeping ONE canonical name string either way (matching an exact
// Miembro name enables the address auto-lookup and giving-statement linking).
function _syncDonanteSel(selectEl) {
  const input = document.getElementById('_dn-otro');
  if (!input) return;
  if (selectEl.value === '__otro__') {
    input.style.display = '';
    input.value = '';
    input.focus();
  } else if (selectEl.value === '') {
    input.style.display = 'none';
    input.value = '';
  } else {
    input.style.display = 'none';
    input.value = selectEl.value;
  }
}

// Gastos: keep the hidden cuentaDr (debit/expense account code) in sync
// with whichever Cuenta Contable the user picked, so the ledger posts to
// the exact account chosen instead of falling back to a guessed default.
function _syncGastoCuenta(selectEl) {
  const opt = selectEl.selectedOptions[0];
  const el  = document.getElementById('_gs-cuenta');
  if (el) el.value = opt ? (opt.dataset.codigo || '') : '';
}

// Fixed category list mirroring Otros Ingresos' own form — always posts to
// account 4005, matching how a manually-entered Otro Ingreso behaves.
function _otrosIngresosCatOpts(selected) {
  return ['Alquiler','Intereses Bancarios','Reembolsos','Venta de Activos','Regalías','Otro']
    .map(c => `<option value="${c}" data-codigo="4005"${c===selected?' selected':''}>${c}</option>`).join('');
}
// Recurrentes: flips the Categoría list + hides/shows Proveedor depending on
// whether this template posts a Gasto or an Ingreso each month.
function _syncRecurrenteTipo(selectEl) {
  const esIngreso = selectEl.value === 'Ingreso';
  const catSel   = document.getElementById('_rec-cat');
  const label    = document.getElementById('_rec-cat-label');
  const provWrap = document.getElementById('_rec-prov-wrap');
  if (catSel) catSel.innerHTML = esIngreso ? _otrosIngresosCatOpts('') : _cuentasGastoOpts('');
  if (label)  label.textContent = esIngreso ? 'Categoría' : 'Cuenta Contable';
  if (provWrap) provWrap.style.display = esIngreso ? 'none' : '';
  if (catSel) _syncRecurrenteCuenta(catSel);
}
function _syncRecurrenteCuenta(selectEl) {
  const opt = selectEl.selectedOptions[0];
  const el  = document.getElementById('_rec-cuenta');
  if (el) el.value = opt ? (opt.dataset.codigo || '') : '';
}

// Manual Transacciones entry: Categoría's option list depends on which Tipo
// (Ingreso/Egreso) is selected, since each side of the chart of accounts
// applies. Swaps the options, then re-syncs the hidden cuenta fields.
function _syncTransTipo(tipoSelectEl) {
  const catSel = document.getElementById('_tr-cat');
  if (!catSel) return;
  const tipoCuenta = tipoSelectEl.value === 'Egreso' ? 'Gasto' : 'Ingreso';
  catSel.innerHTML = _cuentasPorTipoOpts(tipoCuenta, '');
  _syncTransCuenta();
}
function _syncTransCuenta() {
  const tipoSel = document.getElementById('_tr-tipo');
  const catSel  = document.getElementById('_tr-cat');
  const crEl = document.getElementById('_tr-cCr');
  const drEl = document.getElementById('_tr-cDr');
  if (!tipoSel || !catSel) return;
  const codigo = catSel.selectedOptions[0]?.dataset.codigo || '';
  if (tipoSel.value === 'Egreso') {
    if (drEl) drEl.value = codigo;
    if (crEl) crEl.value = '';
  } else {
    if (crEl) crEl.value = codigo;
    if (drEl) drEl.value = '';
  }
}

function calcNeto() {
  const i = parseMoney(document.querySelector('[name=ingresos]')?.value);
  const g = parseMoney(document.querySelector('[name=gastos]')?.value);
  const el = document.getElementById('_neto'); if (el) el.value = fmt(i - g);
}

function _today() { return new Date().toISOString().split('T')[0]; }

// ── MODAL ENGINE ───────────────────────────────────────────
let _modal_ds   = null;
let _modal_id   = null;
let _modal_onOK = null;

function openModal(ds, id = null, onOK = null) {
  const action = id ? 'editar' : 'agregar';
  const permKey = _dsPermFor(ds, action);
  if (permKey && !requirePerm(permKey, PERM_KEYS.find(p=>p.key===permKey)?.label)) return;
  const rec = id ? (DB[ds]||[]).find(r => r.id === id) || {} : {};
  // V18: editing an existing record dated within a closed period — block
  // here with the friendly "create an adjustment instead" explanation
  // rather than letting them fill out the whole form first. Doesn't apply
  // to brand-new records (id === null): those are caught by date, at save
  // time, if the user manually backdates into the closed period.
  if (id && LOCKABLE_DS.has(ds) && _fechaBloqueada(rec.fecha)) { _showPeriodLockModal(ds, id, rec.fecha); return; }
  _modal_ds   = ds;
  _modal_id   = id;
  _modal_onOK = onOK;

  document.getElementById('modal-title').textContent = id ? 'Editar registro' : 'Agregar';
  document.getElementById('modal-body').innerHTML    = getFormHTML(ds, rec);
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  _modal_ds = _modal_id = _modal_onOK = null;
}

function modalSave() {
  const ds = _modal_ds; if (!ds) return;
  const inputs = document.querySelectorAll('#modal-body input, #modal-body select, #modal-body textarea');
  const data = {};
  inputs.forEach(el => { if (el.name) data[el.name] = el.value; });

  let ok;
  if (['diezmos','ofrendas','donaciones','gastos','ventas','eventos','otrosIngresos','pagosPromesa'].includes(ds)) {
    ok = saveSourceRecord(ds, data, _modal_id);
  } else if (ds === 'depositos') {
    ok = saveDeposito(data, _modal_id);
  } else {
    ok = saveRecord(ds, data, _modal_id);
  }

  if (ok) {
    const onOK = _modal_onOK; // capture BEFORE closeModal() clears it
    showToast(_modal_id ? '✔ Registro actualizado' : '✔ Registro guardado');
    closeModal();
    if (onOK) onOK();
  }
}

// ── CONFIRM DIALOG ─────────────────────────────────────────
let _confirmCb = null;

function showConfirm(title, msg, okLabel, cb, style = 'danger') {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent   = msg;
  const btn = document.getElementById('confirm-ok-btn');
  btn.textContent  = okLabel;
  btn.className    = 'btn btn-' + style;
  _confirmCb = cb;
  btn.onclick = () => { closeConfirm(); if (_confirmCb) _confirmCb(); };
  document.getElementById('confirm-overlay').classList.add('open');
}
function closeConfirm() { document.getElementById('confirm-overlay').classList.remove('open'); }

// ── TABLE HELPERS ──────────────────────────────────────────
function filterTable(tbodyId, q) {
  const ql = q.toLowerCase();
  document.querySelectorAll('#' + tbodyId + ' tr').forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(ql) ? '' : 'none';
  });
}

const _sortState = {};
function sortTable(tbodyId, colIdx) {
  const rows  = Array.from(document.querySelectorAll('#' + tbodyId + ' tr'));
  const state = _sortState[tbodyId] || { col:-1, asc:true };
  const asc   = state.col === colIdx ? !state.asc : true;
  _sortState[tbodyId] = { col:colIdx, asc };
  rows.sort((a, b) => {
    const av = a.cells[colIdx]?.textContent.trim() || '';
    const bv = b.cells[colIdx]?.textContent.trim() || '';
    const an = parseFloat(av.replace(/[^0-9.-]/g,''));
    const bn = parseFloat(bv.replace(/[^0-9.-]/g,''));
    if (!isNaN(an) && !isNaN(bn)) return asc ? an-bn : bn-an;
    return asc ? av.localeCompare(bv,'es') : bv.localeCompare(av,'es');
  });
  const tbody = document.getElementById(tbodyId);
  rows.forEach(r => tbody.appendChild(r));
  tbody.closest('table').querySelectorAll('thead th').forEach((th, i) => {
    th.classList.remove('sort-asc','sort-desc');
    if (i === colIdx) th.classList.add(asc ? 'sort-asc' : 'sort-desc');
  });
}

function totalsRow(data, amtKey, colCount, insertId, label = 'Total') {
  const total = sumMonto(data, amtKey);
  const el = document.getElementById(insertId); if (!el) return;
  el.innerHTML = `<td colspan="${colCount-2}" style="text-align:right;color:var(--muted);font-size:10px">${label}</td><td class="ap" style="font-size:13px;font-weight:700">${fmt(total)}</td><td></td>`;
}

// ── ACTION BUTTONS ─────────────────────────────────────────
function ab(ds, id, onOK) {
  const cbStr = onOK ? `(${onOK.toString()})` : 'null';
  return `<span style="display:inline-flex;gap:4px">
    <button class="btn btn-outline btn-sm" onclick="openModal('${ds}',${id},${cbStr})" title="Editar">✏️</button>
    <button class="btn btn-sm btn-danger" onclick="confirmDelete('${ds}',${id},${cbStr})" title="Eliminar">🗑</button>
  </span>`;
}

function confirmDelete(ds, id, cb) {
  const permKey = _dsPermFor(ds, 'eliminar');
  if (permKey && !requirePerm(permKey, PERM_KEYS.find(p=>p.key===permKey)?.label)) return;
  // V18: same "create an adjustment instead" block, for deletes.
  const rec = (DB[ds]||[]).find(r => r.id === id);
  if (rec && LOCKABLE_DS.has(ds) && _fechaBloqueada(rec.fecha)) { _showPeriodLockModal(ds, id, rec.fecha); return; }
  showConfirm('¿Eliminar este registro?', 'Esta acción no se puede deshacer.', 'Eliminar', () => {
    if (deleteRecord(ds, id)) {
      showToast('Registro eliminado');
      if (cb) cb();
    }
  }, 'danger');
}

// ── KEYBOARD SHORTCUTS ─────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal(); closeConfirm();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    const overlay = document.getElementById('modal-overlay');
    if (overlay && overlay.classList.contains('open')) modalSave();
  }
});

</script>
<script>
// ============================================================
// NAVIGATION STATE
// ============================================================
let _currentModule = 'dashboard';
let _addFn = null;
// Where the top-left "← Inicio" button goes: ALWAYS the Dashboard — that's
// what its label promises, so it never gets redirected to an intermediate
// parent screen. _backFn/_setBackFn below are a SEPARATE chain used only by
// the device/browser hardware-back gesture (popstate), which does go back
// one screen at a time — every sub-page under Configuración/Reportes/etc.
// still calls _setBackFn to feed that chain, and additionally renders its
// own inline "← [Parent]" button for one-screen-back on-screen navigation.
let _backFn = null;
let _isHome = true;

function setPage(title, sub, showAdd, addFn, isHome, backFn) {
  document.getElementById('page-title').textContent = title;
  document.getElementById('page-sub').textContent   = sub || 'IglesiaFinanzas Ver-A006';
  document.getElementById('back-btn').classList.toggle('show', !isHome);
  const addBtn = document.getElementById('add-btn');
  addBtn.style.display = showAdd ? 'inline-flex' : 'none';
  _addFn = addFn || null;
  _backFn = backFn || null;
  _isHome = !!isHome;
  document.getElementById('tb-actions')?.classList.remove('open');
  _pushNavState();
}

// Lets a sub-page (reached by calling a render function directly, without
// going through setPage/showModule) register itself in the one-screen-back
// chain used by the hardware/browser back gesture. Does NOT affect the
// visible top-left "← Inicio" button — that always goes to the Dashboard.
function _setBackFn(fn) {
  _backFn = fn;
  _isHome = false;
  document.getElementById('back-btn')?.classList.add('show');
  _pushNavState();
}

// Visible top-left button: always home, regardless of how deep the current
// screen is nested.
function _goHome() {
  showDashboard();
}

// Used only by the hardware/browser back gesture (see popstate handler
// below) — one screen at a time via the _backFn chain.
function _goBack() {
  if (_backFn) { _backFn(); return; }
  showDashboard();
}

// ── BROWSER / MOBILE BACK-BUTTON NAVIGATION ────────────────────────────
// Every internal "page" (setPage/_setBackFn call) pushes one history entry,
// so the device/browser back button pops exactly one screen at a time using
// the _backFn chain — this is separate from the visible top-left "← Inicio"
// button, which always jumps straight to the Dashboard (_goHome). At the
// true home screen (Dashboard, no _backFn), back instead arms a "toca de
// nuevo para salir" exit confirmation: a second back press within 1.5s is
// allowed through and actually exits; otherwise we swallow it and re-arm
// the listener.
let _navigatingViaPopstate = false;
let _exitArmed = false;
let _exitTimer = null;

function _pushNavState() {
  if (_navigatingViaPopstate) return; // don't stack while replaying a pop
  try { history.pushState({ iglesiaFinanzasNav: true }, ''); } catch(e) {}
}

window.addEventListener('popstate', () => {
  // SECURITY: back/forward navigation must never be able to replay a
  // previously-rendered authenticated screen once the session is logged
  // out. Without this check, _goBack() below would happily re-render
  // whatever in-app page _backFn pointed at (financial screens included)
  // purely from browser history, with no login check at all.
  if (!_authSession.loggedIn) {
    _navigatingViaPopstate = true;
    renderLoginWall();
    try { history.pushState({ iglesiaFinanzasNav: true }, ''); } catch(e) {}
    _navigatingViaPopstate = false;
    return;
  }
  if (!_isHome || _backFn) {
    _navigatingViaPopstate = true;
    _goBack();
    _navigatingViaPopstate = false;
    return;
  }
  // At the Dashboard: double-back-to-exit.
  if (_exitArmed) { return; } // let this second pop actually leave the app
  _exitArmed = true;
  showToast('Toca de nuevo para salir', 'warn');
  try { history.pushState({ iglesiaFinanzasNav: true }, ''); } catch(e) {}
  clearTimeout(_exitTimer);
  _exitTimer = setTimeout(() => { _exitArmed = false; }, 1500);
});

// V6: hamburger toggle for the topbar actions on narrow screens
function toggleTbMenu(e) {
  e.stopPropagation();
  document.getElementById('tb-actions')?.classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const menu = document.getElementById('tb-actions');
  const btn  = document.getElementById('tb-hamburger');
  if (menu && menu.classList.contains('open') && e.target !== btn) menu.classList.remove('open');
});

function triggerAdd() { if (_addFn) _addFn(); }

// Applies the configured church name to the topbar title and the browser tab title.
// Call this after loadDB() and any time DB.config.name changes.
function applyChurchName() {
  const name = (DB.config && DB.config.name) || 'Iglesia';
  document.title = 'IglesiaFinanzas — ' + name;
  if (_currentModule === 'dashboard') {
    document.getElementById('page-title').textContent = name;

function computeDashboardAlerts() {
  const alerts = [];
  const year = DB.config?.year || new Date().getFullYear().toString();

  (DB.presupuesto||[]).forEach(p => {
    const actual = sumMonto(DB.transacciones.filter(t => t.tipo==='Egreso' && t.cat===p.cat && (t.fecha||'').startsWith(year+'-')), 'monto');
    if (!p.presupuestado) return;
    const pct = actual / p.presupuestado * 100;
    if (pct >= 90) alerts.push({
      icon: pct>=100?'🔴':'🟠', tipo: pct>=100?'danger':'warning',
      msg: `Presupuesto "${p.cat}" al ${pct.toFixed(0)}% (${fmt(actual)} de ${fmt(p.presupuestado)})`,
      action: `showModule('presupuesto')`,
    });
  });

  (DB.bancos||[]).filter(b=>b.estado==='Activo').forEach(b => {
    const saldo = b.cuenta ? round2(getSaldo(b.cuenta) + parseMoney(b.saldoInicial)) : parseMoney(b.saldoInicial);
    if (saldo < 0) alerts.push({
      icon:'🔴', tipo:'danger',
      msg: `Cuenta "${b.nombre}" con saldo negativo: ${fmt(saldo)}`,
      action: `showModule('bancos')`,
    });
  });

  (DB.bancos||[]).filter(b=>b.estado==='Activo').forEach(b => {
    const last = (DB.reconciliaciones||[]).find(r => r.bancoId === b.id);
    if (last && Math.abs(last.diferencia) >= 0.01) alerts.push({
      icon:'🟡', tipo:'warning',
      msg: `Conciliación de "${b.nombre}" sin cuadrar (diferencia: ${fmt(last.diferencia)})`,
      action: `showModule('conciliacion')`,
    });
  });

  return alerts;
}
function dashboardAlertsHTML() {
  const alerts = computeDashboardAlerts();

  return `<div class="mb24" style="display:flex;flex-direction:column;gap:8px">

      <div onclick="${a.action}" style="cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--navy-mid);border:1px solid ${a.tipo==='danger'?'var(--danger)':'var(--warning)'};">

}

function _sumIngresosEnRango(f1, f2, fondo) {
  return sumMonto((DB.transacciones||[]).filter(t => t.tipo==='Ingreso' && t.fecha>=f1 && t.fecha<=f2 && (!fondo || t.fondo===fondo)), 'monto');
}
function _trendBarRow(label, val, max, color) {
  const pct = max > 0 ? Math.max(val>0?2:0, Math.round(val/max*100)) : 0;
  return `<div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px"><span>${esc(label)}</span><span style="color:var(--cream);font-weight:600">${fmt(val)}</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}
function dashboardTrendsHTML() {
  const now = new Date();
  const y = now.getFullYear(), mIdx = now.getMonth(); // 0-indexed
  const pad = n => String(n).padStart(2,'0');
  const mStart = `${y}-${pad(mIdx+1)}-01`, mEnd = today();
  const lm = new Date(y, mIdx-1, 1);
  const lmStart = `${lm.getFullYear()}-${pad(lm.getMonth()+1)}-01`;
  const lmLastDay = new Date(y, mIdx, 0).getDate();
  const lmEnd = `${lm.getFullYear()}-${pad(lm.getMonth()+1)}-${pad(lmLastDay)}`;
  const thisMonth = _sumIngresosEnRango(mStart, mEnd);
  const lastMonth = _sumIngresosEnRango(lmStart, lmEnd);
  const mPct = lastMonth > 0 ? Math.round((thisMonth-lastMonth)/lastMonth*100) : (thisMonth>0?100:0);

  const yStart = `${y}-01-01`, yEnd = today();
  const lyStart = `${y-1}-01-01`, lyEnd = `${y-1}-${pad(mIdx+1)}-${pad(now.getDate())}`;
  const thisYear = _sumIngresosEnRango(yStart, yEnd);
  const lastYear = _sumIngresosEnRango(lyStart, lyEnd);
  const yPct = lastYear > 0 ? Math.round((thisYear-lastYear)/lastYear*100) : (thisYear>0?100:0);

  const maxMY = Math.max(thisMonth, lastMonth, 1);
  const maxYY = Math.max(thisYear, lastYear, 1);

  const byFund = (DB.fondos||[]).filter(f=>f.activo)
    .map(f => ({ nombre:f.nombre, monto:_sumIngresosEnRango(mStart, mEnd, f.nombre) }))
    .sort((a,b) => b.monto-a.monto);
  const maxFondo = Math.max(...byFund.map(f=>f.monto), 1);

  return `
    <div style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:10px">Tendencias de Ofrendas</div>
    <div class="btn-grid mb24" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
      <div class="card">
        <div class="ch"><div class="ct">Este Mes vs. Mes Pasado</div><span class="badge ${mPct>=0?'bs':'bd'}">${mPct>=0?'▲':'▼'} ${Math.abs(mPct)}%</span></div>
        ${_trendBarRow('Este mes', thisMonth, maxMY, 'var(--gold)')}
        ${_trendBarRow('Mes pasado', lastMonth, maxMY, 'var(--muted)')}
      </div>
      <div class="card">
        <div class="ch"><div class="ct">Este Año vs. Año Pasado</div><span class="badge ${yPct>=0?'bs':'bd'}">${yPct>=0?'▲':'▼'} ${Math.abs(yPct)}%</span></div>
        ${_trendBarRow(String(y), thisYear, maxYY, 'var(--gold)')}
        ${_trendBarRow(`${y-1} (mismo periodo)`, lastYear, maxYY, 'var(--muted)')}
      </div>
      <div class="card">
        <div class="ch"><div class="ct">Este Mes por Fondo</div></div>
        ${byFund.length ? byFund.map(f => _trendBarRow(f.nombre, f.monto, maxFondo, 'var(--info)')).join('') : '<p style="font-size:11px;color:var(--muted)">Sin fondos activos.</p>'}
      </div>
    </div>`;
}

// Replaces the module container's HTML while preserving focus/cursor
// position of the active <input>/<textarea> (if any), so typing in a
// live-filtering search box isn't interrupted every keystroke by the
// underlying element being torn down and recreated.
function _setModHTML(html) {
  const active = document.activeElement;
  const isTextField = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') && active.id;
  const savedId = isTextField ? active.id : null;
  const start = isTextField ? active.selectionStart : null;
  const end   = isTextField ? active.selectionEnd   : null;
  mod().innerHTML = html;
  if (savedId) {
    const revived = document.getElementById(savedId);
    if (revived) {
      revived.focus();
      if (start !== null && typeof revived.setSelectionRange === 'function') {
        try { revived.setSelectionRange(start, end); } catch(e) {}
      }
    }
  } else {
    // Screens rendered while scrolled down (e.g. after clicking something
    // near the bottom of a long list) used to stay scrolled down when a new
    // page's HTML swapped in. Reset to the top unless we're restoring focus
    // into a field the user was actively typing in.
    window.scrollTo(0, 0);
    const mc = document.getElementById('main-content');
    if (mc) mc.scrollTop = 0;
  }
}

const TOGGLE_LABELS = { servicio:'Servicio', metodo:'Método', tipo:'Tipo', sobre:'Sobre #' };

let _printState = { ds:null, data:[], meta:{} };

// Called by each renderX() right after its filtered `data` + date range are
// known, so the print dialog always reflects exactly what's on screen.
function _setPrintData(ds, data, meta = {}) {
  _printState = { ds, data, meta };
}

function openPrintPreview(ds) {
  const cfg = PRINT_CONFIGS[ds];
  if (!cfg || _printState.ds !== ds) { showToast('⚠ No hay datos para imprimir en esta vista.', 'err'); return; }
  const toggles = [...new Set(cfg.cols.map(c=>c.toggle))];
  document.getElementById('pp-title').textContent = `Vista de Impresión — ${cfg.title}`;
  document.getElementById('pp-body').innerHTML = `
    <p style="font-size:12px;color:var(--muted);margin-bottom:14px">${_printState.data.length} registro(s) según los filtros activos.</p>
    <div class="fg">
      ${toggles.map(t => `<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--cream);text-transform:none;letter-spacing:normal">
        <input type="checkbox" id="pp-t-${t}" checked style="width:auto"> Incluir ${TOGGLE_LABELS[t]||t}
      </label>`).join('')}
    </div>`;
  document.getElementById('print-overlay').classList.add('open');
}
function closePrintPreview() {
  document.getElementById('print-overlay').classList.remove('open');
}

// Same column/toggle selection as doPrintNow, but produces a real
// downloadable .pdf via the shared PDF engine instead of opening the
// browser print dialog.
function doExportPDFNow() {
  if (!requirePerm('exportarDatos','Exportar datos')) return;
  const { ds, data, meta } = _printState;
  const cfg = PRINT_CONFIGS[ds];
  if (!cfg) return;
  const toggles = [...new Set(cfg.cols.map(c=>c.toggle))];
  const on = {};
  toggles.forEach(t => { on[t] = document.getElementById(`pp-t-${t}`)?.checked !== false; });
  const cols = [{k:cfg.nameKey,label:cfg.nameLabel}, ...cfg.cols.filter(c => on[c.toggle])];
  const total = sumMonto(data, 'monto');
  const rango = (meta.f1 || meta.f2) ? `${fmtDate(meta.f1)||'inicio'} — ${fmtDate(meta.f2)||'hoy'}` : 'Todos los registros';

  const columns = ['Fecha', ...cols.map(c=>c.label), 'Monto'];
  const rows = data.map(r => [
    fmtDate(r.fecha),
    ...cols.map(col => col.k==='monto'?fmt(r.monto):(col.k==='_tipoOrigenLabel'?_tipoOrigen(r):(r[col.k]||'—'))),
    fmt(r.monto),
  ]);
  const totalsRow = ['Total', ...cols.map(()=>''), fmt(total)];

  exportPDFReport(`${ds}_${today()}.pdf`, cfg.title, `${rango} · ${data.length} registro(s)`, [
    { columns, rows, totalsRow },
  ]);
  closePrintPreview();
}

// ============================================================
// EXPORT ENGINE (V9)
// Every financial page can export its currently-filtered rows as XLSX or
// JSON. Row shape is a fixed 7-column allow-list — Registro, Fecha,
// Cantidad, Notas, Tipo, Método, Usuario — same discipline as the print
// engine above: built explicitly per module, never by dumping raw DB
// objects, so internal fields (IDs, cuentaCr, vínculos, etc.) never leak
// into an export.
// ============================================================
const EXPORT_CONFIGS = {
  diezmos:       { registro:r=>r.miembro||'',  tipo:()=>'Diezmo',   notas:r=>r.servicio||'' },
  ofrendas:      { registro:r=>r.tipo||'',      tipo:()=>'Ofrenda',  notas:r=>r.servicio||'' },
  donaciones:    { registro:r=>r.donante||'',   tipo:()=>'Donación', notas:r=>r.proyecto||'' },
  transacciones: { registro:r=>r.desc||'',      tipo:r=>r.tipo||'',  notas:r=>r.notas||'' },
  depositos:     { registro:r=>r.desc||'',      tipo:()=>'Depósito', notas:r=>r.ref||'' },
  gastos:        { registro:r=>r.desc||'',      tipo:r=>r.cat||'',   notas:r=>r.proveedor||'' },
  ventas:        { registro:r=>r.evento||'',    tipo:r=>r.cat||'',   notas:r=>r.resp?`Responsable: ${r.resp}`:'' },
  eventos:       { registro:r=>r.evento||'',    tipo:r=>r.cat||'',   notas:r=>r.resp?`Responsable: ${r.resp}`:'' },
  otrosIngresos: { registro:r=>r.desc||'',      tipo:r=>r.cat||'',   notas:r=>'' },
  unificado:     { registro:r=>r.desc||'',      tipo:r=>_tipoOrigen(r), notas:r=>r.notas||'' },
};

// Builds the fixed 7-column row for one record of dataset `ds`.
function _exportRow(ds, r) {
  const cfg = EXPORT_CONFIGS[ds];
  return {
    Registro: cfg.registro(r),
    Fecha:    fmtDate(r.fecha) || '',
    Cantidad: r.monto || 0,
    Notas:    cfg.notas(r),
    Tipo:     cfg.tipo(r),
    Método:   r.metodo || '',
    Usuario:  r.usuario || '',
  };
}

function _exportRows(ds) {
  if (_printState.ds !== ds) return null;
  return (_printState.data || []).map(r => _exportRow(ds, r));
}

function exportModuleXLSX(ds) {
  if (typeof XLSX === 'undefined') { showToast('Librería Excel no cargada','err'); return; }
  const rows = _exportRows(ds);
  if (!rows) { showToast('⚠ No hay datos para exportar en esta vista.', 'err'); return; }
  const cfg = PRINT_CONFIGS[ds];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), (cfg?.title || ds).slice(0,31));
  XLSX.writeFile(wb, `${ds}_${today()}.xlsx`);
  showToast('✔ Excel exportado');
}

function exportModuleJSON(ds) {
  const rows = _exportRows(ds);
  if (!rows) { showToast('⚠ No hay datos para exportar en esta vista.', 'err'); return; }
  dlBlob(JSON.stringify(rows, null, 2), 'application/json', `${ds}_${today()}.json`);
  showToast('✔ JSON exportado');
}

// The topbar hamburger's JSON/Excel buttons are the SAME two on every
// screen, so they resolve what "this screen's content" means at click time
// via _printState (set by whichever list-module render function is
// currently showing) rather than a fixed dataset — that's what keeps them
// scoped to the current page instead of quietly exporting everything.
function _tbExportJSON() {
  if (_printState.ds) { exportModuleJSON(_printState.ds); }
  else { showToast('⚠ Esta pantalla no tiene una lista para exportar. Usa Configuración → Importar y Exportar para un respaldo completo.', 'err'); }
}
function _tbExportXLSX() {
  if (_printState.ds) { exportModuleXLSX(_printState.ds); }
  else { showToast('⚠ Esta pantalla no tiene una lista para exportar. Usa Configuración → Importar y Exportar para un respaldo completo.', 'err'); }
}

// ============================================================
// V17.1 — CAMPAÑAS DE PROMESAS (Seguimiento de compromisos)
// ============================================================
// "Dado" per pledge is the sum of its own Pagos de Promesa records — a
// dedicated ledger, deliberately NOT diezmos/donaciones. Nothing here reads
// or writes those modules, so entering a pledge payment never requires a
// matching name/fund/date in Diezmos or Donaciones, and vice versa.
function _dadoPorPromesa(promesaId) {
  return sumMonto((DB.pagosPromesa||[]).filter(pg => pg.promesaId == promesaId), 'monto');
}
function _dadoTotalCampana(camp) {
  const idsPromesa = new Set((DB.promesas||[]).filter(p=>p.campanaId==camp.id).map(p=>p.id));
  return sumMonto((DB.pagosPromesa||[]).filter(pg => idsPromesa.has(pg.promesaId)), 'monto');
}
function _progColor(pct) { return pct >= 100 ? 'var(--success)' : pct >= 60 ? 'var(--gold)' : 'var(--info)'; }

// V17.2 — Overdue detection: compares actual progress (% paid) against
// expected progress (% of the campaign's own timeline elapsed, pro-rated
// against the pledge's own promise date if it starts partway through).
// A pledge with no fechaFin on its campaign can't be "behind schedule" by
// definition, so it's always "Al día" until fully paid.
function _estadoPromesa(p, camp) {
  const dado = _dadoPorPromesa(p.id);
  const pct = p.monto > 0 ? Math.round(dado/p.monto*100) : 0;
  if (pct >= 100) return { label:'Completo', cls:'bs', pct, expectedPct:100 };
  if (!camp.fechaFin) return { label:'Al día', cls:'bi', pct, expectedPct:null };
  const start = camp.fechaInicio || p.fecha || camp.fechaFin;
  const end = camp.fechaFin;
  const hoy = today();
  const t0 = new Date(start).getTime(), t1 = new Date(end).getTime(), tn = new Date(hoy).getTime();
  if (tn >= t1) return { label:'Atrasado', cls:'bd', pct, expectedPct:100 }; // campaign period is over and pledge isn't paid off
  if (t1 <= t0) return { label:'Al día', cls:'bi', pct, expectedPct:null };
  const expectedPct = Math.min(100, Math.max(0, Math.round((tn-t0)/(t1-t0)*100)));
  const atrasado = pct < expectedPct - 15; // 15-point grace band before flagging
  return { label: atrasado ? 'Atrasado' : 'Al día', cls: atrasado ? 'bd' : 'bi', pct, expectedPct };
}
function _promesasAtrasadas() {
  const out = [];
  (DB.campanas||[]).filter(c=>c.activo!==false).forEach(camp => {
    (DB.promesas||[]).filter(p=>p.campanaId==camp.id).forEach(p => {
      const est = _estadoPromesa(p, camp);
      if (est.label === 'Atrasado') out.push({ p, camp, est });
    });
  });
  return out;
}

function _abrirPagoPromesa(promesaId, id, onOK) {
  const permKey = _dsPermFor('pagosPromesa', id ? 'editar' : 'agregar');

  const rec = id ? {...((DB.pagosPromesa||[]).find(r=>r.id===id)||{})} : { promesaId };
  rec._locked = !id && !!promesaId; // lock only when opened from a specific pledge's "Pagar" button — not when editing or adding generically
  _modal_ds = 'pagosPromesa';
  _modal_id = id;
  _modal_onOK = onOK;

  if (titleEl) titleEl.textContent = id ? 'Editar Pago de Promesa' : 'Registrar Pago de Promesa';

}

  if (q)  data = data.filter(t => (t.desc||'').toLowerCase().includes(q) || (t.ref||'').toLowerCase().includes(q));

  const ing = sumMonto(data.filter(t=>t.tipo==='Ingreso'), 'monto');

// V8b: quick CSV export of whatever's currently filtered in the unified view
function _exportUnificadoCSV() {
  const { data } = _printState.ds === 'unificado' ? _printState : { data: [] };
  if (!data.length) { showToast('⚠ No hay registros para exportar.', 'err'); return; }
  const headers = ['Fecha','Origen','Descripción','Método','Tipo','Monto','Ref'];
  const rows = data.map(t => [fmtDate(t.fecha), _tipoOrigen(t), t.desc||'', t.metodo||'', t.tipo||'', t.monto||0, t.ref||'']);
  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `transacciones-unificado-${_today()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function doApprove(i) { approvePending(i, () => { showToast('✔ Aprobado'); renderAprobaciones(); }); }

  if (!DB.pending?.length) { showToast('No hay pendientes','warn'); return; }
