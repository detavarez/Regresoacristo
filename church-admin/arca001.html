// ── MINISTRY FUNDS (V3) ─────────────────────────────────────
// Each fund's ledger is every income (diezmos/ofrendas/donaciones) and expense
// (gastos) record tagged with its name — this IS the fund's transaction list.
function fundLedger(nombre, asOf) {
  const inRange = r => !asOf || (r.fecha||'') <= asOf;
  const ingresos = ['diezmos','ofrendas','donaciones','ventas','otrosIngresos'].flatMap(k =>
    (DB[k]||[]).filter(r => (r.fondo||'Fondo General') === nombre && inRange(r))
      .map(r => ({...r, _tipo:'Ingreso', _origen:k})));
  const egresos = ['gastos','eventos'].flatMap(k =>
    (DB[k]||[]).filter(g => (g.fondo||'Fondo General') === nombre && inRange(g))
      .map(g => ({...g, _tipo:'Egreso', _origen:k})));
  // Fund-to-fund transfers move money between two funds' balances without ever
  // being real income/expense — show as Egreso on the origen side and Ingreso
  // on the destino side of each fund's own ledger.
  const transfIn = (DB.transferencias||[]).filter(t => t.destino === nombre && inRange(t))
    .map(t => ({...t, _tipo:'Ingreso', _origen:'transferencias', desc:`Transferencia desde ${t.origen}`, metodo:'Transferencia'}));
  const transfOut = (DB.transferencias||[]).filter(t => t.origen === nombre && inRange(t))
    .map(t => ({...t, _tipo:'Egreso', _origen:'transferencias', desc:`Transferencia a ${t.destino}`, metodo:'Transferencia'}));
  return [...ingresos, ...egresos, ...transfIn, ...transfOut].sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
}
function fundBalance(fondo, asOf) {
  const ledger = fundLedger(fondo.nombre, asOf);
  const mov = sumMonto(ledger, r => r._tipo === 'Ingreso' ? (r.monto||0) : -(r.monto||0));
  return round2(parseMoney(fondo.saldoInicial) + mov);
}
function _fondoInUse(nombre) {
  return ['diezmos','ofrendas','donaciones','gastos','ventas','eventos','otrosIngresos'].some(k => (DB[k]||[]).some(r => r.fondo === nombre))
    || (DB.bancos||[]).some(b => b.fondo === nombre);
}

function renderFondos() {

    const ledger = fundLedger(f.nombre);
    return `<div class="card" style="${f.activo===false?'opacity:.55':''}">

}

        <tbody id="tftb">${list.length ? list.map(t => `
          <tr>

function saveTransferencia() {
  const fecha  = el('tf-fecha').value || today();
  if (!_assertPeriodoAbierto('transferencias', fecha)) return;
  const monto  = parseMoney(el('tf-monto').value);
  const origen = el('tf-origen').value;
  const destino = el('tf-destino').value;
  const nota   = (el('tf-nota').value || '').trim();
  if (!origen || !destino) { showToast('⚠ Selecciona fondo de origen y destino.', 'err'); return; }
  if (origen === destino) { showToast('⚠ El fondo de origen y destino no pueden ser el mismo.', 'err'); return; }
  if (monto <= 0) { showToast('⚠ Ingresa un monto mayor a cero.', 'err'); return; }
  const trId = nextId();
  DB.transferencias.unshift({ id: nextId(), fecha, origen, destino, monto, nota, _transId: trId });
  // Also post it to Todas las Transacciones (for visibility/printing/export)
  // with tipoOrigen:'Transferencia' so P&L (which filters by tipo Ingreso/
  // Egreso) already ignored it — but soloFondo:true additionally keeps it
  // OUT of the General Ledger entirely (see generateJournal), since a fund
  // reallocation has no real bank-account cuentaDr/cuentaCr and previously
  // fell into the wrong default, phantom-crediting the bank account.
  DB.transacciones.unshift({
    id: trId, fecha, desc: `Transferencia — ${origen} → ${destino}`,
    cat: 'Transferencia entre Fondos', ref: `TRF-${trId}`,
    tipo: 'Transferencia', tipoOrigen: 'Transferencia',
    metodo: 'Transferencia', monto, estado: 'Completado', fondo: origen,
    soloFondo: true,
  });
  _logAudit('Crear', 'transferencias', trId, { desc:`${origen} → ${destino}`, monto });
  if (saveDB()) { showToast('✔ Transferencia registrada'); renderTransferencias(); }
}

function deleteTransferencia(id) {
  const rec = (DB.transferencias||[]).find(t => t.id === id);
  if (rec && _fechaBloqueada(rec.fecha)) { _showPeriodLockModal('transferencias', id, rec.fecha); return; }
  showConfirm('¿Eliminar esta transferencia?', 'Los saldos de ambos fondos se recalcularán automáticamente.', 'Eliminar', () => {
    if (!_assertPeriodoAbierto('transferencias', rec?.fecha)) return;
    if (rec && rec._transId) DB.transacciones = DB.transacciones.filter(t => t.id !== rec._transId);
    if (rec) _logAudit('Eliminar', 'transferencias', id, { desc:`${rec.origen} → ${rec.destino}`, monto:rec.monto });
    DB.transferencias = (DB.transferencias||[]).filter(t => t.id !== id);
    if (saveDB()) { showToast('✔ Eliminada'); renderTransferencias(); }
  }, 'danger');
}

// ── CIERRE DE PERIODO (V18) ─────────────────────────────────
// Single rolling cutoff date — see LOCKABLE_DS/_fechaBloqueada/etc. above.
// Reuses the existing Historial de Auditoría (_logAudit/DB.auditLog) for
// the "quién cerró y cuándo" trail instead of a parallel log; this screen
// just filters that log to modulo:'cierrePeriodo' for its own history table.
function _lastDayOfMonth(year, month) { return new Date(year, month, 0).getDate(); }

function _cerrarPeriodo(fecha, etiqueta, tipo) {
  if (!requirePerm('cerrarPeriodo', 'Cerrar o reabrir periodos contables')) return;
  const anterior = DB.config.cierre ? DB.config.cierre.fecha : null;
  if (anterior && fecha <= anterior) {
    showToast('⚠ La nueva fecha de cierre debe ser posterior al cierre actual. Para mover el cierre hacia atrás, usa "Reabrir".', 'err');
    return;
  }
  DB.config.cierre = {
    fecha, etiqueta, tipo,
    cerradoPor: _authSession.userName || 'Sistema', cerradoPorId: _authSession.userId,
    cerradoEl: new Date().toISOString(),
  };
  _logAudit('Cerrar Periodo', 'cierrePeriodo', null,
    { desc:`Cerrado hasta ${etiqueta} (${fmtDate(fecha)})${anterior ? ` — cierre anterior: ${fmtDate(anterior)}` : ''}` });
  if (saveDB()) { showToast('🔒 Periodo cerrado'); renderCierrePeriodo(); }
}

function _confirmCerrarPeriodo() {
  const tipo = el('cp-tipo').value; // 'Mes' | 'Año'
  const year = parseInt(el('cp-year').value, 10);
  let fecha, etiqueta;
  if (tipo === 'Año') {
    fecha = `${year}-12-31`;
    etiqueta = `Año ${year}`;
  } else {
    const month = parseInt(el('cp-month').value, 10);
    const lastDay = _lastDayOfMonth(year, month);
    fecha = `${year}-${String(month).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
    etiqueta = `${_PYL_MESES_LARGO[month-1]} ${year}`;
  }
  showConfirm(
    '🔒 ¿Cerrar Periodo?',
    `Se bloqueará la edición/eliminación directa de cualquier transacción con fecha hasta el ${fmtDate(fecha)} (${etiqueta}). Después de cerrado, cualquier corrección deberá hacerse mediante una Entrada de Ajuste posterior.`,
    'Cerrar Periodo',
    () => _cerrarPeriodo(fecha, etiqueta, tipo),
    'primary'
  );
}

function _reabrirPeriodo() {
  if (_currentUser()?.rol !== 'Administrador') { showToast('⚠ Solo un Administrador puede reabrir un periodo cerrado.', 'err'); return; }
  const c = _periodoActivo();
  if (!c) return;
  const nueva = (el('cp-reabrir-fecha')?.value || '').trim();
  if (nueva && nueva >= c.fecha) { showToast('⚠ La nueva fecha debe ser anterior al cierre actual — de lo contrario no es una reapertura.', 'err'); return; }
  showConfirm(
    '⚠ ¿Reabrir Periodo?',
    `Esto permitirá volver a editar y eliminar directamente transacciones ${nueva ? `entre el ${fmtDate(nueva)} y el ${fmtDate(c.fecha)}` : `hasta el ${fmtDate(c.fecha)} (se reabre por completo)`}. Esta acción queda registrada en el Historial de Auditoría.`,
    'Reabrir Periodo',
    () => {
      const anterior = c.fecha;
      if (nueva) {
        DB.config.cierre = { fecha:nueva, etiqueta:`Reabierto — cierre movido a ${fmtDate(nueva)}`, tipo:'Reapertura',
          cerradoPor:_authSession.userName||'Sistema', cerradoPorId:_authSession.userId, cerradoEl:new Date().toISOString() };
      } else {
        DB.config.cierre = null;
      }
      _logAudit('Reabrir Periodo', 'cierrePeriodo', null,
        { desc:`Reabierto: cierre movido de ${fmtDate(anterior)} a ${nueva ? fmtDate(nueva) : 'sin cierre (totalmente abierto)'}` });
      if (saveDB()) { showToast('🔓 Periodo reabierto'); renderCierrePeriodo(); }
    },
    'danger'
  );
}

function renderCierrePeriodo() {
  const c = _periodoActivo();
  const years = _yearsIn(DB.transacciones);
  const thisYear = new Date().getFullYear();
  if (!years.includes(String(thisYear))) years.unshift(String(thisYear));
  const tipoSel = el('cp-tipo')?.value || 'Mes';
  const history = (DB.auditLog||[]).filter(a => a.modulo === 'cierrePeriodo').slice(0, 30);

  const statusHTML = c ? `
    <div class="card" style="margin-bottom:20px;border-color:var(--danger)">
      <div class="ch"><div class="ct">🔒 Periodo Cerrado</div></div>
      <p style="font-size:13px;color:var(--white);margin-bottom:4px">Cerrado hasta el <strong>${fmtDate(c.fecha)}</strong> (${esc(c.etiqueta)})</p>

    </div>` : `
    <div class="card" style="margin-bottom:20px">
      <div class="ch"><div class="ct">🔓 Sin Periodo Cerrado</div></div>
      <p style="font-size:13px;color:var(--muted)">Todas las transacciones se pueden editar y eliminar libremente.</p>
    </div>`;

  const reabrirHTML = c ? `
    <div class="card" style="margin-bottom:20px">
      <div class="ch"><div class="ct">Reabrir Periodo</div></div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:10px">Solo un Administrador puede reabrir. Deja la fecha en blanco para reabrir por completo, o ingresa una fecha anterior para mover el cierre hacia atrás.</p>
      <div class="fg">
        <div class="fgrp"><label>Reabrir desde (opcional)</label><input type="date" id="cp-reabrir-fecha" max="${c.fecha}"></div>
      </div>
      <div style="margin-top:12px"><button class="btn btn-danger" onclick="_reabrirPeriodo()">🔓 Reabrir Periodo</button></div>
    </div>` : '';

  const historyHTML = `
    <div class="card">
      <div class="ch"><div class="ct">Historial de Cierres</div><span class="badge bg">${history.length} eventos</span></div>
      <div class="tw"><table>
        <thead><tr><th>Fecha</th><th>Acción</th><th>Usuario</th><th>Detalle</th></tr></thead>
        <tbody>${history.length ? history.map(h => `
          <tr>
            <td>${fmtDateTime(h.timestamp)}</td>

            <td>${esc(h.usuario)}</td>

          </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--muted)">Sin cierres registrados todavía.</td></tr>'}
        </tbody>
      </table></div>
    </div>`;

  _setModHTML(`${_modFromConfig ? _configBackLink() : ''}
    ${statusHTML}
    <div class="card" style="margin-bottom:20px">
      <div class="ch"><div class="ct">Cerrar Periodo</div></div>

            <option value="Mes" ${tipoSel==='Mes'?'selected':''}>Mes</option>
            <option value="Año" ${tipoSel==='Año'?'selected':''}>Año</option>
          </select>

        ${tipoSel==='Mes' ? `<div class="fgrp"><label>Mes</label><select id="cp-month">${_PYL_MESES_LARGO.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></div>` : ''}
        <div class="fgrp"><label>Año</label><select id="cp-year">${years.map(y=>`<option value="${y}">${y}</option>`).join('')}</select></div>
      </div>
      <div style="margin-top:16px"><button class="btn btn-primary" onclick="_confirmCerrarPeriodo()">🔒 Cerrar Periodo</button></div>
    </div>

// ── ENTRADAS DE AJUSTE (V18) ─────────────────────────────────
// Dedicated screen — NOT a generic modal form — for corrections to records
// that fall inside a closed period. Each ajuste is its own record (DB.ajustes)
// linked to the original via refDs/refId, dated strictly after the cutoff,
// and posts its own transacción (buildAjusteTrans) into cuentas 4009/5009 so
// it's visible in Mayor/Balance/P&L as its own line, distinct from the
// original category.
// Small inline indicator for a locked record's list row: how many Entradas
// de Ajuste reference it, linking straight to the Ajustes screen filtered
// to nothing in particular (the list there is small enough to just scan).
function _ajusteBadge(ds, id) {
  const n = (DB.ajustes||[]).filter(a => a.refDs === ds && a.refId === id).length;
  if (!n) return '';
  return `<span class="badge bw" style="cursor:pointer;margin-left:4px" onclick="showModule('ajustes')" title="Tiene ${n} entrada(s) de ajuste posteriores">🔧 ${n}</span>`;
}
function _ajustableRecords() {
  const c = _periodoActivo();
  if (!c) return [];
  const out = [];
  LOCKABLE_DS.forEach(ds => {
    (DB[ds]||[]).forEach(r => {
      if (_fechaBloqueada(r.fecha)) {
        out.push({ ds, id:r.id, fecha:r.fecha, monto:r.monto, desc:_dsRecordLabel(ds, r) });
      }
    });
  });
  out.sort((a,b) => b.fecha.localeCompare(a.fecha));
  return out;
}

function buildAjusteTrans(rec) {
  const catKey = rec.tipo === 'Egreso' ? 'Ajuste - Gasto' : 'Ajuste - Ingreso';
  return {
    fecha: rec.fecha,
    desc: `Ajuste — ${rec.refDesc}${rec.motivo ? `: ${rec.motivo}` : ''}`.slice(0,300),
    cat: catKey,
    ref: `AJ-${rec.id}`,
    tipo: rec.tipo,
    tipoOrigen: 'Ajuste de Periodo Cerrado',
    metodo: 'Ajuste Contable',
    monto: rec.monto,
    estado: 'Completado',
    fondo: rec.fondo || 'Fondo General',
    _srcDs: 'ajustes', _srcId: rec.id,
  };
}

function saveAjuste() {
  if (!requirePerm('agregarTrans', 'Agregar transacciones')) return;
  const refKey = (el('aj-ref')?.value || '');
  const sep = refKey.indexOf('|');
  const refDs = sep > -1 ? refKey.slice(0, sep) : '';
  const refId = sep > -1 ? parseInt(refKey.slice(sep+1), 10) : NaN;
  const original = refDs && !isNaN(refId) ? (DB[refDs]||[]).find(r => r.id === refId) : null;
  if (!original) { showToast('⚠ Selecciona la transacción original que estás ajustando.', 'err'); return; }

  const fecha = el('aj-fecha').value;
  const c = _periodoActivo();
  if (!fecha || (c && fecha <= c.fecha)) {
    showToast(`⚠ La fecha del ajuste debe ser posterior al cierre (${c ? fmtDate(c.fecha) : 'sin cierre activo'}).`, 'err');
    return;
  }
  const tipo = el('aj-tipo').value;
  const monto = parseMoney(el('aj-monto').value);
  if (monto <= 0) { showToast('⚠ Ingresa un monto mayor a cero.', 'err'); return; }
  const motivo = (el('aj-motivo').value || '').trim();
  if (!motivo) { showToast('⚠ Escribe el motivo del ajuste.', 'err'); return; }
  const fondo = el('aj-fondo').value || 'Fondo General';
  const refDesc = _dsRecordLabel(refDs, original);

  const rec = { id: nextId(), fecha, refDs, refId, refDesc, refFecha: original.fecha, tipo, monto, motivo, fondo };
  const trans = buildAjusteTrans(rec);
  trans.id = nextId();
  rec._transId = trans.id;
  DB.ajustes.unshift(rec);
  DB.transacciones.unshift(trans);
  _logAudit('Crear', 'ajustes', rec.id, { desc:`Ajuste sobre ${refDesc} (${fmtDate(original.fecha)})`, monto });
  if (saveDB()) { showToast('✔ Entrada de ajuste registrada'); _ajustePrefill = null; renderAjustes(); }
}

// ============================================================
// CONCILIACIÓN BANCARIA
// ============================================================
// Standard bank-rec workflow: pick a bank account, enter the statement's
// cutoff date and ending balance, check off every ledger line that actually
// cleared on the statement, and the difference tells you what's still
// outstanding (checks/deposits in transit) or what doesn't match. Never
// mutates transacciones — it only reads the ledger (getMayorEntries) and
// saves a snapshot of what was checked, in DB.reconciliaciones.
let _recon = { bancoId:null, fechaCorte:null, saldoEstado:'', cleared:new Set() };
let _reconCtx = null;

function renderConciliacion() {
  const bancos = (DB.bancos||[]).filter(b => b.estado === 'Activo' && b.cuenta);
  if (!_recon.bancoId && bancos.length) _recon.bancoId = bancos[0].id;
  if (!_recon.fechaCorte) _recon.fechaCorte = today();
  const banco = bancos.find(b => b.id === _recon.bancoId);

  let bodyHTML = '';
  if (!bancos.length) {
    bodyHTML = `<div class="card"><p style="color:var(--muted);font-size:13px;text-align:center;padding:20px">No hay cuentas bancarias activas con una cuenta contable asignada. Configúralas en Cuentas Bancarias primero.</p></div>`;
  } else if (banco) {
    const allEntries = getMayorEntries(banco.cuenta);
    const entries = allEntries.filter(e => e.fecha <= _recon.fechaCorte);
    const pending = allEntries.filter(e => e.fecha > _recon.fechaCorte); // future-dated, not yet part of this cutoff
    const saldoLibros = entries.length ? entries[entries.length-1].saldo : 0;
    const saldoConciliado = sumMonto(entries.filter(e => _recon.cleared.has(e.transId)), e => e.debe - e.haber);
    const saldoEstado = parseMoney(_recon.saldoEstado);
    const diferencia = round2(saldoEstado - saldoConciliado);
    const outstanding = entries.filter(e => !_recon.cleared.has(e.transId));
    const balanced = _recon.saldoEstado !== '' && Math.abs(diferencia) < 0.005;

    const history = (DB.reconciliaciones||[]).filter(r => r.bancoId === banco.id).sort(_byDateDesc);

    _reconCtx = { banco, entries, outstanding, saldoLibros, saldoConciliado, saldoEstado, diferencia, fechaCorte:_recon.fechaCorte };

    bodyHTML = `
    <div class="sg">
      <div class="sc blue"><div class="si">📖</div><div class="sl">Saldo en Libros</div><div class="sv">${fmt(saldoLibros)}</div><div class="ss2">al ${fmtDate(_recon.fechaCorte)}</div></div>
      <div class="sc gold"><div class="si">🧾</div><div class="sl">Saldo Conciliado</div><div class="sv">${fmt(saldoConciliado)}</div><div class="ss2">${entries.length - outstanding.length} de ${entries.length} marcadas</div></div>

        ${bancos.map(b=>`<option value="${b.id}" ${b.id===_recon.bancoId?'selected':''}>${esc(b.nombre)} (${esc(b.banco||'')})</option>`).join('')}
      </select>
    </div>
    ${bodyHTML}`);
}
function _conciliacionReportData() {
  const r = _reconCtx;
  if (!r) return null;
  const clearedRows = r.entries.filter(e => _recon.cleared.has(e.transId))
    .map(e => ['✔', fmtDate(e.fecha), e.desc, e.ref, e.debe>0?fmt(e.debe):'', e.haber>0?fmt(e.haber):'']);
  const outstandingRows = r.outstanding
    .map(e => ['⏳', fmtDate(e.fecha), e.desc, e.ref, e.debe>0?fmt(e.debe):'', e.haber>0?fmt(e.haber):'']);
  const cols = ['✓','Fecha','Descripción','Ref.','Débito','Crédito'];
  const balanced = _recon.saldoEstado !== '' && Math.abs(r.diferencia) < 0.005;
  return {
    title: 'Conciliación Bancaria', subtitle: `${r.banco.nombre} — al ${fmtDate(r.fechaCorte)}`,
    sections: [
      { heading:'Resumen', columns:['Concepto','Monto'], rows: [
          ['Saldo en Libros', fmt(r.saldoLibros)],
          ['Saldo Conciliado', fmt(r.saldoConciliado)],
          ['Saldo Según Estado de Cuenta', _recon.saldoEstado===''?'—':fmt(r.saldoEstado)],
          ['Diferencia', _recon.saldoEstado===''?'—':fmt(r.diferencia)],
          ['Estado', balanced ? 'Cuadrado' : 'No Cuadrado'],
        ] },
      { heading:'Partidas Marcadas (Confirmadas en el Banco)', columns:cols, rows: clearedRows },
      { heading:'Partidas en Tránsito (Pendientes)', columns:cols, rows: outstandingRows },
    ],
  };
}
function exportConciliacionXLSX() {
  if (!requirePerm('exportarDatos','Exportar datos')) return;
  if (typeof XLSX === 'undefined') { showToast('Librería Excel no cargada','err'); return; }
  const rep = _conciliacionReportData();
  if (!rep) { showToast('⚠ Selecciona una cuenta bancaria primero.','err'); return; }
  const wb = XLSX.utils.book_new();
  rep.sections.forEach(sec => {
    if (!sec.rows.length) return;
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([sec.columns, ...sec.rows]), sec.heading.slice(0,31));
  });
  XLSX.writeFile(wb, `${_reportFilename(['Conciliación Bancaria', _reconCtx.banco.nombre, today()])}.xlsx`);
  showToast('✔ Excel exportado');
}
function exportConciliacionPDF() {
  if (!requirePerm('exportarDatos','Exportar datos')) return;
  const rep = _conciliacionReportData();
  if (!rep) { showToast('⚠ Selecciona una cuenta bancaria primero.','err'); return; }
  exportPDFReport(`${_reportFilename(['Conciliación Bancaria', _reconCtx.banco.nombre, today()])}.pdf`, rep.title, rep.subtitle, rep.sections);
}

// V12: called on every keystroke in "Saldo según Estado de Cuenta" instead
// of renderConciliacion(). A full re-render on every keystroke replaces the
// <input> itself, which resets the cursor to position 0 — so each new digit
// gets inserted at the FRONT instead of the end, silently reversing what
// you type (8569 → 9658). Updating only the three summary spans in place
// leaves the input's own DOM node (and cursor position) untouched.
function _reconRefreshDiferencia(saldoConciliado) {
  const saldoEstado = parseMoney(_recon.saldoEstado);
  const diferencia = round2(saldoEstado - saldoConciliado);
  const balanced = _recon.saldoEstado !== '' && Math.abs(diferencia) < 0.005;
  const card = el('rc-card-dif');
  if (!card) return;
  card.className = `sc ${_recon.saldoEstado===''?'purple':(balanced?'green':'red')}`;
  el('rc-icon-dif').textContent = balanced ? '✅' : '⚠';
  el('rc-sv-dif').textContent = _recon.saldoEstado==='' ? '—' : fmt(diferencia);
  el('rc-ss2-dif').textContent = balanced ? 'Cuadra' : (_recon.saldoEstado===''?'Ingresa el saldo del banco':'No cuadra todavía');
}
function _reconToggle(transId) {
  if (_recon.cleared.has(transId)) _recon.cleared.delete(transId); else _recon.cleared.add(transId);
  renderConciliacion();
}
function _reconMarkAll(state) {
  const banco = (DB.bancos||[]).find(b => b.id === _recon.bancoId);
  if (!banco) return;
  const entries = getMayorEntries(banco.cuenta).filter(e => e.fecha <= _recon.fechaCorte);
  if (state) entries.forEach(e => _recon.cleared.add(e.transId));
  else _recon.cleared.clear();
  renderConciliacion();
}
function _reconSave() {
  const banco = (DB.bancos||[]).find(b => b.id === _recon.bancoId);
  if (!banco) return;
  if (_recon.saldoEstado === '' || isNaN(parseFloat(_recon.saldoEstado))) {
    showToast('⚠ Ingresa el saldo según el estado de cuenta primero.', 'err'); return;
  }
  const entries = getMayorEntries(banco.cuenta).filter(e => e.fecha <= _recon.fechaCorte);
  const saldoConciliado = sumMonto(entries.filter(e => _recon.cleared.has(e.transId)), e => e.debe - e.haber);
  const saldoEstado = parseMoney(_recon.saldoEstado);
  DB.reconciliaciones.unshift({
    id: nextId(), bancoId: banco.id, bancoNombre: banco.nombre,
    fechaCorte: _recon.fechaCorte, saldoEstado, saldoConciliado,
    diferencia: saldoEstado - saldoConciliado,
    partidasConciliadas: _recon.cleared.size, partidasTotal: entries.length,
    fecha: today(),
  });
  if (saveDB()) { showToast('✔ Conciliación guardada'); renderConciliacion(); }
}
function _reconDelete(id) {
  showConfirm('¿Eliminar esta conciliación?', 'Solo se borra el registro histórico — no afecta transacciones ni saldos.', 'Eliminar', () => {
    DB.reconciliaciones = (DB.reconciliaciones||[]).filter(r => r.id !== id);
    if (saveDB()) { showToast('✔ Eliminada'); renderConciliacion(); }
  }, 'danger');
}

// ============================================================
// ESTADO DE RESULTADOS / P&L (V10)
// Single computed core (_pylCompute) feeds both the on-screen table and
// the Excel/PDF exports, so what you see is exactly what you export.
// ============================================================
let _pylView = 'resumen'; // 'resumen' | 'mensual' — persists across re-renders
let _pylDrillCtx = { trans: [], label: '' };

const _PYL_MESES_LARGO = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const _PYL_PLABELS_FOR = (year) => {
  const labels = {all:'Todo el período',year:`Año ${year}`,q1:'Q1 Ene–Mar',q2:'Q2 Abr–Jun',q3:'Q3 Jul–Sep',q4:'Q4 Oct–Dic'};
  _PYL_MESES_LARGO.forEach((nombre,i) => { labels[`m${i+1}`] = nombre; });
  return labels;
};

function _pylCompute(period, year, view) {
  const pLabels = _PYL_PLABELS_FOR(year);
  const [from, to] = _periodRange(period, year);
  const trans = filterByPeriod(DB.transacciones, period, year);

  const prevInfo  = _pylPrevPeriod(period, year);
  const prevTrans = prevInfo ? filterByPeriod(DB.transacciones, prevInfo.period, prevInfo.year) : [];
  const [prevFrom, prevTo] = prevInfo ? _periodRange(prevInfo.period, prevInfo.year) : [null,null];
  const prevLabel = prevInfo ? `${_PYL_PLABELS_FOR(prevInfo.year)[prevInfo.period]} ${prevInfo.year}` : null;

  const incMap = _pylAggByCat(trans,'Ingreso'), egMap = _pylAggByCat(trans,'Egreso');
  const prevIncMap = _pylAggByCat(prevTrans,'Ingreso'), prevEgMap = _pylAggByCat(prevTrans,'Egreso');
  const ti = sumMonto(Object.values(incMap));
  const te = sumMonto(Object.values(egMap));
  const prevTi = sumMonto(Object.values(prevIncMap));
  const prevTe = sumMonto(Object.values(prevEgMap));
  const neto = ti - te, prevNeto = prevTi - prevTe;

  const budgetMap = {};
  (DB.presupuesto||[]).forEach(p => { budgetMap[p.cat] = (budgetMap[p.cat]||0) + (p.presupuestado||0); });
  const prorate = _pylProrateFactor(period);

  const incCats = [...new Set([...Object.keys(incMap), ...Object.keys(prevIncMap)])].sort((a,b)=>(incMap[b]||0)-(incMap[a]||0));
  const egCats  = [...new Set([...Object.keys(egMap), ...Object.keys(prevEgMap), ...Object.keys(budgetMap)])].sort((a,b)=>(egMap[b]||0)-(egMap[a]||0));

  let monthly = null;
  if (view === 'mensual') {
    const monthsRange = _pylMonthsForPeriod(period);
    const months = []; for (let m=monthsRange[0]; m<=monthsRange[1]; m++) months.push(m);
    const mesLabels = months.map(m => _PYL_MESES[m-1]);
    const { map: incMonthly } = _pylMonthlyByCat(DB.transacciones, 'Ingreso', year, monthsRange);
    const { map: egMonthly }  = _pylMonthlyByCat(DB.transacciones, 'Egreso',  year, monthsRange);
    const incCatsM = [...new Set(Object.keys(incMonthly))].sort((a,b)=>{
      const ta=sumMonto(incMonthly[a]), tb=sumMonto(incMonthly[b]); return tb-ta;
    });
    const egCatsM = [...new Set(Object.keys(egMonthly))].sort((a,b)=>{
      const ta=sumMonto(egMonthly[a]), tb=sumMonto(egMonthly[b]); return tb-ta;
    });
    monthly = { months, mesLabels, incMonthly, egMonthly, incCatsM, egCatsM };
  }

  return {
    period, year, pLabel: `${pLabels[period]}${period!=='all'?` · ${year}`:''}`, from, to,
    prevInfo, prevLabel, prevFrom, prevTo,
    incMap, egMap, prevIncMap, prevEgMap, ti, te, prevTi, prevTe, neto, prevNeto,
    budgetMap, prorate, incCats, egCats, monthly,
  };
}

function renderPyL() {
  const years  = _yearsIn(DB.transacciones);
  const year   = el('pyl-year')?.value || (years.includes(DB.config?.year) ? DB.config.year : years[0]);
  const period = el('pyl-period')?.value || 'all';
  const c = DB.config||{};
  const d = _pylCompute(period, year, _pylView);

  _pylDrillCtx = { trans: filterByPeriod(DB.transacciones, period, year), label: d.pLabel };

  const varBadge = (val, prevVal) => {
    if (!d.prevInfo) return '';
    if (!prevVal) return val>0 ? '<td class="ap">▲ nuevo</td>' : '<td class="au">—</td>';
    const vp = (val-prevVal)/prevVal*100;
    return `<td class="${vp>=0?'ap':'an'}">${vp>=0?'▲':'▼'} ${Math.abs(vp).toFixed(1)}%</td>`;
  };

  function incRow(cat) {
    const val = d.incMap[cat]||0, prevVal = d.prevIncMap[cat]||0;
    const pct = d.ti ? (val/d.ti*100) : 0;
    return `<tr>
      <td><a href="javascript:void(0)" onclick="pylDrill('${_jsStr(cat)}','Ingreso','${d.from||''}','${d.to||''}','${_jsStr(d.pLabel)}')" class="pyl-link">${esc(cat)}</a></td>
      <td class="ap">${fmt(val)}</td>
      <td class="au">${pct.toFixed(1)}%</td>
      ${d.prevInfo ? `<td class="au">${fmt(prevVal)}</td>${varBadge(val,prevVal)}` : ''}
    </tr>`;
  }
  function egRow(cat) {
    const val = d.egMap[cat]||0, prevVal = d.prevEgMap[cat]||0;
    const pct = d.te ? (val/d.te*100) : 0;
    const budget = d.budgetMap[cat]!=null ? d.budgetMap[cat]*d.prorate : null;
    const pctB = budget ? (val/budget*100) : null;
    return `<tr>
      <td><a href="javascript:void(0)" onclick="pylDrill('${_jsStr(cat)}','Egreso','${d.from||''}','${d.to||''}','${_jsStr(d.pLabel)}')" class="pyl-link">${esc(cat)}</a></td>
      <td class="an">${fmt(val)}</td>
      <td class="au">${pct.toFixed(1)}%</td>
      ${d.prevInfo ? `<td class="au">${fmt(prevVal)}</td>${varBadge(val,prevVal)}` : ''}
      <td class="au">${budget!=null?fmt(budget):'—'}</td>
      <td class="${pctB==null?'au':(pctB>=90?'an':'ap')}">${pctB==null?'—':pctB.toFixed(1)+'%'}</td>
    </tr>`;
  }

  const prevCols = d.prevInfo ? `<th>${esc(d.prevLabel)}</th><th>Var %</th>` : '';

  const resumenHTML = `
    <div class="pyl-card" style="margin-bottom:16px">
      <div class="pl-header">📥 INGRESOS</div>
      <div class="tw"><table>
        <thead><tr><th>Categoría</th><th>Monto</th><th>% del Total</th>${prevCols}</tr></thead>
        <tbody>${d.incCats.length ? d.incCats.map(incRow).join('') : '<tr><td colspan="6" style="text-align:center;padding:16px;color:var(--muted)">Sin ingresos en este período</td></tr>'}</tbody>
        <tfoot><tr class="totals-row"><td>TOTAL INGRESOS</td><td class="ap">${fmt(d.ti)}</td><td>100.0%</td>${d.prevInfo?`<td>${fmt(d.prevTi)}</td>${varBadge(d.ti,d.prevTi)}`:''}</tr></tfoot>
      </table></div>
    </div>
    <div class="pyl-card" style="margin-bottom:16px">
      <div class="pl-header">📤 GASTOS</div>
      <div class="tw"><table>
        <thead><tr><th>Categoría</th><th>Monto</th><th>% del Total</th>${prevCols}<th>Presupuesto${d.prorate<1?' (prorrateado)':''}</th><th>% Ejecutado</th></tr></thead>
        <tbody>${d.egCats.length ? d.egCats.map(egRow).join('') : '<tr><td colspan="7" style="text-align:center;padding:16px;color:var(--muted)">Sin gastos en este período</td></tr>'}</tbody>
        <tfoot><tr class="totals-row"><td>TOTAL GASTOS</td><td class="an">${fmt(d.te)}</td><td>100.0%</td>${d.prevInfo?`<td>${fmt(d.prevTe)}</td>${varBadge(d.te,d.prevTe)}`:''}<td colspan="2"></td></tr></tfoot>
      </table></div>
    </div>`;

  function monthlyTable(heading, cats, monthly, cls) {
    const rows = cats.map(cat => {
      const vals = monthly[cat];
      const tot = sumMonto(vals);
      return `<tr>
        <td><a href="javascript:void(0)" onclick="pylDrill('${_jsStr(cat)}','${heading==='📥 INGRESOS'?'Ingreso':'Egreso'}','${year}-${String(d.monthly.months[0]).padStart(2,'0')}-01','${year}-${String(d.monthly.months[d.monthly.months.length-1]).padStart(2,'0')}-31','${_jsStr(d.pLabel)}')" class="pyl-link">${esc(cat)}</a></td>
        ${vals.map((v,i)=>`<td class="${cls} pyl-month-cell" ${v?`onclick="pylDrillMonth('${_jsStr(cat)}','${heading==='📥 INGRESOS'?'Ingreso':'Egreso'}','${year}','${d.monthly.months[i]}')"`:''}>${v?fmt(v):'—'}</td>`).join('')}
        <td class="${cls}" style="font-weight:700">${fmt(tot)}</td>
      </tr>`;
    }).join('');
    const colTotals = d.monthly.months.map((m,i) => sumMonto(cats.map(cat => monthly[cat][i]||0)));
    const grandTotal = sumMonto(colTotals);
    return `<div class="pyl-card" style="margin-bottom:16px">
      <div class="pl-header">${heading}</div>
      <div class="tw"><table>
        <thead><tr><th>Categoría</th>${d.monthly.mesLabels.map(m=>`<th>${m}</th>`).join('')}<th>Total</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="${d.monthly.months.length+2}" style="text-align:center;padding:16px;color:var(--muted)">Sin movimientos</td></tr>`}</tbody>
        <tfoot><tr class="totals-row"><td>TOTAL</td>${colTotals.map(v=>`<td class="${cls}">${fmt(v)}</td>`).join('')}<td class="${cls}">${fmt(grandTotal)}</td></tr></tfoot>
      </table></div>
    </div>`;
  }

  const mensualHTML = d.monthly ? `
    ${monthlyTable('📥 INGRESOS', d.monthly.incCatsM, d.monthly.incMonthly, 'ap')}
    ${monthlyTable('📤 GASTOS', d.monthly.egCatsM, d.monthly.egMonthly, 'an')}
    <p style="font-size:11px;color:var(--muted);margin:-8px 0 16px">💡 Clic en una categoría abre todo el rango mostrado · clic en un mes específico abre solo ese mes.</p>` : '';

  _setModHTML(`
    <div class="filter-bar mb16">

// ── Export: same computed data feeds Excel and PDF, so both match the screen ──
function _pylBuildReportData() {
  const years  = _yearsIn(DB.transacciones);
  const year   = el('pyl-year')?.value || (years.includes(DB.config?.year) ? DB.config.year : years[0]);
  const period = el('pyl-period')?.value || 'all';
  const d = _pylCompute(period, year, _pylView);
  const subtitle = `${d.pLabel}${d.prevInfo?` · vs. ${d.prevLabel}`:''}`;

  if (_pylView === 'resumen') {
    const incCols = ['Categoría','Monto','% del Total', ...(d.prevInfo?[d.prevLabel,'Var %']:[])];
    const incRows = d.incCats.map(cat => {
      const val=d.incMap[cat]||0, prevVal=d.prevIncMap[cat]||0, pct=d.ti?val/d.ti*100:0;
      const row = [cat, fmt(val), pct.toFixed(1)+'%'];
      if (d.prevInfo) row.push(fmt(prevVal), prevVal?(((val-prevVal)/prevVal*100).toFixed(1)+'%'):'—');
      return row;
    });
    const incTotals = ['TOTAL INGRESOS', fmt(d.ti), '100.0%', ...(d.prevInfo?[fmt(d.prevTi),'']:[])];

    const egCols = ['Categoría','Monto','% del Total', ...(d.prevInfo?[d.prevLabel,'Var %']:[]), `Presupuesto${d.prorate<1?' (prorrateado)':''}`, '% Ejecutado'];
    const egRows = d.egCats.map(cat => {
      const val=d.egMap[cat]||0, prevVal=d.prevEgMap[cat]||0, pct=d.te?val/d.te*100:0;
      const budget = d.budgetMap[cat]!=null?d.budgetMap[cat]*d.prorate:null;
      const row = [cat, fmt(val), pct.toFixed(1)+'%'];
      if (d.prevInfo) row.push(fmt(prevVal), prevVal?(((val-prevVal)/prevVal*100).toFixed(1)+'%'):'—');
      row.push(budget!=null?fmt(budget):'—', budget?((val/budget*100).toFixed(1)+'%'):'—');
      return row;
    });
    const egTotals = ['TOTAL GASTOS', fmt(d.te), '100.0%', ...(d.prevInfo?[fmt(d.prevTe),'']:[]), '', ''];

    return { title:'Estado de Resultados', subtitle, sections:[
      { heading:'INGRESOS', columns:incCols, rows:incRows, totalsRow:incTotals },
      { heading:'GASTOS', columns:egCols, rows:egRows, totalsRow:egTotals },
      { heading:'RESUMEN', columns:['','Monto'], rows:[['Total Ingresos',fmt(d.ti)],['Total Gastos',fmt(d.te)]], totalsRow:['SUPERÁVIT / DÉFICIT NETO', fmt(d.neto)] },
    ]};
  }

  // mensual view
  const cols = m => ['Categoría', ...d.monthly.mesLabels, 'Total'];
  const rowsFor = (cats, map) => cats.map(cat => [cat, ...d.monthly.months.map((mm,i)=>fmt(map[cat][i]||0)), fmt(sumMonto(map[cat]))]);
  const totalsFor = (cats, map) => {
    const colTotals = d.monthly.months.map((m,i)=>sumMonto(cats.map(c => map[c][i]||0)));
    return ['TOTAL', ...colTotals.map(fmt), fmt(sumMonto(colTotals))];
  };
  return { title:'Estado de Resultados — Desglose Mensual', subtitle, sections:[
    { heading:'INGRESOS', columns:cols(), rows:rowsFor(d.monthly.incCatsM, d.monthly.incMonthly), totalsRow:totalsFor(d.monthly.incCatsM, d.monthly.incMonthly) },
    { heading:'GASTOS', columns:cols(), rows:rowsFor(d.monthly.egCatsM, d.monthly.egMonthly), totalsRow:totalsFor(d.monthly.egCatsM, d.monthly.egMonthly) },
  ]};
}
function exportPyLXLSX() {
  if (!requirePerm('exportarDatos','Exportar datos')) return;
  if (typeof XLSX === 'undefined') { showToast('Librería Excel no cargada','err'); return; }
  const rep = _pylBuildReportData();
  const wb = XLSX.utils.book_new();
  rep.sections.forEach(sec => {
    const aoa = [sec.columns, ...sec.rows];
    if (sec.totalsRow) aoa.push(sec.totalsRow);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), sec.heading.slice(0,31));
  });
  XLSX.writeFile(wb, `${_reportFilename(['Estado de Resultados', today()])}.xlsx`);
  showToast('✔ Excel exportado');

  if (!requirePerm('exportarDatos','Exportar datos')) return;

function renderBalance() {
  ensureCuentas();
  const fechaVal = el('bal-fecha')?.value || today();
  const c = DB.config||{};

  function section(tipo) {
    const list = DB.cuentas.filter(c=>c.tipo===tipo).sort((a,b)=>a.codigo.localeCompare(b.codigo));
    let total = 0;
    const rows = list.map(cu => { const s=getSaldo(cu.codigo, fechaVal); total+=s; return [cu.codigo, cu.nombre, s]; });
    const html = rows.map(([codigo,nombre,s]) => `<div class="pl-row"><span class="pln"><span class="cuenta-code" style="margin-right:5px">${codigo}</span>${nombre}</span><span class="pla">${fmt(s)}</span></div>`).join('');
    return { html, total, rows };
  }
  const activo=section('Activo'), pasivo=section('Pasivo'), patrim=section('Patrimonio');
  // V11: "utilidad" (retained earnings to date) now respects the as-of date
  // too — income/expenses recorded after the selected cut-off shouldn't
  // count toward the balance sheet snapshot on that date.
  const ing=sumMonto(DB.transacciones.filter(t=>t.tipo==='Ingreso' && t.fecha<=fechaVal), 'monto');
  const eg =sumMonto(DB.transacciones.filter(t=>t.tipo==='Egreso'  && t.fecha<=fechaVal), 'monto');
  const utilidad = ing-eg;
  const totalPP  = pasivo.total + patrim.total + utilidad;
  const diff     = Math.abs(activo.total - totalPP);

  // ── EFECTIVO Y BANCOS: "where is the money, physically" ──
  // Caja + every active bank account, each read straight off its own GL
  // code — this is what answers "how much is in the bank vs. in the
  // drawer" directly, separate from which Fondo it's earmarked for.
  const caja = getSaldo('1001', fechaVal);
  const bancosActivos = (DB.bancos||[]).filter(b => b.estado === 'Activo');
  const bancosRows = bancosActivos.map(b => {
    const s = getSaldo(b.cuenta || '1002', fechaVal);
    return `<div class="pl-row"><span class="pln">🏦 ${esc(b.nombre)} <span style="color:var(--muted);font-size:11px">(${esc(b.banco||'')})</span></span><span class="pla">${fmt(s)}</span></div>`;
  }).join('');
  const totalBancos = sumMonto(bancosActivos, b => getSaldo(b.cuenta || '1002', fechaVal));
  const totalEfectivoBancos = caja + totalBancos;

  // ── FONDOS: "what is the money earmarked for" — same cash pool, just
  // sliced a different way. Total should reconcile with Efectivo y Bancos
  // above (both describe the same money) unless some has moved into fixed
  // assets (propiedad, equipo) or unassigned account balances.
  const fondosActivos = (DB.fondos||[]).filter(f => f.activo !== false);
  const fondosRows = fondosActivos.map(f => {
    const s = fundBalance(f, fechaVal);
    return `<div class="pl-row"><span class="pln">🎯 ${esc(f.nombre)}</span><span class="pla">${fmt(s)}</span></div>`;
  }).join('');
  const totalFondos = sumMonto(fondosActivos, f => fundBalance(f, fechaVal));
  const fondosDiff = Math.abs(totalEfectivoBancos - totalFondos);

  _balanceCtx = { fechaVal, activo, pasivo, patrim, utilidad, totalPP, diff };

  _setModHTML(`
    <div class="filter-bar mb16">
      <label>Al:</label>
      <input type="date" id="bal-fecha" value="${fechaVal}" onchange="renderBalance()" style="background:var(--navy);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:12px;outline:none">
      <button class="btn btn-outline btn-sm no-print" onclick="exportBalanceXLSX()">📊 Excel</button>
      <button class="btn btn-outline btn-sm no-print" onclick="exportBalancePDF()">📄 PDF</button>
      <button class="btn btn-outline btn-sm no-print" onclick="window.print()">🖨 Imprimir</button>
    </div>
    <div class="pyl-card" style="margin-bottom:16px">
      <div class="pl-header">💵 EFECTIVO Y BANCOS — dónde está el dinero</div>
      <div class="pl-row"><span class="pln">💰 Caja / Efectivo</span><span class="pla">${fmt(caja)}</span></div>
      ${bancosRows || '<div class="pl-row"><span class="pln" style="color:var(--muted)">Sin cuentas bancarias activas</span><span class="pla">—</span></div>'}
      <div class="pl-sub"><span class="pln">TOTAL EFECTIVO Y BANCOS</span><span class="pla ap">${fmt(totalEfectivoBancos)}</span></div>
    </div>
    <div class="pyl-card" style="margin-bottom:16px">
      <div class="pl-header">🎯 FONDOS — para qué está destinado</div>
      ${fondosRows || '<div class="pl-row"><span class="pln" style="color:var(--muted)">Sin fondos configurados</span><span class="pla">—</span></div>'}
      <div class="pl-sub"><span class="pln">TOTAL FONDOS</span><span class="pla ap">${fmt(totalFondos)}</span></div>
      <div style="font-size:11px;color:${fondosDiff<1?'var(--muted)':'#f07070'};margin-top:6px">
        ${fondosDiff<1
          ? 'Coincide con el Efectivo y Bancos de arriba: es el mismo dinero, solo dividido por destino.'
          : `⚠ Difiere de Efectivo y Bancos por ${fmt(fondosDiff)} — revisa depósitos sin confirmar o transacciones sin fondo asignado.`}
      </div>
    </div>
    <div class="pyl-card">
      <div class="pyl-church"><div style="font-size:26px;margin-bottom:4px">✝</div><h3>${c.name||'Iglesia'}</h3><p>Balance General al ${fechaVal}</p></div>
      <div class="balance-col">
        <div>
          <div class="pl-header">ACTIVOS</div>${activo.html}
          <div class="pl-sub"><span class="pln">TOTAL ACTIVOS</span><span class="pla ap">${fmt(activo.total)}</span></div>
        </div>
        <div>
          <div class="pl-header">PASIVOS</div>${pasivo.html}
          <div class="pl-sub"><span class="pln">TOTAL PASIVOS</span><span class="pla an">${fmt(pasivo.total)}</span></div>
          <div class="pl-header" style="margin-top:16px">PATRIMONIO</div>${patrim.html}
          <div class="pl-row"><span class="pln">Superávit del Período</span><span class="pla ${utilidad>=0?'ap':'an'}">${fmt(utilidad)}</span></div>
          <div class="pl-sub"><span class="pln">TOTAL PAS. + PATRIM.</span><span class="pla ${totalPP>=0?'ap':'an'}">${fmt(totalPP)}</span></div>
        </div>
      </div>
      <div class="pl-total" style="color:${diff<1?'#5dd49a':'#f07070'}">
        <span>BALANCE ${diff<1?'✔ CUADRADO':'⚠ DESCUADRADO'}</span>
        <span>Diferencia: ${fmt(diff)}</span>
      </div>
    </div>`);
}

// ============================================================
// BALANCE DE COMPROBACIÓN (Trial Balance / chequeo de integridad)
// ============================================================
// One-click check that every account's debits net against its credits
// across the whole ledger, and that every journal entry actually posts to
// accounts that exist in the catálogo. Since generateJournal() always sets
// debe=haber=monto per entry (true double-entry by construction), the
// grand totals will always match UNLESS an entry's drCod/crCod points at a
// código that isn't in DB.cuentas (a typo'd or deleted account) — that's
// the real failure mode this catches, surfaced as "asientos huérfanos".
function _comprobacionCompute() {
  generateJournal();
  ensureCuentas();
  const byCuenta = {}; // codigo -> {debe,haber}
  const huerfanos = []; // journal entries whose drCod or crCod isn't a real cuenta

  (DB.journal||[]).forEach(j => {
    const drOk = DB.cuentas.some(c => c.codigo === j.drCod);
    const crOk = DB.cuentas.some(c => c.codigo === j.crCod);
    if (!drOk || !crOk) huerfanos.push({ ...j, drOk, crOk });
    if (!byCuenta[j.drCod]) byCuenta[j.drCod] = { debe:0, haber:0 };
    if (!byCuenta[j.crCod]) byCuenta[j.crCod] = { debe:0, haber:0 };
    byCuenta[j.drCod].debe  += j.monto;
    byCuenta[j.crCod].haber += j.monto;
  });

  const rows = DB.cuentas
    .map(c => {
      const t = byCuenta[c.codigo] || { debe:0, haber:0 };
      const saldo = c.normal === 'Débito' ? (t.debe - t.haber) : (t.haber - t.debe);
      return { codigo:c.codigo, nombre:c.nombre, tipo:c.tipo, debe:t.debe, haber:t.haber, saldo };
    })
    .filter(r => r.debe > 0 || r.haber > 0)
    .sort((a,b) => a.codigo.localeCompare(b.codigo));

  // Any código referenced by the journal but NOT in the catálogo at all —
  // shows up in byCuenta but has no matching DB.cuentas row above.
  const knownCodes = new Set(DB.cuentas.map(c=>c.codigo));
  Object.keys(byCuenta).forEach(cod => {
    if (!knownCodes.has(cod)) {
      const t = byCuenta[cod];
      rows.push({ codigo:cod, nombre:'⚠ Cuenta no encontrada en el catálogo', tipo:'—', debe:t.debe, haber:t.haber, saldo:t.debe-t.haber });
    }
  });

  const totalDebe  = sumMonto(rows, 'debe');
  const totalHaber = sumMonto(rows, 'haber');
  const balanced = Math.abs(totalDebe - totalHaber) < 0.005 && !huerfanos.length;
  return { rows, totalDebe, totalHaber, huerfanos, balanced };
}
function renderComprobacion() {
  const r = _comprobacionCompute();
  _setModHTML(`
    <div class="sg">
      <div class="sc ${r.balanced?'green':'red'}"><div class="si">${r.balanced?'✅':'⚠'}</div><div class="sl">Estado</div><div class="sv">${r.balanced?'Cuadrado':'Con Problemas'}</div></div>
      <div class="sc blue"><div class="si">📥</div><div class="sl">Total Débitos</div><div class="sv">${fmt(r.totalDebe)}</div></div>
      <div class="sc gold"><div class="si">📤</div><div class="sl">Total Créditos</div><div class="sv">${fmt(r.totalHaber)}</div></div>
      <div class="sc ${Math.abs(r.totalDebe-r.totalHaber)<0.005?'green':'red'}"><div class="si">Δ</div><div class="sl">Diferencia</div><div class="sv">${fmt(r.totalDebe-r.totalHaber)}</div></div>
    </div>
    <div class="card" style="margin-bottom:20px">
      <div class="ch"><div class="ct">✅ Balance de Comprobación por Cuenta</div>

        </div>
      </div>
      <div class="tw"><table>
        <thead><tr><th>Código</th><th>Cuenta</th><th>Tipo</th><th class="tr">Débito</th><th class="tr">Crédito</th><th class="tr">Saldo</th></tr></thead>
        <tbody>${r.rows.map(row => `
          <tr>
            <td><span class="cuenta-code">${row.codigo}</span></td><td>${esc(row.nombre)}</td><td style="color:var(--muted);font-size:11px">${esc(row.tipo)}</td>

function _comprobacionReportData() {

function exportComprobacionXLSX() {
  if (!requirePerm('exportarDatos','Exportar datos')) return;
  if (typeof XLSX === 'undefined') { showToast('Librería Excel no cargada','err'); return; }
  const rep = _comprobacionReportData();
  const wb = XLSX.utils.book_new();
  rep.sections.forEach(sec => {
    const aoa = [sec.columns, ...sec.rows];
    if (sec.totalsRow) aoa.push(sec.totalsRow);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), sec.heading.slice(0,31));
  });
  XLSX.writeFile(wb, `${_reportFilename(['Balance de Comprobacion', today()])}.xlsx`);
  showToast('✔ Excel exportado');
}
function exportComprobacionPDF() {
  if (!requirePerm('exportarDatos','Exportar datos')) return;
  const rep = _comprobacionReportData();
  exportPDFReport(`${_reportFilename(['Balance de Comprobacion', today()])}.pdf`, rep.title, rep.subtitle, rep.sections);

// Resizes/re-encodes the uploaded image client-side (max 320px on the long
// edge, PNG) before storing it as a data URL in DB.config.logo — the whole
// DB round-trips through localStorage as one JSON blob, so an unbounded
// photo-sized upload here would bloat every save/load and every export.
function handleLogoUpload(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('⚠ Selecciona un archivo de imagen válido.', 'err'); return; }
  if (file.size > 5*1024*1024) { showToast('⚠ La imagen es muy grande (máx. 5MB).', 'err'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 320;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      DB.config = DB.config || {};
      DB.config.logo = canvas.toDataURL('image/png');
      if (saveDB()) { showToast('✔ Logo actualizado'); applyChurchName(); renderConfigIglesia(); }
    };
    img.onerror = () => showToast('⚠ No se pudo leer la imagen.', 'err');
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function removeLogo() {
  showConfirm('¿Quitar el logo?', 'Se eliminará de la barra superior, reportes/impresiones y declaraciones de donación.', 'Quitar', () => {
    DB.config = DB.config || {};

// True if any financial record still references this value — used to block deletion
// (renaming/deactivating never touches historical records; only a straight delete could
// orphan them, so deletion itself is what we guard).
function _isNameInUse(fieldName, nombre, collections) {
  collections = collections || ['diezmos','ofrendas','donaciones','gastos','depositos','ventas','eventos','otrosIngresos','transacciones'];
  return collections.some(k => (DB[k]||[]).some(r => Array.isArray(r[fieldName]) ? r[fieldName].includes(nombre) : r[fieldName] === nombre));
}

function addConfigItem(listKey, inputId) {
  const input = el(inputId);
  const nombre = (input?.value || '').trim();
  if (!nombre) { showToast('Escribe un nombre primero', 'err'); return; }
  const list = DB.settings[listKey];
  if (list.some(it => it.nombre.toLowerCase() === nombre.toLowerCase())) {
    showToast('Ya existe un elemento con ese nombre', 'err'); return;
  }
  const nextLocalId = list.reduce((m,it) => Math.max(m, it.id), 0) + 1;
  list.push({id: nextLocalId, nombre, activo: true});
  if (saveDB()) { showToast('✔ Agregado'); renderConfigListasView(); }
}

function toggleConfigItem(listKey, id) {
  const it = (DB.settings[listKey]||[]).find(x => x.id === id);
  if (!it) return;
  it.activo = !it.activo;
  if (saveDB()) { showToast(it.activo ? '✔ Activado' : '✔ Desactivado'); renderConfigListasView(); }
}

function renameConfigItem(listKey, id, newName) {
  const it = (DB.settings[listKey]||[]).find(x => x.id === id);
  if (!it) return;
  const nombre = (newName||'').trim();
  if (!nombre || nombre === it.nombre) { renderConfigListasView(); return; } // no-op, just re-render to discard invalid edits
  const dupe = DB.settings[listKey].some(x => x.id !== id && x.nombre.toLowerCase() === nombre.toLowerCase());
  if (dupe) { showToast('Ya existe un elemento con ese nombre', 'err'); renderConfigListasView(); return; }
  it.nombre = nombre;
  // Note: existing historical records keep their original stored value — renaming a
  // configured option is forward-only and never rewrites past financial records.
  if (saveDB()) { showToast('✔ Renombrado'); renderConfigListasView(); }
}

const CONFIG_LIST_COLLECTIONS = {
  rolesMiembro:   ['miembros'],
  estadosMiembro: ['miembros'],
  ministerios:    ['miembros'],
};

function deleteConfigItem(listKey, id, fieldName) {
  const it = (DB.settings[listKey]||[]).find(x => x.id === id);
  if (!it) return;
  if (_isNameInUse(fieldName, it.nombre, CONFIG_LIST_COLLECTIONS[listKey])) {
    showToast('⚠ No se puede eliminar: hay registros que lo usan. Desactívalo en su lugar.', 'err');
    return;
  }
  showConfirm(`¿Eliminar "${it.nombre}"?`, 'Esta acción no se puede deshacer.', 'Eliminar', () => {
    DB.settings[listKey] = DB.settings[listKey].filter(x => x.id !== id);
    if (saveDB()) { showToast('✔ Eliminado'); renderConfigListasView(); }
  }, 'danger');
}

// Forward-only merge: re-adds any default fund / cuenta / list item missing
// from DB.fondos / DB.cuentas / DB.settings.*, matched by name (or codigo for
// cuentas) so nothing already there is ever duplicated or overwritten — and
// nothing outside those catalogs (transactions, members, etc.) is touched.
function restoreDefaultCatalogs() {
  let added = 0;
  SEED.fondos.forEach(sf => {
    if (!(DB.fondos||[]).some(f => f.nombre === sf.nombre)) { DB.fondos.push({...sf, id: nextId()}); added++; }
  });
  DEFAULT_CUENTAS.forEach(sc => {
    if (!(DB.cuentas||[]).some(c => c.codigo === sc.codigo)) { DB.cuentas.push({...sc}); added++; }
  });
  ['servicios','metodosPago','rolesMiembro','estadosMiembro','ministerios'].forEach(key => {
    (SEED.settings[key]||[]).forEach(si => {
      if (!(DB.settings[key]||[]).some(it => it.nombre.toLowerCase() === si.nombre.toLowerCase())) {

  }
}

const ROLE_PERMISOS_DEFAULT = {
  Administrador: Object.fromEntries(PERM_KEYS.map(p => [p.key, true])),
  Tesorero: {

// ── RECOVERY CODE (V18) ──────────────────────────────────────────────

// shown to the admin exactly once, and never stored anywhere except as a
// salted hash (same as the password/PIN). Whoever holds the code can reset
// access without needing email or the security question, which is exactly
// the "don't let me get locked out and have to wipe the app" safety net
// requested — without hard-coding any actual password into the file.
function _genRecoveryCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O or 1/I confusion
  const rnd = () => {
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
      const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0];
    }
    return Math.floor(Math.random() * 4294967296);
  };
  let code = '';
  for (let g = 0; g < 3; g++) {
    if (g) code += '-';
    for (let i = 0; i < 4; i++) code += chars[rnd() % chars.length];
  }

function _saveForceCreds(userId) {
  const u = (DB.usuarios||[]).find(x => x.id === userId);
  const err = m => { const e = el('fc-err'); if (e) e.textContent = '⚠ ' + m; };
  if (!u) return;
  const usuario = (el('fc-usuario')?.value||'').trim();
  const pass    = el('fc-pass')?.value||'';
  const pass2   = el('fc-pass2')?.value||'';
  const pin     = (el('fc-pin')?.value||'').trim();
  if (!usuario) return err('Ingresa un nombre de usuario.');
  if ((DB.usuarios||[]).some(x => x.id !== u.id && x.usuario.toLowerCase() === usuario.toLowerCase())) return err('Ese usuario ya existe.');
  if (pass.length < 4) return err('La contraseña debe tener al menos 4 caracteres.');
  if (pass === 'admin') return err('Elige una contraseña distinta a la de fábrica.');
  if (pass !== pass2) return err('Las contraseñas no coinciden.');
  if (!/^\d{4,6}$/.test(pin)) return err('El PIN debe ser de 4 a 6 dígitos.');
  if (pin === '0000') return err('Elige un PIN distinto al de fábrica (0000).');
  u.usuario = usuario;
  u.passSalt = _genSalt(); u.passHash = _hashSecret(pass, u.passSalt);
  u.pinSalt  = _genSalt(); u.pinHash  = _hashSecret(pin, u.pinSalt);
  u.mustChangeCreds = false;
  saveDB();
  _authSession.userName = u.nombre;
  // Show a one-time recovery code before landing in the app — this is the
  // "don't let me get locked out" safety net, generated fresh right when
  // real credentials replace the factory defaults.
  const code = _genRecoveryCode();
  u.recoverySalt = _genSalt();
  u.recoveryCodeHash = _hashSecret(code, u.recoverySalt);
  saveDB();
  _showRecoveryCodeOnce(u, code, () => {
    el('topbar').style.display = '';
    el('logout-btn').style.display = 'inline-flex';
    applyChurchName();
    _refreshUsername();
    showToast('✔ Acceso actualizado. ¡Bienvenido!');

    _startPendingPoll();
    _resetIdleTimer();
    _startAutoBackupTimer();
    _refreshBackupIndicator();
  });
  return;
}

// ── AUTO-LOGOUT POR INACTIVIDAD (V15) ──────────────────────────────────
// Adjustable in Configuración → Preferencias (DB.config.autoLogoutMinutes,
// default 5). A warning banner appears ~1 minute before the cutoff; clicking
// it (or any mouse/keyboard/touch activity) resets the full timer. Logging
// out this way skips the "¿Cerrar sesión?" confirmation since it's automatic.
let _idleTimer = null, _idleWarnTimer = null, _idleWarnEl = null;

function _autoLogoutMinutes() {
  const m = parseInt(DB.config?.autoLogoutMinutes, 10);
  return (m && m > 0) ? m : 5;
}
function _resetIdleTimer() {
  if (!_authSession.loggedIn) return;
  clearTimeout(_idleTimer);
  clearTimeout(_idleWarnTimer);
  _hideIdleWarning();
  const totalMs = _autoLogoutMinutes() * 60000;
  const warnMs = Math.max(totalMs - 60000, totalMs * 0.5);
  _idleWarnTimer = setTimeout(_showIdleWarning, warnMs);
  _idleTimer = setTimeout(_performAutoLogout, totalMs);
}
function _stopIdleTimer() {
  clearTimeout(_idleTimer); clearTimeout(_idleWarnTimer);
  _hideIdleWarning();
}
function _showIdleWarning() {
  if (!_authSession.loggedIn || _idleWarnEl) return;
  _idleWarnEl = document.createElement('div');
  _idleWarnEl.id = '_idle-warn';
  _idleWarnEl.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99998;background:#3d2e0a;border-bottom:1px solid #e8a030;color:#f0b44f;padding:10px 16px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;font-family:sans-serif';
  _idleWarnEl.textContent = '⏱ Se cerrará la sesión por falta de actividad — haz clic aquí para continuar';
  _idleWarnEl.onclick = _resetIdleTimer;
  document.body.appendChild(_idleWarnEl);
}
function _hideIdleWarning() {
  if (_idleWarnEl) { _idleWarnEl.remove(); _idleWarnEl = null; }
}
function _performAutoLogout() {
  _hideIdleWarning();
  if (!_authSession.loggedIn) return;
  backupOnLogout();
  _stopAutoBackupTimer();
  _authSession = { loggedIn:false, userId:null, userName:null };
  renderLoginWall();
  showToast('🔒 Sesión cerrada por falta de actividad', 'warn');
}
['mousemove','mousedown','keydown','scroll','touchstart','click'].forEach(evt => {
  document.addEventListener(evt, () => { if (_authSession.loggedIn) _resetIdleTimer(); }, { passive:true });

// V11: generic fix for every "type-to-filter" search box in the app. Each
// one calls a full re-render on every keystroke (oninput), which destroys
// and recreates the <input> node — resetting the cursor to position 0 each
// time. That silently reverses what you type (8569 → 9658, same root cause
// already fixed in Conciliación) and, for the two inputs whose rebuilt HTML
// never re-applied value="..." at all (Miembros, Proveedores), wiped the box
// back to empty after every single character. This wraps any such handler:
// save the value + cursor position, let the render run (it still reads the
// input's current value itself, same as before), then restore both on the
// freshly-rebuilt node.
function _liveFilter(inputId, renderFn) {
  const inp = document.getElementById(inputId);
  const val = inp ? inp.value : '';
  const pos = inp ? inp.selectionStart : null;
  renderFn();
  const newInp = document.getElementById(inputId);
  if (newInp) {
    if (newInp.value !== val) newInp.value = val;
    newInp.focus();
    if (pos !== null) { try { newInp.setSelectionRange(pos, pos); } catch(e) {} }
  }
}

// Renders one logical line that may contain **bold** spans. Draws each
// **bold**/normal run as a single native doc.text() call whenever it fits
// on the remaining width — critical because chaining many separate
// per-word doc.text() calls (positioned via summed getTextWidth) visibly
// loses inter-word spacing on some PDF viewers/font substitutions (the
// small cumulative rounding drift is enough to make two adjacent words
// touch, e.g. "Yourfaithful"). Only when a run doesn't fit at all do we
// fall back to a word-by-word greedy fill — and even then each *line* of
// that fallback is still drawn as one combined string, never per-word, so
// the same touching-words bug can't happen there either. A run's leading
// space is consumed explicitly before the fit-check so it never gets
// silently dropped by the word-split fallback.
function _pdfRichLine(doc, text, x, y, maxWidth, lineHeight, size) {
  doc.setFontSize(size);
  const runs = (text||'').split(/(\*\*[^*]+\*\*)/g).filter(s => s !== '');
  let cx = x;
  runs.forEach(seg => {
    const bold = seg.startsWith('**') && seg.endsWith('**');
    let clean = bold ? seg.slice(2,-2) : seg;
    doc.setFont('helvetica', bold ? 'bold' : 'normal');
    while (clean.startsWith(' ')) {
      if (cx > x) cx += doc.getTextWidth(' ');
      clean = clean.slice(1);
    }
    while (clean.length) {
      const avail = x + maxWidth - cx;
      const fullWidth = doc.getTextWidth(clean);
      if (fullWidth <= avail) {
        doc.text(clean, cx, y);
        cx += fullWidth;
        clean = '';
      } else {
        const words = clean.split(' ');
        let fit = '';
        let i = 0;
        for (; i < words.length; i++) {
          const cand = fit + (fit ? ' ' : '') + words[i];
          if (doc.getTextWidth(cand) > avail && fit) break;
          fit = cand;
        }
        if (!fit) { fit = words[0]; i = 1; } // single word wider than the whole line — force it through
        doc.text(fit, cx, y);
        clean = words.slice(i).join(' ');
        cx = x; y += lineHeight;
      }
    }
  });
  return y + lineHeight;
}

// Centered letterhead (logo, church name, address — all centered), matching
// the app's other report headers. Optional: churches with pre-printed
// letterhead paper can turn this off — and since pre-printed stock varies
// in how much space its own header takes up, the blank top margin used in
// that case is adjustable (DB.config.letterHeaderMargin, points) instead of
// a fixed guess.
function _pdfLetterhead(doc, includeHeader, blankMargin, logoMode, title, subtitle) {
  const pw = doc.internal.pageSize.getWidth();
  if (!includeHeader) return blankMargin || 76;
  const c = DB.config||{};
  const cx = pw/2;
  const mode = _resolveLogoMode(logoMode, 'letterLogoMode');
  let y = 40;
  const drewLogo = _pdfDrawLogoArt(doc, cx, y+10, 26, mode);
  y += drewLogo ? 48 : 14; // extra clearance below the logo art so it never touches the name line
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(26,45,66);
  doc.text(c.name || 'Iglesia', cx, y, {align:'center'});
  y += 13;
  const addrLine = [c.dir, c.tel, c.email].filter(Boolean).join('   ·   ');
  if (addrLine) {
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(100,100,100);
    doc.text(addrLine, cx, y, {align:'center'});
    y += 10;
  }
  if (title) {
    y += 6;
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(26,45,66);
    doc.text(title, cx, y, {align:'center'});
    y += 12;
    if (subtitle) {
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(110,110,110);
      doc.text(subtitle, cx, y, {align:'center'});
      y += 10;
    }
  }
  y += 10;
  doc.setFillColor(122,20,20);
  doc.rect(0, y, pw, 6, 'F');
  return y + 30;
}

// ── Carta con Resumen (aggregated letter) ──────────────────────────────
function generateGivingStatementsPDF(reportYear, letterMonth, letterYear, onlyNames, blankMargin, logoMode) {
  if (!requirePerm('exportarDatos','Exportar datos')) return;
  if (typeof window.jspdf === 'undefined') { showToast('Librería PDF no cargada','err'); return; }
  const { names, donors } = _givingStatementData(reportYear);
  const selected = onlyNames || [...document.querySelectorAll('.gs-chk:checked')].map(c => c.value);
  const toGenerate = names.filter(n => selected.includes(n));
  if (!toGenerate.length) { showToast('⚠ Selecciona al menos un donante.','err'); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'letter' });
  const c = DB.config||{};
  const lang = c.letterLang || 'es';
  const isEN = lang === 'en';
  const includeHeader = c.letterIncludeHeader !== false;
  logoMode = logoMode || el('gs-logo')?.value || c.letterLogoMode;
  const template = _activeLetterTemplate();
  const fecha = isEN ? `${MESES_EN[letterMonth-1]} ${letterYear}` : `${MESES_ES[letterMonth-1]} de ${letterYear}`;

  toGenerate.forEach((name, i) => {
    if (i > 0) doc.addPage();
    const agg = _givingStatementAggregate(donors[name].items);
    const total = donors[name].total;

    const map = {
      fecha,
      donante: name,
      direccion_donante: _lookupDonorAddress(name) || (isEN ? '(not on file)' : '(no registrada)'),
      iglesia: c.name || (isEN ? 'the church' : 'la iglesia'),
      anio: reportYear,
      ein: c.ein || (isEN ? 'not on file' : 'no configurado'),
      pastor: c.pastor || '_______________________',
      tesorero: c.tesorero || '_______________________',
      total: fmt(total),
    };

    // [detalle] gets a real table, not text — split the template around it.
    const [rawBefore, rawAfter] = template.split('[detalle]');
    const before = _fillPlaceholders(rawBefore || '', map);
    const after  = _fillPlaceholders(rawAfter  || '', map);

    let y = _pdfLetterhead(doc, includeHeader, blankMargin, logoMode);

    doc.setTextColor(30,30,30);
    before.split('\n').forEach(line => {
      if (!line.trim()) { y += 8; return; }
      y = _pdfRichLine(doc, line, 40, y, 530, 13, 9.5);
    });

    y += 4;
    if (agg.length) {
      doc.autoTable({
        startY: y,
        head: [[isEN?'Contribution':'Contribución', isEN?'Amount':'Monto']],
        body: agg.map(a => [`${_translateTipo(a.tipo, isEN)} (${isEN?'Total for':'Total de'} ${reportYear})`, fmt(a.total)]),
        foot: [[isEN?'TOTAL':'TOTAL', fmt(total)]],
        theme: 'grid',
        margin: { left:40, right:40 },
        styles: { font:'helvetica', fontSize:9, textColor:[20,20,20], cellPadding:5 },
        headStyles: { fillColor:[26,45,66], textColor:[255,255,255], fontStyle:'bold', fontSize:8.5 },
        footStyles: { fillColor:[245,238,220], textColor:[20,20,20], fontStyle:'bold' },
        columnStyles: { 1: { halign:'right' } },
      });
      y = doc.lastAutoTable.finalY + 20;
    }

    doc.setTextColor(30,30,30);
    after.split('\n').forEach(line => {
      if (!line.trim()) { y += 8; return; }
      y = _pdfRichLine(doc, line, 40, y, 530, 13, 9.5);
    });
  });

  _pdfFooter(doc);
  const fname = toGenerate.length === 1
    ? _reportFilename(['Contribucion Anual', toGenerate[0], reportYear])
    : _reportFilename(['Contribucion Anual', reportYear]);
  doc.save(`${fname}.pdf`);
  showToast(`✔ ${toGenerate.length} declaración(es) generada(s)`);
}

// ── Declaración Detallada (restored V11-style itemized report) — every
// single Diezmo/Donación line for the year, not aggregated. Same donor
// selection, different output for when a full audit-style listing is
// wanted instead of the summary letter. ────────────────────────────────
function generateGivingStatementsDetailedPDF(reportYear, onlyNames, blankMargin, logoMode) {
  if (!requirePerm('exportarDatos','Exportar datos')) return;
  if (typeof window.jspdf === 'undefined') { showToast('Librería PDF no cargada','err'); return; }
  const { names, donors } = _givingStatementData(reportYear);
  const selected = onlyNames || [...document.querySelectorAll('.gs-chk:checked')].map(c => c.value);
  const toGenerate = names.filter(n => selected.includes(n));
  if (!toGenerate.length) { showToast('⚠ Selecciona al menos un donante.','err'); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'letter' });
  const c = DB.config||{};
  const includeHeader = c.letterIncludeHeader !== false;
  logoMode = logoMode || el('gs-logo')?.value || c.letterLogoMode;

  toGenerate.forEach((name, i) => {
    if (i > 0) doc.addPage();
    let y = _pdfLetterhead(doc, includeHeader, blankMargin, logoMode, 'Declaración Anual de Donaciones', `Año ${reportYear}${c.ein?' · EIN '+c.ein:''}`);
    y += 10;

    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(20,20,20);
    doc.text(`Estimado/a:`, 40, y); y += 16;
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(name, 40, y); y += 20;

    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(60,60,60);
    const intro = `A continuación un resumen de sus aportaciones a ${c.name||'la iglesia'} durante el año ${reportYear}, para sus registros fiscales.`;
    const introLines = doc.splitTextToSize(intro, 530);
    doc.text(introLines, 40, y); y += introLines.length*13 + 10;

    const rows = donors[name].items.map(it => [fmtDate(it.fecha), it.tipo, it.metodo||'—', it.ref||'—', fmt(it.monto)]);
    doc.autoTable({
      startY: y,
      head: [['Fecha','Tipo','Método','Ref.','Monto']],
      body: rows,
      foot: [['','','','TOTAL', fmt(donors[name].total)]],
      theme: 'grid',
      margin: { left:40, right:40 },
      styles: { font:'helvetica', fontSize:8.5, textColor:[20,20,20], cellPadding:4 },
      headStyles: { fillColor:[26,45,66], textColor:[255,255,255], fontStyle:'bold', fontSize:8 },
      footStyles: { fillColor:[245,238,220], textColor:[20,20,20], fontStyle:'bold' },
    });
    y = doc.lastAutoTable.finalY + 24;

    doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(90,90,90);
    const boilerplate = 'No se proporcionaron bienes ni servicios a cambio de estas contribuciones, excepto beneficios religiosos intangibles. Por favor conserve esta declaración para sus registros de impuestos.';
    const bpLines = doc.splitTextToSize(boilerplate, 530);
    doc.text(bpLines, 40, y); y += bpLines.length*11 + 24;

    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(20,20,20);
    doc.text('Atentamente,', 40, y); y += 30;
    doc.text(c.pastor || '_______________________', 40, y); y += 12;
    doc.setFontSize(8); doc.setTextColor(110,110,110);
    doc.text(c.name || 'Iglesia', 40, y);
  });

  _pdfFooter(doc);
  const fname = toGenerate.length === 1
    ? _reportFilename(['Reporte Diezmo', toGenerate[0], reportYear])
    : _reportFilename(['Reporte Diezmo', reportYear]);
  doc.save(`${fname}.pdf`);
  showToast(`✔ ${toGenerate.length} declaración(es) generada(s)`);
}

// ── DECLARACIONES DE DONACIÓN (V14) ─────────────────────────
// Diezmos (tied to a Miembro), Donaciones (tied to a free-text donante), and
// Pagos de Promesas (tied to a Miembro via su Promesa) can be attributed to
// a specific giver — Ofrendas is structurally anonymous in this app (no
// donor field at all), matching how many churches already treat undesignated
// offering-plate collections, so it's excluded from per-donor statements on
// purpose, not an oversight.
function _givingStatementData(year) {
  const donors = {}; // name -> { items:[{fecha,tipo,monto,metodo,ref}], total }
  const add = (name, item) => {
    if (!name) return;
    if (!donors[name]) donors[name] = { items: [], total: 0 };
    donors[name].items.push(item);
    donors[name].total += item.monto || 0;
  };
  (DB.diezmos||[]).filter(d => (d.fecha||'').startsWith(year+'-')).forEach(d => {
    add(d.miembro, { fecha:d.fecha, tipo:'Diezmo', monto:d.monto||0, metodo:d.metodo, ref:d.ref||d.sobre||'' });
  });
  (DB.donaciones||[]).filter(d => (d.fecha||'').startsWith(year+'-')).forEach(d => {
    add(d.donante, { fecha:d.fecha, tipo:`Donación${d.proposito?' — '+d.proposito:''}`, monto:d.monto||0, metodo:d.metodo, ref:d.recibo||'' });
  });
  // V17.2: Pagos de Promesas count toward a donor's annual giving statement
  // too — it's real money given to the church — even though it's tracked in
  // its own ledger, separate from Diezmos/Donaciones data entry.
  (DB.pagosPromesa||[]).filter(pg => (pg.fecha||'').startsWith(year+'-')).forEach(pg => {
    const promesa = (DB.promesas||[]).find(p => p.id == pg.promesaId);
    const miembro = promesa?.miembro || pg._miembroLabel;
    const campNombre = ((DB.campanas||[]).find(c => c.id == promesa?.campanaId))?.nombre || pg._campanaLabel;
    add(miembro, { fecha:pg.fecha, tipo:`Promesa${campNombre?' — '+campNombre:''}`, monto:pg.monto||0, metodo:pg.metodo, ref:pg.ref||'' });
  });
  const names = Object.keys(donors).sort((a,b) => a.localeCompare(b));
  names.forEach(n => donors[n].items.sort((a,b) => a.fecha.localeCompare(b.fecha)));
  return { names, donors };
}

function _setDonorAddress(name, value) {
  DB.donorAddresses = DB.donorAddresses || {};

}

        <div class="fgrp"><label>Contraseña ${u?'(dejar en blanco para no cambiar)':''}</label><input type="password" id="u-pass" placeholder="${u?'••••••':''}"></div>
        <div class="fgrp"><label>Pregunta de Seguridad (recuperación)</label>
          <select id="u-secq"><option value="">— No configurada —</option>${SECURITY_QUESTIONS.map(q=>`<option value="${esc(q)}" ${u?.secPregunta===q?'selected':''}>${esc(q)}</option>`).join('')}</select>
        </div>
        <div class="fgrp"><label>Respuesta ${u?.secRespuestaHash?'(dejar en blanco para no cambiar)':''}</label><input type="text" id="u-seca" placeholder="${u?.secRespuestaHash?'••••••':'Respuesta'}"></div>
        ${u ? `<div class="fgrp full"><label>Código de Recuperación</label>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:11px;color:var(--muted)">${u.recoveryCodeHash ? '✔ Configurado' : '— No configurado —'}</span>
            <button type="button" class="btn btn-outline btn-sm" onclick="regenerateRecoveryCode(${u.id})">🔑 ${u.recoveryCodeHash?'Generar Nuevo':'Generar'} Código</button>
          </div></div>` : ''}
        ${u ? `<div class="fgrp"><label>Fecha de Creación</label><input type="text" value="${fmtDate(u.fechaCreacion)}" disabled></div>
        <div class="fgrp"><label>Último Acceso</label><input type="text" value="${u.ultimoAcceso ? new Date(u.ultimoAcceso).toLocaleString('es-MX') : 'Nunca'}" disabled></div>` : ''}
        <div class="fgrp"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="u-activo" ${u?.activo!==false?'checked':''} style="width:auto"> Activo</label></div>
        <div class="fgrp full">
          <label>Permisos ${u?.rol==='Administrador'?'(Administrador siempre tiene acceso total)':'(ajusta según necesites — se inician con los del rol)'}</label>
          <div class="min-grid">
            ${PERM_KEYS.map(p => {
              const base = (u?.permisos) || ROLE_PERMISOS_DEFAULT[u?.rol||'Colaborador'] || {};
              const checked = u?.rol==='Administrador' ? true : !!base[p.key];
              return `<label class="min-chip"><input type="checkbox" class="perm-chk" value="${p.key}" ${checked?'checked':''} ${u?.rol==='Administrador'?'disabled':''}> ${esc(p.label)}</label>`;
            }).join('')}
          </div>
        </div>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="el('usr-form-slot').innerHTML=''">✕ Cancelar</button>
        <button class="btn btn-primary" onclick="_usrSave(${editingId||'null'})">💾 Guardar</button>
      </div>
    </div>`;
  slot.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function _usrRoleChanged() {
  const rol = el('u-rol').value;
  const defaults = ROLE_PERMISOS_DEFAULT[rol] || {};
  document.querySelectorAll('#usr-form-slot .perm-chk').forEach(chk => {
    if (rol === 'Administrador') { chk.checked = true; chk.disabled = true; }
    else { chk.disabled = false; chk.checked = !!defaults[chk.value]; }
  });
}
function _usrSave(editingId) {
  const nombre  = (el('u-nombre').value||'').trim();
  const usuario = (el('u-usuario').value||'').trim();
  const correo  = (el('u-correo').value||'').trim();
  const rol     = el('u-rol').value;
  const pin     = (el('u-pin').value||'').trim();
  const pass    = (el('u-pass').value||'').trim();
  const activo  = el('u-activo').checked;
  const secPregunta = el('u-secq')?.value || '';
  const secRespuesta = (el('u-seca')?.value || '').trim();
  const permisos = Object.fromEntries(PERM_KEYS.map(p => [p.key, rol==='Administrador' ? true : !!document.querySelector(`#usr-form-slot .perm-chk[value="${p.key}"]`)?.checked]));

  if (!nombre || !usuario) { showToast('⚠ Nombre y Usuario son obligatorios.', 'err'); return; }
  const dupe = (DB.usuarios||[]).some(x => x.id !== editingId && x.usuario.toLowerCase() === usuario.toLowerCase());
  if (dupe) { showToast('⚠ Ya existe un usuario con ese nombre de usuario.', 'err'); return; }
  if (pin && !/^\d{4,6}$/.test(pin)) { showToast('⚠ El PIN debe tener de 4 a 6 dígitos.', 'err'); return; }
  if (!editingId && !pin) { showToast('⚠ Asigna un PIN al crear el usuario.', 'err'); return; }
  if (!editingId && !pass) { showToast('⚠ Asigna una contraseña al crear el usuario.', 'err'); return; }
  if (pass && pass.length < 4) { showToast('⚠ La contraseña debe tener al menos 4 caracteres.', 'err'); return; }

  // Guard: never allow the last active Administrador to be deactivated —
  // that would lock everyone out of Usuarios itself.
  if (editingId && !activo) {
    const target = DB.usuarios.find(x => x.id === editingId);
    if (target?.rol === 'Administrador') {
      const otherActiveAdmins = DB.usuarios.some(x => x.id !== editingId && x.rol === 'Administrador' && x.activo);
      if (!otherActiveAdmins) { showToast('⚠ No puedes desactivar al único Administrador activo.', 'err'); return; }
    }
  }

  if (editingId) {
    const u = DB.usuarios.find(x => x.id === editingId);
    Object.assign(u, { nombre, usuario, correo, rol, activo, permisos, secPregunta });
    if (pin)  { u.pinSalt  = _genSalt(); u.pinHash  = _hashSecret(pin, u.pinSalt); }
    if (pass) { u.passSalt = _genSalt(); u.passHash = _hashSecret(pass, u.passSalt); }
    if (secRespuesta) { u.secRespuestaSalt = _genSalt(); u.secRespuestaHash = _hashSecret(secRespuesta.toLowerCase(), u.secRespuestaSalt); }
    _logAudit('Editar', 'usuarios', editingId, { usuario, nombre:`${nombre} — rol: ${rol}${activo?'':' (desactivado)'}` });
  } else {
    const pinSalt = _genSalt(), passSalt = _genSalt();
    const secRespuestaSalt = _genSalt();
    const newId = nextId();
    DB.usuarios.push({
      id: newId, nombre, usuario, correo, rol, activo, permisos, secPregunta,
      fechaCreacion: today(), ultimoAcceso: null,
      pinSalt, pinHash: _hashSecret(pin, pinSalt),
      passSalt, passHash: _hashSecret(pass, passSalt),
      secRespuestaSalt, secRespuestaHash: secRespuesta ? _hashSecret(secRespuesta.toLowerCase(), secRespuestaSalt) : '',
    });
    _logAudit('Crear', 'usuarios', newId, { usuario, nombre:`${nombre} — rol: ${rol}` });
  }
  if (saveDB()) { showToast('✔ Usuario guardado'); renderUsuarios(); }
}

function _usrToggleActivo(id) {
  const u = (DB.usuarios||[]).find(x => x.id === id);
  if (!u) return;
  if (u.activo && u.rol === 'Administrador') {
    const otherActiveAdmins = DB.usuarios.some(x => x.id !== id && x.rol === 'Administrador' && x.activo);
    if (!otherActiveAdmins) { showToast('⚠ No puedes desactivar al único Administrador activo.', 'err'); return; }
  }
  u.activo = !u.activo;
  if (saveDB()) { showToast(u.activo ? '✔ Activado' : '✔ Desactivado'); renderUsuarios(); }
}

function _usrDelete(id) {
  const u = (DB.usuarios||[]).find(x => x.id === id);
  if (!u) return;
  if (u.rol === 'Administrador') {
    const otherActiveAdmins = DB.usuarios.some(x => x.id !== id && x.rol === 'Administrador' && x.activo);
    if (!otherActiveAdmins) { showToast('⚠ No puedes eliminar al único Administrador activo.', 'err'); return; }
  }
  showConfirm(`¿Eliminar a "${u.nombre}"?`, 'Esta acción no se puede deshacer.', 'Eliminar', () => {
    DB.usuarios = DB.usuarios.filter(x => x.id !== id);
    if (saveDB()) { showToast('✔ Eliminado'); renderUsuarios(); }
  }, 'danger');
}

  el('hist-body').innerHTML = `
    <div class="sg" style="margin-bottom:16px">
      <div class="sc gold" style="padding:14px"><div class="sl">Total</div><div class="sv" style="font-size:18px">${fmt(total)}</div></div>
      <div class="sc green" style="padding:14px"><div class="sl">Registros</div><div class="sv" style="font-size:18px">${list.length}</div></div>
      <div class="sc blue" style="padding:14px"><div class="sl">Promedio</div><div class="sv" style="font-size:18px">${fmt(list.length?total/list.length:0)}</div></div>

      <thead><tr><th>Fecha</th><th>Sobre</th><th>Servicio</th><th>Método</th><th>Monto</th><th>Fondo</th></tr></thead>

        <tr>
          <td>${fmtDate(d.fecha)}</td>

          <td>${d.servicio}</td>

          <td class="ap">${fmt(d.monto)}</td>
          <td>${sb(d.fondo||'Fondo General')}</td>

}

// ============================================================
// HELPERS
// ============================================================
function clearFilter(ids, renderFn) {
  ids.forEach(id => { const e = el(id); if (e) e.value = ''; });
  if (renderFn) renderFn();
}

function esc(s) { return (s||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function _jsStr(s) { return (s||'').toString().replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function toggleTheme() {
  const light = document.body.classList.toggle('theme-light');
  localStorage.setItem('themePref', light ? 'light' : 'dark');
  _refreshThemeBtn();
}
function _refreshThemeBtn() {
  const btn = el('theme-toggle-btn');
  if (!btn) return;
  const light = document.body.classList.contains('theme-light');
  btn.textContent = light ? '🌙 Modo Oscuro' : '☀️ Modo Claro';
}
function applyStoredTheme() {
  if (localStorage.getItem('themePref') === 'light') document.body.classList.add('theme-light');
  _refreshThemeBtn();
}

// ============================================================
// INIT
// ============================================================
loadDB();
autoBackupOnOpen();
applyChurchName();
applyStoredTheme();

if ((DB.usuarios||[]).length) {
  renderLoginWall(); // no entry without a password, every time the app opens
} else {
  renderDashboard();
  _startPendingPoll();
}

// SECURITY: if the browser restores this page from bfcache (e.g. a full
// forward/back navigation across pages, not just the in-app popstate case
// handled above) without re-running this script, force the login wall back
// up unless a session is actually active in memory.
window.addEventListener('pageshow', (e) => {
  if (e.persisted && !_authSession.loggedIn) renderLoginWall();
});

// Poll mobile pending every 8 seconds — only touch the DOM if something actually changed
function _startPendingPoll() {
  if (_startPendingPoll._started) return; // don't stack a second interval on re-login
  _startPendingPoll._started = true;
  let lastPendingCount = (DB.pending||[]).length;
  _serverSyncPull(); // check once immediately so the LAN dot lights up right away
  setInterval(async () => {
    await _serverSyncPull();
    loadMobilePending(() => {
      const c = (DB.pending||[]).length;
      if (c === lastPendingCount) return; // nothing new: skip re-render entirely (no flicker)
      lastPendingCount = c;
      if (_currentModule === 'dashboard') renderDashboard();
      else if (_currentModule === 'aprobaciones') renderAprobaciones();
    });
  }, 8000);
}
