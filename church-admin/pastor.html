<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2445">
<link rel="manifest" href="manifest-pastor.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Resumen Pastoral</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --navy: #0f2445;
    --navy-light: #16345f;
    --gold: #c9a227;
    --gold-light: #e0c25e;
    --bg: #f4f6f9;
    --text: #1c2733;
    --text-muted: #5a6a7a;
    --border: #d8dee5;
    --danger: #b3261e;
    --radius: 10px;
    --surface: #fff;
    --heading: #0f2445;
  }
  :root[data-tema="oscuro"] {
    --navy: #1b3a6b;
    --navy-light: #244b86;
    --gold: #d4af37;
    --bg: #0b1426;
    --surface: #14213a;
    --text: #e6ebf2;
    --text-muted: #9aa8bd;
    --border: #2a3a58;
    --danger: #ff6b61;
    --heading: #e0c25e;
    color-scheme: dark;
  }
  .btnTopIcono { background: transparent; border: 1px solid rgba(255,255,255,0.35); color:#fff; border-radius:8px; padding:5px 9px; cursor:pointer; font-size:1rem; margin-right:6px; }
  .busqItem { display:flex; gap:10px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; }
  .busqItem:hover { background: var(--bg); }
  .busqTipo { font-size:0.7rem; font-weight:700; text-transform:uppercase; color:var(--gold); min-width:78px; }
  .busqGrupo { font-size:0.75rem; font-weight:700; color:var(--text-muted); padding:10px 12px 4px; text-transform:uppercase; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* ── Pantalla de login ────────────────────────────────────────── */
  #pantallaLogin {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-light) 100%);
    padding: 20px;
  }
  .tarjetaLogin {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .tarjetaLogin h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    color: var(--heading);
  }
  .tarjetaLogin .subtitulo {
    margin: 0 0 28px;
    font-size: 0.9rem;
    color: var(--text-muted);
  }
  .campo { margin-bottom: 16px; }
  .campo label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text-muted);
  }
  .campo input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .campo input:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
    border-color: var(--gold);
  }
  .btnPrincipal {
    width: 100%;
    padding: 12px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .btnPrincipal:hover { background: var(--navy-light); }
  .btnPrincipal:disabled { opacity: 0.6; cursor: default; }
  .mensajeError {
    background: #fdeceb;
    color: var(--danger);
    border: 1px solid #f3c6c2;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
  }

  /* ── Shell principal ──────────────────────────────────────────── */
  #pantallaApp { display: none; min-height: 100vh; }
  .topbar {
    background: var(--navy);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar .marca {
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .topbar .marca span { color: var(--gold-light); }
  .topbar .usuarioInfo {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 0.85rem;
  }
  .topbar button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.82rem;
  }
  .topbar button:hover { background: rgba(255,255,255,0.1); }

  .contenido { padding: 28px 24px; max-width: 1100px; margin: 0 auto; }
  .contenido h2 { color: var(--heading); margin-bottom: 4px; }
  .contenido .fecha { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px; }

  .grid-modulos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .tarjetaModulo {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: box-shadow 0.15s, transform 0.15s;
  }
  .tarjetaModulo:hover {
    box-shadow: 0 6px 18px rgba(15,36,69,0.12);
    transform: translateY(-2px);
  }
  .tarjetaModulo { position: relative; overflow: hidden; padding-top: 24px; }
  .tarjetaModulo::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--gold); }
  .tarjetaModulo.c-gold::before { background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
  .tarjetaModulo.c-green::before { background: #3daa6e; }
  .tarjetaModulo.c-red::before { background: #d94f4f; }
  .tarjetaModulo.c-blue::before { background: #3a8cb5; }
  .tarjetaModulo.c-purple::before { background: #8b5cf6; }
  .tarjetaModulo.c-pink::before { background: #ec4899; }
  .tarjetaModulo.c-amber::before { background: #e8a030; }
  .tarjetaModulo.c-teal::before { background: #06b6d4; }
  .tarjetaModulo .icono { font-size: 1.8rem; margin-bottom: 8px; }
  .tarjetaModulo h3 { margin: 0 0 4px; font-size: 1rem; color: var(--heading); }
  .tarjetaModulo p { margin: 0; font-size: 0.8rem; color: var(--text-muted); }
  .tarjetaModulo.deshabilitado { opacity: 0.5; cursor: default; }

  .panelEstado {
    margin-top: 28px;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  .panelEstado strong { color: var(--text); }
  .puntoEstado {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .puntoEstado.ok { background: #2e8b57; }
  .puntoEstado.error { background: var(--danger); }

  /* ── Vista Finanzas ───────────────────────────────────────────── */
  .btnVolver {
    background: none;
    border: none;
    color: var(--heading);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    margin-bottom: 14px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btnVolver:hover { text-decoration: underline; }

  .grid-resumen {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .tarjetaResumen {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }
  .tarjetaResumen .etiqueta {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  .tarjetaResumen .monto {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--heading);
  }
  .tarjetaResumen.ingreso .monto { color: #1f7a4d; }
  .tarjetaResumen.egreso .monto { color: var(--danger); }

  .tablaWrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .tablaWrap h3 {
    margin: 0;
    padding: 16px 18px;
    font-size: 0.95rem;
    color: var(--heading);
    border-bottom: 1px solid var(--border);
  }
  table.tablaTrans { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.tablaTrans th {
    text-align: left;
    padding: 10px 14px;
    background: var(--bg);
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  table.tablaTrans td {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
  }
  table.tablaTrans td.montoIngreso { color: #1f7a4d; font-weight: 600; }
  table.tablaTrans td.montoEgreso { color: var(--danger); font-weight: 600; }
  .estadoCargando, .estadoVacio {
    padding: 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  /* ── Cuidado Pastoral ─────────────────────────────────────────── */
  .tarjetaSeguimiento {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .tarjetaSeguimiento:hover { box-shadow: 0 4px 14px rgba(15,36,69,0.1); }
  .tarjetaSeguimiento .nombrePersona { font-weight: 600; color: var(--heading); margin-bottom: 2px; }
  .tarjetaSeguimiento .metaLinea { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
  .tarjetaSeguimiento .notasPreview { font-size: 0.85rem; color: var(--text); }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-prioridad-Baja { background: #e6f0e9; color: #2e6b47; }
  .badge-prioridad-Media { background: var(--surface)3d6; color: #8a6100; }
  .badge-prioridad-Alta { background: #fde3d3; color: #a34d0a; }
  .badge-prioridad-Urgente { background: #fdeceb; color: var(--danger); }
  .badge-tipo { background: var(--bg); color: var(--text-muted); }
  .proximoVencido { color: var(--danger); font-weight: 600; }
  .badge-estado-Activo { background: #e6f0e9; color: #2e6b47; }
  .badge-estado-Inactivo { background: #eceff2; color: var(--text-muted); }
  .badge-categoria-General { background: var(--bg); color: var(--text-muted); }
  .badge-categoria-Evento { background: #e2edfa; color: #1d5a9e; }
  .badge-categoria-Urgente { background: #fdeceb; color: var(--danger); }
  .subtabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .subtab {
    background: none;
    border: none;
    padding: 10px 16px;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .subtab.activa { color: var(--heading); border-bottom-color: var(--gold); }
  /* Menús visuales (Ver-030): botones con ícono en lugar de pestañas de texto */
  .subtabs { flex-wrap: wrap; gap: 8px; border-bottom: none; padding-bottom: 4px; }
  .subtab {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    min-width: 84px; padding: 10px 10px; margin-bottom: 0;
    background: var(--surface); border: 1px solid var(--border); border-bottom: 1px solid var(--border);
    border-radius: 12px; font-size: 0.74rem; line-height: 1.15; text-align: center;
    transition: background 0.12s, box-shadow 0.12s, transform 0.12s;
  }
  .subtab .stIcon { font-size: 1.35rem; line-height: 1; }
  .subtab:hover { box-shadow: 0 4px 12px rgba(15,36,69,0.12); transform: translateY(-1px); }
  .subtab.activa { background: var(--navy); color: #fff; border-color: var(--navy); border-bottom-color: var(--gold); box-shadow: inset 0 -3px 0 var(--gold); }

  .barraAcciones {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .barraAcciones input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.88rem;
  }
  .btnAccion {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btnAccion:hover { background: var(--navy-light); }
  .btnSecundario {
    background: var(--surface);
    color: var(--heading);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btnSecundario:hover { background: var(--bg); }
  .btnPeligro { color: var(--danger); border-color: #f3c6c2; }

  /* ── Tarjetas visuales estilo A006 (Ver-031) ─────────────────── */
  .grupoTitulo { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 700; margin: 0 0 10px; }
  .btnGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .btnCard {
    position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 14px 14px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
    text-align: left; user-select: none; transition: transform .15s, box-shadow .15s, border-color .15s; -webkit-tap-highlight-color: transparent;
  }
  .btnCard::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--gold); }
  .btnCard.c-gold::before { background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
  .btnCard.c-green::before { background: #3daa6e; }
  .btnCard.c-red::before { background: #d94f4f; }
  .btnCard.c-blue::before { background: #3a8cb5; }
  .btnCard.c-purple::before { background: #8b5cf6; }
  .btnCard.c-pink::before { background: #ec4899; }
  .btnCard.c-amber::before { background: #e8a030; }
  .btnCard.c-teal::before { background: #06b6d4; }
  .btnCard:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 8px 22px rgba(15,36,69,0.14); }
  .btnCard:active { transform: translateY(-1px); }
  .btnCard .bcIcono { font-size: 1.8rem; line-height: 1; margin-bottom: 2px; }
  .btnCard .bcEtiqueta { font-size: 0.88rem; font-weight: 700; color: var(--heading); line-height: 1.25; }
  .btnCard .bcSub { font-size: 0.72rem; color: var(--text-muted); line-height: 1.3; }
  .btnCard .bcBadge { position: absolute; top: 12px; right: 10px; background: var(--gold); color: var(--heading); border-radius: 999px; font-size: 0.68rem; font-weight: 700; padding: 2px 8px; }
  .btnCard.pronto { opacity: 0.55; cursor: default; }
  .btnCard.pronto:hover { transform: none; box-shadow: none; border-color: var(--border); }
  .btnCard.pronto .bcBadge { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
  .cabeceraBalance { background: var(--navy); color: #fff; border-radius: 14px; padding: 18px 20px; margin-bottom: 22px; }
  .cabeceraBalance .cbEtiqueta { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.75; margin-bottom: 4px; }
  .cabeceraBalance .cbMonto { font-size: 2rem; font-weight: 800; color: var(--gold-light); }
  .cabeceraBalance .cbStats { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 8px; font-size: 0.8rem; opacity: 0.9; }
  .cabeceraBalance .cbStats b { font-weight: 700; }
  #printHostDeclaracion { display: none; }
  @media print {
    body.imprimiendoDeclaracion > *:not(#printHostDeclaracion) { display: none !important; }
    body.imprimiendoDeclaracion #printHostDeclaracion { display: block !important; }
  }
  .btnPeligro:hover { background: #fdeceb; }

  .listaPersonas { display: flex; flex-direction: column; gap: 10px; }
  .cardPersona {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .cardPersona:hover { box-shadow: 0 4px 12px rgba(15,36,69,0.08); }
  .cardPersona .nombre { font-weight: 600; color: var(--heading); font-size: 0.95rem; }
  .cardPersona .detalle { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
  .cardPersona .flecha { color: var(--text-muted); }

  .gridFamilias {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .cardFamilia {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .cardFamilia h4 { margin: 0 0 4px; color: var(--heading); font-size: 1rem; }
  .cardFamilia .direccion { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 10px; }
  .cardFamilia ul { margin: 0; padding: 0; list-style: none; }
  .cardFamilia li {
    padding: 6px 0;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .cardFamilia li:first-child { border-top: none; }

  /* ── Modal formulario ─────────────────────────────────────────── */
  .modalOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,36,69,0.5);
    z-index: 100;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: 24px 16px;
  }
  .modalOverlay.abierto { display: flex; }
  .modalCaja {
    background: var(--surface);
    border-radius: var(--radius);
    width: 100%;
    max-width: 560px;
    padding: 28px 26px;
  }
  .modalCaja h3 { margin: 0 0 20px; color: var(--heading); }
  .formGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .formGrid .full { grid-column: 1 / -1; }
  .formGrid label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 5px;
  }
  .formGrid input, .formGrid select, .formGrid textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 0.88rem;
    font-family: inherit;
  }
  .formGrid textarea { resize: vertical; min-height: 60px; }
  .formAcciones {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 22px;
    flex-wrap: wrap;
  }
  .formAcciones .btnPeligro { margin-right: auto; }
  .seccionForm {
    grid-column: 1 / -1;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--heading);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .seccionForm:first-child { margin-top: 0; padding-top: 0; border-top: none; }

  /* ── Móvil (Ver-029) ──────────────────────────────────────────── */
  @media (max-width: 720px) {
    .topbar { padding: 10px 12px; gap: 8px; }
    .topbar .usuarioInfo { gap: 8px; min-width: 0; }
    .topbar #nombreUsuarioTop { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.75rem; }
    .contenido { padding: 16px 12px; }
    .contenido h2 { font-size: 1.25rem; }
    .contenido .fecha { margin-bottom: 14px; }
    .grid-modulos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .tarjetaModulo { padding: 14px 12px; }
    .tarjetaModulo:hover { transform: none; }
    .grid-resumen { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
    .tarjetaResumen { padding: 12px; }
    .tarjetaResumen .etiqueta { font-size: 0.68rem; }
    .tarjetaResumen .monto { font-size: 1.15rem; word-break: break-word; }
    /* pestañas con desplazamiento horizontal */
    .subtabs { gap: 6px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin-left: -12px; margin-right: -12px; padding: 0 12px; }
    .subtabs::-webkit-scrollbar { display: none; }
    .subtab { flex-shrink: 0; white-space: nowrap; min-width: 74px; padding: 8px 8px; font-size: 0.7rem; }
    .subtab:hover { transform: none; }
    /* barras de acciones */
    .barraAcciones > * { flex: 1 1 auto; }
    .barraAcciones > div[style*="flex:1"] { display: none; }
    .barraAcciones input[type="text"] { flex-basis: 100%; min-width: 0; }
    .barraAcciones label { flex: 1 1 100%; }
    .barraAcciones label input { width: 100%; }
    .barraAcciones select { min-width: 0; max-width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    input, select, textarea { font-size: 16px !important; }
    .btnAccion, .btnSecundario, .btnPrincipal { min-height: 42px; }
    /* tarjetas de lista */
    .tarjetaSeguimiento { flex-wrap: wrap; padding: 12px; }
    .tarjetaSeguimiento > div[style*="flex:1"] { flex-basis: 100%; }
    .cardPersona { padding: 12px; }
    .gridFamilias { grid-template-columns: 1fr; }
    /* tablas: desplazamiento horizontal */
    .tablaWrap { overflow-x: auto; }
    table.tablaTrans { min-width: 0; width: 100%; table-layout: auto; font-size: 0.78rem; }
    table.tablaTrans th, table.tablaTrans td { padding: 7px 5px; }
    table.tablaTrans td { max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    table.tablaTrans td.montoIngreso, table.tablaTrans td.montoEgreso, table.tablaTrans td:last-child, table.tablaTrans td[style*="text-align:right"] { max-width: none; overflow: visible; text-overflow: clip; }
    table.tablaTrans th { white-space: nowrap; font-size: 0.7rem; }
    /* modales casi a pantalla completa */
    .modalOverlay { padding: 0; }
    .modalCaja { max-width: none !important; min-height: 100%; border-radius: 0; padding: 18px 14px 28px; }
    .formGrid { grid-template-columns: 1fr; gap: 12px; }
    .formAcciones { position: sticky; bottom: 0; background: var(--surface); padding: 10px 0 4px; margin-top: 16px; border-top: 1px solid var(--border); }
    .formAcciones { align-items: stretch; }
    .formAcciones button { flex: 1 1 auto; }
    .formAcciones .btnPeligro { margin-right: 0; }
    #declaracionContenido { overflow-x: auto; }
    .tarjetaLogin { padding: 28px 20px; }
    .btnGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .btnCard { padding: 18px 12px 12px; }
    .cabeceraBalance { padding: 14px 16px; }
    .cabeceraBalance .cbMonto { font-size: 1.6rem; }
  }

  #pinBox { max-width: 340px; margin: 60px auto; text-align: center; padding: 0 16px; }
  #pinBox h2 { margin-bottom: 6px; }
  .dots { display: flex; justify-content: center; gap: 14px; margin: 18px 0; }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gold); }
  .dot.on { background: var(--gold); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 280px; margin: 0 auto; }
  .pad button { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; color: var(--heading); font-size: 24px; padding: 16px 0; cursor: pointer; }
  .pad button:active { transform: scale(.95); }
  #msg { color: var(--danger); font-size: 0.9rem; min-height: 22px; margin-top: 14px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="marca">Church <span>Admin</span> <span style="font-size:0.7rem; font-weight:600; opacity:0.85; margin-left:6px;" id="versionTopbar">Ver-043</span></div>
  <div class="usuarioInfo">
    <button class="btnTopIcono" id="btnInstalar" style="display:none;" onclick="instalar()" aria-label="Instalar">📲</button><button class="btnTopIcono" id="btnTema" onclick="alternarTema()" aria-label="Tema">🌙</button>
    <button id="btnSalir" style="display:none;" onclick="salir()">Salir</button>
  </div>
</div>
<div class="contenido">
<div id="pinBox">
  <h2>Resumen Pastoral</h2>
  <p class="fecha">Escribe tu PIN de 4 números</p>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="pad" id="pad"></div>
  <div id="msg"></div>
</div>
<div id="vista" style="display:none;">
  <h2>Resumen Pastoral</h2>
  <p class="fecha" id="rpSubtitulo"></p>
  <div class="barraAcciones" style="align-items:center;">
    <select id="rpTipoPeriodo" onchange="cargar()"><option value="dia">Día</option><option value="semana">Semana</option><option value="mes" selected>Mes</option><option value="anio">Año</option></select>
    <input type="date" id="rpFechaAncla" onchange="cargar()">
  </div>
  <div class="grid-resumen">
    <div class="tarjetaResumen ingreso"><div class="etiqueta">Diezmos</div><div class="monto" id="rpTotalDiezmos">—</div></div>
    <div class="tarjetaResumen ingreso"><div class="etiqueta">Ofrendas</div><div class="monto" id="rpTotalOfrendas">—</div></div>
    <div class="tarjetaResumen ingreso"><div class="etiqueta">Donaciones</div><div class="monto" id="rpTotalDonaciones">—</div></div>
    <div class="tarjetaResumen egreso"><div class="etiqueta">Gastos</div><div class="monto" id="rpTotalGastos">—</div></div>
    <div class="tarjetaResumen"><div class="etiqueta">Balance General</div><div class="monto" id="rpBalanceGeneral">—</div></div>
  </div>
  <div class="tablaWrap" style="margin-bottom:20px;"><h3>Quiénes dieron (diezmos + donaciones)</h3><div id="rpQuienesDieron"></div></div>
  <div class="grid-resumen" style="margin-bottom:20px;">
    <div class="tarjetaResumen"><div class="etiqueta">Total Asistentes</div><div class="monto" id="rpTotalAsistentes">—</div></div>
    <div class="tarjetaResumen"><div class="etiqueta">Total Visitas</div><div class="monto" id="rpTotalVisitas">—</div></div>
  </div>
  <div class="tablaWrap"><h3>Asistencia por tipo de servicio</h3><div id="rpAsistenciaPorServicio"></div></div>
</div>
</div>
<script>
const sb = supabase.createClient('https://mhdzugfaykazcwbvcrkh.supabase.co', 'sb_publishable_8g4MN2pEDMIo0PUetbcXuQ_Bw13eMcO', { auth: { persistSession: false } });
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n || 0);
const fecha = iso => { const [y, m, d] = String(iso).split('-'); return `${m}/${d}/${y}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pin = '', clave = '';
function aplicarTema(t) {
  if (t === 'oscuro') document.documentElement.setAttribute('data-tema', 'oscuro'); else document.documentElement.removeAttribute('data-tema');
  $('btnTema').textContent = t === 'oscuro' ? '☀️' : '🌙';
}
function alternarTema() {
  const n = document.documentElement.getAttribute('data-tema') === 'oscuro' ? 'claro' : 'oscuro';
  aplicarTema(n); try { localStorage.setItem('ca_tema', n); } catch (e) {}
}
(function () { let t = 'claro'; try { t = localStorage.getItem('ca_tema') || 'claro'; } catch (e) {} aplicarTema(t); })();
const hoy = new Date(); $('rpFechaAncla').value = new Date(hoy - hoy.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
$('pad').innerHTML = [1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k === '' ? '<span></span>' : `<button onclick="tecla('${k}')">${k}</button>`).join('');
function pintar() { document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i < pin.length)); }
function tecla(k) {
  if (k === '⌫') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
  pintar();
  if (pin.length === 4) { clave = pin; pin = ''; setTimeout(pintar, 150); entrar(); }
}
async function entrar() {
  $('msg').textContent = '';
  if (await cargar()) { $('pinBox').style.display = 'none'; $('vista').style.display = ''; $('btnSalir').style.display = ''; }
}
const tabla = (enc, filas) => `<table class="tablaTrans"><thead><tr>${enc.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${filas.join('')}</tbody></table>`;
async function cargar() {
  const tipo = $('rpTipoPeriodo').value;
  const { data, error } = await sb.rpc('pastor_resumen2', { p_pin: clave, p_tipo: tipo, p_fecha: $('rpFechaAncla').value });
  if (error) { $('msg').textContent = 'No se pudo conectar. ¿Ya se corrió el SQL 11?'; return false; }
  if (data.error) {
    $('msg').textContent = { pin: 'PIN incorrecto.', bloqueado: 'Demasiados intentos. Espera 15 minutos.', no_configurado: 'El PIN todavía no está configurado.' }[data.error] || 'Error.';
    return false;
  }
  $('rpSubtitulo').textContent = `${{ dia: 'Día', semana: 'Semana', mes: 'Mes', anio: 'Año' }[tipo]}: ${fecha(data.inicio)} — ${fecha(data.fin)}`;
  $('rpTotalDiezmos').textContent = money(data.diezmos); $('rpTotalOfrendas').textContent = money(data.ofrendas);
  $('rpTotalDonaciones').textContent = money(data.donaciones); $('rpTotalGastos').textContent = money(data.gastos);
  $('rpBalanceGeneral').textContent = money(data.diezmos + data.ofrendas + data.donaciones - data.gastos);
  $('rpQuienesDieron').innerHTML = data.quienes.length ? tabla(['Persona', 'Total'], data.quienes.map(x => `<tr><td>${esc(x.nombre)}</td><td class="montoIngreso">${money(x.total)}</td></tr>`)) : '<div class="estadoVacio">Sin registros en este periodo.</div>';
  $('rpTotalAsistentes').textContent = data.asistentes; $('rpTotalVisitas').textContent = data.visitas;
  $('rpAsistenciaPorServicio').innerHTML = data.por_servicio.length ? tabla(['Tipo de servicio', 'Asistentes'], data.por_servicio.map(x => `<tr><td>${esc(x.nombre)}</td><td>${x.total}</td></tr>`)) : '<div class="estadoVacio">Sin registros de asistencia en este periodo.</div>';
  return true;
}
function salir() { clave = ''; $('vista').style.display = 'none'; $('btnSalir').style.display = 'none'; $('pinBox').style.display = ''; }
let ev = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; $('btnInstalar').style.display = ''; });
async function instalar() { if (ev) { ev.prompt(); ev = null; $('btnInstalar').style.display = 'none'; } }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
